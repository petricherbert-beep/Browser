<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS DEBUG ULTRA PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* PANEL */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 340px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

button {
  margin-top:6px;
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#1f1f1f;
  color:white;
  cursor:pointer;
  font-size:12px;
}

#log {
  font-size: 11px;
  max-height: 120px;
  overflow:auto;
  background:#000;
  padding:6px;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS DEBUG SYSTEM</b>

  <button onclick="navigationMode=!navigationMode">
    📍 Toggle Navigation
  </button>

  <hr>

  <div id="list"></div>

  <hr>

  <div id="infoBox">👆 Select device</div>

  <div id="log"></div>
</div>

<div id="map"></div>

<script>

console.log("SCRIPT START");

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const headingState = {};

let followedId = null;
let navigationMode = false;

/* =========================
   DEBUG LOG
========================= */
function log(msg){
  console.log(msg);
  const el = document.getElementById("log");
  el.innerHTML = msg + "<br>" + el.innerHTML;
}

/* =========================
   SAFE NUMBER
========================= */
function n(v){
  const x = Number(v);
  return Number.isFinite(x) ? x : null;
}

/* =========================
   ICON (VISIBLE + OUTLINE)
========================= */
function icon(angle, name="") {

  const color =
    name.toLowerCase().includes("nicole") ? "#ff3b30" :
    name.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        position:relative;
        transform:rotate(${angle}deg);
        font-size:44px;
        color:${color};
        text-shadow:
          -1px -1px 0 black,
           1px -1px 0 black,
          -1px  1px 0 black,
           1px  1px 0 black;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:14px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize:[44,44],
    iconAnchor:[22,22]
  });
}

/* =========================
   BEARING
========================= */
function bearing(a,b,c,d){

  const toRad = x => x*Math.PI/180;
  const toDeg = x => x*180/Math.PI;

  const dLon = toRad(d-b);

  const y = Math.sin(dLon)*Math.cos(toRad(c));
  const x =
    Math.cos(toRad(a))*Math.sin(toRad(c)) -
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* =========================
   INFO
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML=`
    <b>${d.name}</b><br><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
    🎯 ${d.accuracy} m<br>
    📡 ${d.status}<br>
  `;
}

/* =========================
   UPDATE CORE
========================= */
function update(d){

  log("UPDATE " + d.deviceId + " " + d.lat + "," + d.lon);

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null){
    log("❌ INVALID DATA");
    return;
  }

  const id = d.deviceId;

  const prev = markers[id]?.getLatLng();

  let ang = headingState[id] || 0;

  if(prev){
    ang = bearing(prev.lat, prev.lng, lat, lon);
    headingState[id] = ang;
  }

  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(ang, d.name)
    }).addTo(map);

    markers[id].on("click",()=>{
      followedId = id;
      navigationMode = true;
      showInfo(d);
      map.setView([lat, lon], 17);
    });

    render(d);
  } else {
    markers[id].setLatLng([lat, lon]);
    markers[id].setIcon(icon(ang, d.name));
  }

  if(navigationMode && id === followedId){
    const offset = 0.0009;
    const rad = ang * Math.PI / 180;

    map.panTo([
      lat + Math.cos(rad)*offset,
      lon + Math.sin(rad)*offset
    ], {animate:true, duration:0.25});
  }

  if(followedId === id){
    showInfo(d);
  }
}

/* =========================
   LIST
========================= */
function render(d){

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className="device";

  div.innerHTML=`
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick=()=>{
    followedId = d.deviceId;
    navigationMode = true;
    showInfo(d);
    map.setView([d.lat, d.lon], 17);
  };

  el.appendChild(div);
}

/* =========================
   LOAD
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(update);
  data.forEach(render);
}

load();

/* =========================
   WS DEBUG
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onopen = ()=>log("WS CONNECTED");

ws.onmessage = (m)=>{
  log("WS RAW " + m.data);
  try{
    update(JSON.parse(m.data));
  }catch(e){
    log("PARSE ERROR");
  }
};

ws.onerror = (e)=>log("WS ERROR");

</script>

</body>
</html>
