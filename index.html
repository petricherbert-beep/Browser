<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS WATCH FIXED UI</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 340px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 12px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

button {
  margin: 3px;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.alarm { background:#ff3b30; color:white; }
.stop { background:#34c759; color:white; }
.follow { background:#0a84ff; color:white; }
.watch { background:#ffcc00; color:black; }

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.2); opacity: 0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS WATCH SYSTEM</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const list = [];
const last = {};
const angles = {};

/* ================= HELPERS ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function getColor(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ================= ICON ================= */
function icon(name, angle, alarm, accuracy, isWatched){

  const color = getColor(name);
  const letter = (name?.[0] || "?").toUpperCase();
  const acc = accuracy ? Math.max(20, Math.min(accuracy, 120)) : 60;

  return L.divIcon({
    className:"",
    html: `
      <div style="
        width:70px;
        height:70px;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
      ">

        <!-- WATCH RING (FIXED CENTER) -->
        ${isWatched ? `
          <div style="
            position:absolute;
            width:86px;
            height:86px;
            border:2px solid gold;
            border-radius:50%;
            animation:pulse 1.6s infinite;
            pointer-events:none;
          "></div>
        ` : ''}

        <!-- ACCURACY -->
        <div style="
          position:absolute;
          width:${acc}px;
          height:${acc}px;
          border:2px solid rgba(255,255,255,0.2);
          border-radius:50%;
          pointer-events:none;
        "></div>

        <!-- ARROW -->
        <div style="
          font-size:38px;
          color:${color};
          transform: rotate(${angle}deg);
        ">➤</div>

        <!-- LETTER -->
        <div style="
          position:absolute;
          top:6px;
          width:18px;
          height:18px;
          border-radius:50%;
          background:rgba(0,0,0,0.65);
          color:white;
          font-size:11px;
          display:flex;
          align-items:center;
          justify-content:center;
        ">
          ${letter}
        </div>

      </div>
    `,
    iconSize:[70,70],
    iconAnchor:[35,35]
  });
}

/* ================= UPDATE ================= */
function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);
  if(lat===null||lon===null) return;

  const prev = last[id];

  let angle = 0;
  if(prev) angle = bearing(prev.lat,prev.lon,lat,lon);

  angles[id] = angle;
  last[id] = {lat,lon};

  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angle, d.alarmActive, d.accuracy, d.isWatched)
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name, angle, d.alarmActive, d.accuracy, d.isWatched));

  const ex = list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  render();
}

/* ================= UI ================= */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
      📡 ${d.accuracy ?? "?"} m<br>
      🔋 ${d.battery ?? "?"}%<br>
      👁 Watched: ${d.isWatched ? "YES" : "NO"}<br><br>

      <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
      <button onclick="unwatch('${d.deviceId}')">Unwatch</button>
    `;

    el.appendChild(div);
  });
}

/* ================= ACTIONS ================= */
function watch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/watch",{method:"POST"});
}

function unwatch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/unwatch",{method:"POST"});
}

/* ================= LOAD ================= */
async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d = await r.json();
  d.forEach(update);
}
load();

/* ================= WS ================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage = (m)=>{ try{ update(JSON.parse(m.data)); }catch(e){} };

</script>
</body>
</html>
