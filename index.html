<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center PRO</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:0 0 20px rgba(0,255,200,0.15);
}

#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  filter:brightness(0.8) saturate(1.1);
  box-shadow:0 0 40px rgba(0,255,200,0.2);
}

#map.alarm{
  animation: alarmFlash 0.5s infinite;
  box-shadow:0 0 60px rgba(255,0,0,0.4);
}

@keyframes alarmFlash{
  0%,100%{filter:brightness(0.8) saturate(1.2);}
  50%{filter:brightness(1.6) saturate(2);}
}

.device{
  padding:10px;
  margin-bottom:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(0,255,200,0.1);
}

button{
  margin:2px;
  padding:5px 8px;
  font-size:12px;
  border-radius:8px;
  background:#0a141f;
  color:#c9d1d9;
  border:1px solid rgba(0,255,200,0.15);
  cursor:pointer;
}

.active-follow{color:#3aa0ff}
.active-track{color:#00ffb3}
.active-watch{color:#ffd84d}
.active-alarm{color:#ff4d4d}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center PRO</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const replayState = {};

let followId = null;

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* ================= HELPERS ================= */
function color(name){
  if(!name) return "#00ffb3";
  name=name.toLowerCase();
  if(name.includes("oliver")) return "#3aa0ff";
  if(name.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

function safeNum(v){
  const n = +v;
  return Number.isFinite(n) ? n : null;
}

/* ================= ICON ================= */
function icon(name){
  const c=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    html:`
      <div style="color:${c};font-size:18px;font-weight:bold;">
        ▲ ${letter}
      </div>
    `
  });
}

/* ================= TRACK ================= */
function addTrack(id,lat,lon){
  const t = tracks[id] || (tracks[id]={pts:[]});

  const last = t.pts[t.pts.length-1];
  if(last){
    const dx = last[0]-lat;
    const dy = last[1]-lon;
    if(Math.sqrt(dx*dx+dy*dy) < 0.00003) return;
  }

  t.pts.push([lat,lon]);
  if(t.pts.length>50) t.pts.shift();

  if(!t.poly){
    t.poly = L.polyline([],{
      color:color(devices[id]?.name),
      weight:3,
      opacity:0.4
    }).addTo(map);
  }

  t.poly.setLatLngs(t.pts);
}

/* ================= ALARM UI ================= */
function updateAlarmUI(){
  const any = Object.values(devices).some(d => d?.alarmActive);
  document.getElementById("map").classList.toggle("alarm", any);
}

/* ================= CLEAR TRACK ================= */
function clearTrack(id){
  const t = tracks[id];
  if(!t) return;

  if(t.poly) map.removeLayer(t.poly);
  delete tracks[id];
}

/* ================= REPLAY ================= */
function startReplay(id,speed=600){
  const t = tracks[id];
  if(!t || !t.pts.length || replayState[id]) return;

  let i=0;

  const m = L.circleMarker(t.pts[0],{
    radius:6,
    color:"#fff",
    fillColor:"#fff",
    fillOpacity:1
  }).addTo(map);

  replayState[id]=m;

  function step(){
    if(i>=t.pts.length){
      map.removeLayer(m);
      delete replayState[id];
      return;
    }
    m.setLatLng(t.pts[i++]);
    setTimeout(step,speed);
  }

  step();
}

/* ================= UPDATE (CORE FIX) ================= */
function update(d){
  if(!d || !d.deviceId) return;

  const id = d.deviceId;

  const lat = safeNum(d.lat);
  const lon = safeNum(d.lon);

  if(lat===null || lon===null) return;

  /* ===== DEVICE MERGE (WICHTIG FIX) ===== */
  devices[id] = {
    ...(devices[id] || {}),
    ...d
  };

  ui[id] = ui[id] || {follow:false,track:false,watch:false};

  /* ===== MARKER ===== */
  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name)
    }).addTo(map);
  } else {
    markers[id].setLatLng([lat,lon]);
  }

  /* ===== TRACK ===== */
  if(ui[id].track){
    addTrack(id,lat,lon);
  }

  /* ===== FOLLOW ===== */
  if(followId===id){
    map.panTo([lat,lon]);
  }

  updateAlarmUI();
  render();
}

/* ================= UI ================= */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{

    el.innerHTML+=`
     <div class="info"> 
     📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br> 
     ⚡ ${d.speed ?? 0} km/h<br> 
     🔋 ${d.battery ?? "-"}%<br> 🚶 ${d.isMotion ? "MOVING":"STILL"}<br> 
     📶 ${d.isWifi ? "WIFI":"MOBILE"}<br> 
     🔒 ${d.isLocked ? "LOCKED":"UNLOCKED"}<br> 👀 ${d.isWatched ? "WATCHED":"NO"}<br> 
     🚨 ${d.lastEvent ?? ""} </div>
  <button class="${u.follow?'active-follow':''}" onclick="toggle('${id}','follow')">FOLLOW</button>
  <button class="${u.track?'active-track':''}" onclick="toggle('${id}','track')">TRACK</button>
  <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
  <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
  <button onclick="startReplay('${id}',600)">REPLAY</button>
  <button onclick="clearTrack('${id}')">CLEAR</button>
      </div>
    `;
  });
}

/* ================= TOGGLES ================= */
function toggle(id,k){
  ui[id][k]=!ui[id][k];
  if(k==="follow") followId=ui[id].follow?id:null;
  render();
}

function watch(id){
  ui[id].watch=!ui[id].watch;
  render();
}

function alarm(id){
  devices[id].alarmActive=!devices[id].alarmActive;
  updateAlarmUI();
  render();
}

/* ================= WS ================= */
function connectWS(){
  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (e)=>{
    try{
      const d = JSON.parse(e.data);
      if(Array.isArray(d)) d.forEach(update);
      else update(d);
    }catch(err){}
  };

  ws.onclose = ()=>setTimeout(connectWS,2000);
}

connectWS();

</script>
</body>
</html>
