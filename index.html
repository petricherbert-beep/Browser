<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS PRO TRACKING UI</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 320px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 12px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

button {
  margin: 3px;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.alarm { background:#ff3b30; color:white; }
.stop { background:#34c759; color:white; }
.follow { background:#0a84ff; color:white; }

.pulse {
  position:absolute;
  width:60px;
  height:60px;
  border:3px solid red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform:scale(1); opacity:0.9; }
  100% { transform:scale(2); opacity:0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS PRO TRACKING</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

console.log("GPS SYSTEM STARTED");

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const trails = {};
const last = {};
const list = [];
const alarmState = {};

let followId = null;
let autoFollow = false;

/* ================= AUDIO ================= */
const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;

let audioReady = false;
document.addEventListener("click",()=>{
  if(!audioReady){
    alarmAudio.play().then(()=>{
      alarmAudio.pause();
      audioReady = true;
    }).catch(()=>{});
  }
});

/* ================= HELPERS ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function distance(a,b,c,d){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const d1=toRad(c-a),d2=toRad(d-b);
  const x=Math.sin(d1/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(d2/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function speak(t){
  const m=new SpeechSynthesisUtterance(t);
  m.lang="de-DE";
  speechSynthesis.cancel();
  speechSynthesis.speak(m);
}

/* ================= ICON FIXED ================= */
function icon(name, angle, alarm){

  const n = (name || "").toLowerCase();

  const color =
    n.includes("oliver") ? "#0a84ff" :
    n.includes("nicole") ? "#ff3b30" :
    "#2ecc71";

  let letter = "?";
  if(n.includes("oliver")) letter = "O";
  else if(n.includes("nicole")) letter = "N";
  else letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    html:`
      <div style="position:relative;width:60px;height:60px;">

        ${alarm ? '<div class="pulse"></div>' : ''}

        <!-- ARROW -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(${angle}deg);
          font-size:42px;
          color:${color};
          text-shadow:0 0 6px rgba(0,0,0,0.6);
        ">
          ➤
        </div>

        <!-- LETTER -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%);
          font-size:14px;
          font-weight:700;
          color:white;
          text-shadow:0 0 3px rgba(0,0,0,0.9);
        ">
          ${letter}
        </div>

      </div>
    `,
    iconSize:[60,60],
    iconAnchor:[30,30]
  });
}

/* ================= UPDATE ================= */
function update(d){

  if(!d?.deviceId) return;

  const id=d.deviceId;
  const lat=n(d.lat);
  const lon=n(d.lon);

  if(lat===null || lon===null) return;

  const prev=last[id];

  if(prev){
    const dist=distance(prev.lat,prev.lon,lat,lon);
    if(dist<3) return;
  }

  let angle=0;
  if(prev) angle=bearing(prev.lat,prev.lon,lat,lon);

  last[id]={lat,lon};

  if(!trails[id]) trails[id]=[];
  trails[id].push([lat,lon]);
  if(trails[id].length>60) trails[id].shift();

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name,angle,d.alarmActive)
    }).addTo(map);

    markers[id].trail=L.polyline([],{
      color:"#0a84ff",
      weight:3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,angle,d.alarmActive));
  markers[id].trail.setLatLngs(trails[id]);

  const ex=list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  /* ALARM */
  if(d.alarmActive && !alarmState[id]){
    alarmState[id]=true;
    if(audioReady) alarmAudio.play();
    speak("Alarm bei "+d.name);
    map.flyTo([lat,lon],18);
  }

  if(!d.alarmActive && alarmState[id]){
    alarmState[id]=false;
    alarmAudio.pause();
    speak("Alarm beendet bei "+d.name);
  }

  /* FOLLOW */
  if(followId===id){
    map.panTo([lat,lon]);
  }

  if(autoFollow && followId===id && d.speed>1){
    map.panTo([lat,lon]);
  }

  render();
}

/* ================= RENDER ================= */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      🚗 ${d.speed} km/h<br>
      🔋 ${d.battery}%<br><br>

      <button class="alarm" onclick="alarm('${d.deviceId}')">Alarm</button>
      <button class="stop" onclick="stop('${d.deviceId}')">Stop</button>
      <button class="follow" onclick="follow('${d.deviceId}')">Follow</button>
      <button onclick="auto()">Auto</button>
    `;

    el.appendChild(div);
  });
}

/* ================= ACTIONS ================= */
function alarm(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=true",{method:"POST"});
}

function stop(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=false",{method:"POST"});
}

function follow(id){
  followId=id;
}

function auto(){
  autoFollow=!autoFollow;
}

/* ================= LOAD ================= */
async function load(){
  try{
    const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
    const d=await r.json();
    if(Array.isArray(d)) d.forEach(update);
  }catch(e){
    console.error(e);
  }
}
load();

/* ================= WS ================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  try{update(JSON.parse(m.data));}catch(e){}
};

</script>
</body>
</html>
