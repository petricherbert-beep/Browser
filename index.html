<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* PANEL */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 330px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.78);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

button {
  margin-top:6px;
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#1f1f1f;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#2a2a2a;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 ULTRA PRO TRACKER</b>

  <div style="margin-top:8px;">
    <button onclick="toggleCompass()">🧭 Compass Mode</button>
    <button onclick="navigationMode=true">📍 Navigation Mode</button>
  </div>

  <hr>

  <div id="list"></div>

  <hr>

  <div id="infoBox">👆 Select device</div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const current = {};
const target = {};
const last = {};
const headingState = {};
const names = {};

let followedId = null;
let navigationMode = false;
let compassMode = false;

/* =========================
   BEARING
========================= */
function bearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;

  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* =========================
   CAR CAMERA (FIXED)
========================= */
function followCar(lat, lon, heading) {

  const offset = 0.0012;
  const rad = heading * Math.PI / 180;

  const camLat = lat - Math.cos(rad) * offset;
  const camLon = lon - Math.sin(rad) * offset;

  map.setView([camLat, camLon], map.getZoom(), {
    animate: true,
    duration: 0.25
  });
}

/* =========================
   ICON
========================= */
function icon(angle,name="") {

  const n = (name||"").toLowerCase();

  let color = "#2ecc71";
  if (n.includes("nicole")) color = "#ff3b30";
  if (n.includes("oliver")) color = "#0a84ff";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        transform:rotate(${angle}deg);
        font-size:42px;
        color:${color};
        position:relative;
        text-shadow:0 0 6px rgba(0,0,0,0.6);
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:14px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize:[44,44],
    iconAnchor:[22,22]
  });
}

/* =========================
   INFO PANEL
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML=`
    <b>${d.name}</b><br><br>

    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
    🎯 ${d.accuracy} m<br>
    📡 ${d.status}<br>

    <hr>

    <button onclick="setAlarm('${d.deviceId}', true)">🚨 Alarm ON</button>
    <button onclick="setAlarm('${d.deviceId}', false)">🔕 Alarm OFF</button>

    <button onclick="watch('${d.deviceId}')">👁 Watch ON</button>
    <button onclick="unwatch('${d.deviceId}')">🚫 Watch OFF</button>
  `;
}

/* =========================
   API
========================= */
async function setAlarm(id,v){
  await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${v}`,{method:"POST"});
}

async function watch(id){
  await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch?watcherId=web`,{method:"POST"});
}

async function unwatch(id){
  await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
}

/* =========================
   LIST
========================= */
function render(list){

  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{
    names[d.deviceId]=d.name;

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      🚗 ${d.speed} km/h<br>
      🔋 ${d.battery}%
    `;

    div.onclick=()=>{
      followedId=d.deviceId;
      navigationMode=true;
      showInfo(d);
      map.setView([d.lat,d.lon],17);
    };

    el.appendChild(div);
  });
}

/* =========================
   UPDATE
========================= */
function update(d){

  const {deviceId,lat,lon}=d;

  names[deviceId]=d.name;

  target[deviceId]={lat,lon};

  if(!current[deviceId]){
    current[deviceId]={lat,lon};
  }

  if(!markers[deviceId]){
    markers[deviceId]=L.marker([lat,lon],{
      icon:icon(0,d.name)
    }).addTo(map);

    markers[deviceId].on("click",()=>{
      followedId=deviceId;
      navigationMode=true;
      showInfo(d);
    });
  }

  if(followedId===deviceId){
    showInfo(d);
  }
}

/* =========================
   ENGINE (FIXED + STABLE)
========================= */
function animate(){

  Object.keys(target).forEach(id=>{

    const c=current[id];
    const t=target[id];

    if(!c||!t) return;

    // smoothing position
    const nl=c.lat + (t.lat - c.lat)*0.12;
    const no=c.lon + (t.lon - c.lon)*0.12;

    let ang=0;

    const prev=last[id];

    if(prev){
      let raw=bearing(prev.lat,prev.lon,nl,no);

      if(!headingState[id]) headingState[id]=raw;

      let diff=raw-headingState[id];

      if(diff>180) diff-=360;
      if(diff<-180) diff+=360;

      headingState[id]+=diff*0.18;

      ang=headingState[id];
    }

    last[id]={lat:nl,lon:no};

    c.lat=nl;
    c.lon=no;

    if(markers[id]){
      markers[id].setLatLng([nl,no]);
      markers[id].setIcon(icon(ang,names[id]||""));
    }

    // NAVIGATION MODE
    if(navigationMode && id===followedId){
      followCar(nl,no,ang);
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   MODE
========================= */
function toggleCompass(){
  compassMode=!compassMode;
}

/* =========================
   LOAD
========================= */
async function load(){
  const res=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await res.json();

  render(data);
  data.forEach(update);
}

load();

/* =========================
   WS
========================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  const d=JSON.parse(m.data);
  update(d);
};

</script>

</body>
</html>
