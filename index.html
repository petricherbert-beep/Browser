<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<meta name="theme-color" content="#05070b">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.app-frame{
  position:fixed;
  inset:0;
  background:#070a0f;
  z-index:0;
}

.glow-box{
  backdrop-filter:blur(10px);
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.12),
    0 0 50px rgba(0,255,200,0.08);
}

#panel{
  width:390px;
  margin:1.5cm 0 1.5cm 1.5cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  z-index:9999;
}

#map{
  flex:1;
  margin:1.5cm 1.5cm 1.5cm 1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;

  animation: mapGlowPulse 5s ease-in-out infinite;
}

@keyframes mapGlowPulse {
  0% {
    box-shadow:
      0 0 25px rgba(0,255,200,0.12),
      0 0 60px rgba(0,255,200,0.18);
  }
  50% {
    box-shadow:
      0 0 35px rgba(0,255,200,0.18),
      0 0 85px rgba(0,255,200,0.22);
  }
  100% {
    box-shadow:
      0 0 25px rgba(0,255,200,0.12),
      0 0 60px rgba(0,255,200,0.18);
  }
}

.device{
  margin-top:10px;
  padding:12px;
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  border:1px solid rgba(0,255,200,0.08);
}

button{
  margin:3px 2px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:rgba(10,20,30,0.6);
  color:#c9d1d9;
  cursor:pointer;
}

button:hover{
  transform:translateY(-1px);
  border-color:rgba(0,255,200,0.5);
}

.active-follow{color:#3aa0ff;border-color:#3aa0ff;}
.active-track{color:#00ffb3;border-color:#00ffb3;}
.active-alarm{color:#ff4d4d;border-color:#ff4d4d;}
.active-watch{color:#ffd84d;border-color:#ffd84d;}

.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
}

.online{color:#00ff7b;border-color:#00ff7b55;}
.offline{color:#ff3b3b;border-color:#ff3b3b55;}
.alarmChip{color:#ff3b3b;border-color:#ff3b3b55;}
</style>
</head>

<body>

<div class="app-frame"></div>

<div id="panel" class="glow-box">
  <b>🚗 GPS Control Center</b><br>
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>
const state = { devices: {} };
const markers = {};
const tracks = {};

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* COLOR */
function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON (mit schwarzem Rand) */
function icon(name){
  const col=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="display:flex;align-items:center;justify-content:center;">
        <div style="
          font-size:26px;
          color:${col};
          text-shadow:
            -1px -1px 0 rgba(0,0,0,0.9),
             1px -1px 0 rgba(0,0,0,0.9),
            -1px  1px 0 rgba(0,0,0,0.9),
             1px  1px 0 rgba(0,0,0,0.9);
        ">▲</div>
        <div style="position:absolute;font-size:10px;color:white;font-weight:700;">
          ${letter}
        </div>
      </div>
    `
  });
}

/* TRACK LIMIT */
function addTrackPoint(id, lat, lon){
  const track = tracks[id];
  if(!track) return;

  const points = track.getLatLngs();
  points.push([lat, lon]);

  if(points.length > 500){
    track.setLatLngs(points.slice(-400));
  } else {
    track.setLatLngs(points);
  }
}

/* UPDATE */
function update(d){
  const id = d.deviceId;

  const lat = +d.lat, lon = +d.lon;
  if (lat == null || lon == null || Number.isNaN(lat) || Number.isNaN(lon)) return;

  if(!state.devices[id]){
    state.devices[id] = {
      ui:{ follow:false, track:false, watch:false }
    };
  }

  Object.assign(state.devices[id], d);

  if(!markers[id]){
    markers[id] = L.marker([lat,lon], { icon: icon(d.name) }).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 4,
    opacity: 0.25
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  addTrackPoint(id, lat, lon);

  if(state.devices[id].ui.follow){
    map.panTo([lat,lon], { animate:true });
  }

  render();
}

/* FOLLOW */
function follow(id){
  const d = state.devices[id];
  if(!d) return;

  d.ui.follow = !d.ui.follow;

  if(d.ui.follow){
    map.flyTo([d.lat, d.lon], Math.max(map.getZoom(), 16));
  }

  render();
}

/* TRACK */
function toggleTrack(id){
  const d = state.devices[id];
  if(!d) return;

  d.ui.track = !d.ui.track;

  if(tracks[id]){
    d.ui.track ? map.addLayer(tracks[id]) : map.removeLayer(tracks[id]);
  }

  render();
}

/* WATCH */
function toggleWatch(id){
  const d = state.devices[id];
  if(!d) return;

  d.ui.watch = !d.ui.watch;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${d.ui.watch?"watch":"unwatch"}`,{
    method:"POST"
  }).catch(console.error);

  render();
}

/* ALARM */
function toggleAlarm(id){
  const d = state.devices[id];
  if(!d) return;

  d.alarmActive = !d.alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${d.alarmActive}`,{
    method:"POST"
  }).catch(console.error);

  render();
}

/* CLEAR */
function clearTrack(id){
  if(tracks[id]) tracks[id].setLatLngs([]);
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* RENDER (vollständig + sicher) */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.entries(state.devices).forEach(([id,d])=>{
    const box = document.createElement("div");
    box.className = "device";

    const title = document.createElement("b");
    title.textContent = d.name;

    const status = document.createElement("span");
    status.className = "chip " + (d.status==="online"?"online":"offline");
    status.textContent = d.status==="online"?"ONLINE":"OFFLINE";

    const pos = document.createElement("div");
    pos.textContent = `📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}`;

    const info = document.createElement("div");
    info.innerHTML = `
      ⚡ Speed: ${d.speed ?? 0} km/h<br>
      🎯 Accuracy: ${d.accuracy ?? "-"} m<br>
      🔋 Battery: ${d.battery ?? "-"}%<br>
      🚶 ${d.isMotion?"MOVING":"STILL"}<br>
      📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
      🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
      👀 WATCHED: ${d.ui.watch ? "YES" : "NO"}
      ${d.alarmActive ? '<span class="chip alarmChip">ALARM</span>' : ""}
    `;

    const btn = document.createElement("div");
    btn.innerHTML = `
      <button class="${d.ui.follow?'active-follow':''}" onclick="follow('${id}')">🎯 FOLLOW</button>
      <button class="${d.ui.track?'active-track':''}" onclick="toggleTrack('${id}')">📍 TRACK</button>
      <button class="${d.ui.watch?'active-watch':''}" onclick="toggleWatch('${id}')">👀 WATCH</button>
      <button class="${d.alarmActive?'active-alarm':''}" onclick="toggleAlarm('${id}')">🚨 ALARM</button>
      <button onclick="clearTrack('${id}')">CLEAR</button>
    `;

    box.appendChild(title);
    box.appendChild(status);
    box.appendChild(document.createElement("br"));
    box.appendChild(document.createElement("br"));
    box.appendChild(pos);
    box.appendChild(info);
    box.appendChild(document.createElement("hr"));
    box.appendChild(btn);

    el.appendChild(box);
  });
}

/* LOAD */
async function load(){
  try{
    const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
    const data = await r.json();
    data.forEach(update);
  }catch(e){
    console.error(e);
  }
}
load();

/* WS */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m)=>{
  try{
    const d = JSON.parse(m.data);
    if(Array.isArray(d)) d.forEach(update);
    else update(d);
  }catch(e){}
};

ws.onerror = console.error;
</script>

</body>
</html>
