<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>CarPlay GPS Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* 🖤 CarPlay Panel */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 280px;
  max-height: 80vh;
  overflow: auto;

  background: rgba(20,20,20,0.75);
  backdrop-filter: blur(12px);
  color: white;

  padding: 14px;
  border-radius: 14px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

.online { color: #2ecc71; }
.idle { color: #f1c40f; }
.offline { color: #e74c3c; }

/* 🚗 Marker */
.car-icon div {
  font-size: 42px;
  text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 CarPlay Tracker</b>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const currentPos = {};
const targetPos = {};
let followedDevice = null;
let navigationMode = false;

/* =========================
   SMOOTH HELPERS
========================= */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

function getBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* =========================
   CAR ICON
========================= */
function createCarIcon(name="") {
  const n = (name || "").toLowerCase();

  let color = "#2ecc71"; // green
  if (n.includes("nicole")) color = "#ff3b30"; // red
  if (n.includes("oliver")) color = "#0a84ff"; // blue

  return L.divIcon({
    className: "",
    html: `<div style="color:${color}; font-size:42px;">🚗</div>`,
    iconSize: [40,40],
    iconAnchor: [20,20]
  });
}

/* =========================
   LIST UI
========================= */
function renderList(devices) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  devices.forEach(d => {
    const div = document.createElement("div");
    div.className = "device";

    div.innerHTML = `
      <b style="font-size:15px;">${d.name || d.deviceId}</b><br>
      <small class="${d.status}">● ${d.status}</small><br>
      🔋 ${d.battery}% | 🚗 ${d.speed} km/h
    `;

    div.onclick = () => {
      followDevice(d.deviceId);
      map.setView([d.lat, d.lon], 17, { animate: true });
    };

    list.appendChild(div);
  });
}

/* =========================
   FOLLOW
========================= */
function followDevice(id) {
  followedDevice = id;
  navigationMode = true;
}

/* =========================
   UPDATE DEVICE
========================= */
function updateDevice(d) {
  const { deviceId, lat, lon, speed, battery, accuracy, name, status } = d;

  targetPos[deviceId] = { lat, lon };

  if (!currentPos[deviceId]) {
    currentPos[deviceId] = { lat, lon };
  }

  if (!markers[deviceId]) {
    const marker = L.marker([lat, lon], {
      icon: createCarIcon(name)
    }).addTo(map);

    marker.bindPopup(`
      <div style="min-width:180px">
        <b style="font-size:16px;">🚗 ${name || deviceId}</b><br><br>
        📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
        🚗 Speed: ${speed} km/h<br>
        🔋 Battery: ${battery}%<br>
        🎯 Accuracy: ${accuracy} m<br>
        📡 Status: ${status}
      </div>
    `);

    markers[deviceId] = marker;
  }
}

/* =========================
   ANIMATION LOOP (SMOOTH)
========================= */
function animate() {
  Object.keys(targetPos).forEach(id => {
    if (!currentPos[id]) return;

    const c = currentPos[id];
    const t = targetPos[id];

    c.lat = lerp(c.lat, t.lat, 0.08);
    c.lon = lerp(c.lon, t.lon, 0.08);

    if (markers[id]) {
      markers[id].setLatLng([c.lat, c.lon]);
    }

    if (followedDevice === id && navigationMode) {
      map.setView([c.lat, c.lon], map.getZoom(), {
        animate: false
      });
    }
  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   LOAD INITIAL DATA
========================= */
async function loadDevices() {
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const devices = await res.json();

  devices.forEach(updateDevice);
  renderList(devices);
}

loadDevices();

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  updateDevice(data);
  loadDevices();
};

</script>

</body>
</html>
