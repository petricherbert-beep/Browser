<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Realtime MASTER</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel{
  position:absolute;
  top:10px; left:10px;
  width:390px;
  max-height:90vh;
  overflow:auto;
  background:rgba(20,20,20,0.92);
  color:white;
  padding:10px;
  border-radius:12px;
  z-index:9999;
}

.device{
  border-bottom:1px solid #333;
  padding:10px 0;
}

button{
  margin:2px;
  padding:5px 7px;
  font-size:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.watch{background:#ffcc00;}
.follow{background:#0a84ff;color:white;}
.alarm{background:#ff3b30;color:white;}

@keyframes blinkAlarm {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

.alarmBlink { animation: blinkAlarm 0.8s infinite; }

@keyframes alarmPulse {
  0% { transform: scale(0.8); opacity: 0.6; }
  70% { transform: scale(2.2); opacity: 0.1; }
  100% { transform: scale(2.6); opacity: 0; }
}

.alarmRadius{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid red;
  background:rgba(255,0,0,0.15);
  animation: alarmPulse 1.2s infinite;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Realtime MASTER</b><br>

  <button onclick="toggleNav()">Nav</button>
  <button onclick="toggleAlarmSystem()">🔊 System</button>

  <hr>

  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */

const devices = {};
const markers = {};
const tracks = {};
const showTracks = {};
const lastPos = {};
const heading = {};

let followId = null;
let navMode = false;

let alarmEnabled = true;
let activeAlarmDevice = null;

const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;

/* ================= HELPERS ================= */

function getLastSeenSeconds(ts){
  if(!ts) return "?";
  return Math.max(0, Math.floor((Date.now() - ts) / 1000));
}

function color(name){
  const n = (name || "").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

function accuracyColor(acc){
  if(acc == null) return "white";
  if(acc <= 5) return "#00ff88";
  if(acc <= 20) return "#ffd60a";
  return "#ff3b30";
}

function bearing(lat1, lon1, lat2, lon2){
  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const φ1 = toRad(lat1);
  const φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);

  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x =
    Math.cos(φ1) * Math.sin(φ2) -
    Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

function distance(a, b){
  const R = 6371e3;
  const toRad = x => x * Math.PI / 180;

  const φ1 = toRad(a.lat);
  const φ2 = toRad(b.lat);
  const Δφ = toRad(b.lat - a.lat);
  const Δλ = toRad(b.lon - a.lon);

  const x =
    Math.sin(Δφ/2)**2 +
    Math.cos(φ1)*Math.cos(φ2)*
    Math.sin(Δλ/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

/* ================= MAP ================= */

const map = L.map("map").setView([47.09,15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= UPDATE ================= */

function update(d){

  const id = d.deviceId;
  const lat = Number(d.lat);
  const lon = Number(d.lon);
  if(!lat || !lon) return;

  const prev = lastPos[id];
  let angle = heading[id] || 0;

  const moving = d.isMotion || (d.speed ?? 0) > 0.5;

  if(prev && moving){
    angle = bearing(prev.lat, prev.lon, lat, lon);
    heading[id] = angle;
  }

  if(prev){
    const dist = distance(prev, {lat, lon});
    if(dist > 500) return; // spike protection
  }

  lastPos[id] = {lat, lon};
  devices[id] = d;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angle, d.isWatched, d.alarmActive)
    }).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 4,
      opacity: 0.8
    });

    if(showTracks[id] !== false){
      tracks[id].addTo(map);
    }
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name, angle, d.isWatched, d.alarmActive));

  if(tracks[id]){
    const prev2 = tracks[id].getLatLngs().slice(-1)[0];
    if(!prev2 || distance(prev2, {lat,lon}) > 2){
      tracks[id].addLatLng([lat,lon]);
    }
  }

  if(followId === id){
    if(navMode){
      const zoom = 17;
      const point = map.project([lat, lon], zoom);
      point.y -= 150;
      map.setView(map.unproject(point, zoom), zoom);
    } else {
      map.panTo([lat,lon]);
    }
  }

  render();
}

/* ================= ICON ================= */

function icon(name, angle, isWatched, alarmActive){

  const col = color(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[60,60],
    iconAnchor:[30,30],

    html:`
      <div class="${alarmActive ? 'alarmBlink' : ''}"
        style="position:relative;width:60px;height:60px;
        display:flex;align-items:center;justify-content:center;">

        ${alarmActive ? `<div class="alarmRadius"></div>` : ""}

        ${isWatched ? `
          <div style="
            position:absolute;
            width:70px;height:70px;
            border:2px solid gold;
            border-radius:50%;
          "></div>
        ` : ""}

        <div style="
          position:absolute;
          font-size:30px;
          color:black;
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:28px;
          color:${col};
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:11px;
          font-weight:800;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* ================= UI ================= */

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d => {

    const speed = (d.speed ?? 0) * 3.6;
    const id = d.deviceId;

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b>
        <span style="color:#888">(${d.status ?? "unknown"})</span><br>

        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>

        🔋 ${d.battery ?? "-"}%<br>

        🔒 ${d.isLocked ? "LOCKED" : "UNLOCKED"}<br>
        🚶 ${d.isMotion ? "MOVING" : "STILL"}<br>
        📶 ${d.isWifi ? "WIFI" : "MOBILE"}<br>

        🎯 <span style="color:${accuracyColor(d.accuracy)}">
          ${d.accuracy ?? "-"} m
        </span><br>

        ⏱ ${getLastSeenSeconds(d.timestamp)}s ago<br>
        🚨 ${d.alarmActive ? "ALARM" : "OK"}<br>

        <hr>

        <button class="follow" onclick="follow('${id}')">Follow</button>

        <button onclick="watch('${id}')">👀 Watch</button>
        <button onclick="unwatch('${id}')">🚫 Unwatch</button>

        <button class="alarm" onclick="toggleAlarm('${id}')">
          Alarm
        </button>

        <button onclick="toggleTrack('${id}')">
          ${showTracks[id] === false ? "Track ON" : "Track OFF"}
        </button>

        <button onclick="clearTrack('${id}')">
          🧹 Clear
        </button>
      </div>
    `;
  });
}

/* ================= ACTIONS ================= */

function follow(id){
  followId = (followId === id ? null : id);
}

function toggleNav(){
  navMode = !navMode;
}

function toggleAlarmSystem(){
  alarmEnabled = !alarmEnabled;
}

/* ================= SERVER ACTIONS ================= */

function watch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch`,{method:"POST"});
}

function unwatch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
}

function toggleAlarm(id){
  const d = devices[id];
  if(!d) return;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${!d.alarmActive}`,{
    method:"POST"
  });
}

/* ================= TRACK ================= */

function toggleTrack(id){
  showTracks[id] = !showTracks[id];

  if(tracks[id]){
    if(showTracks[id] === false){
      map.removeLayer(tracks[id]);
    } else {
      tracks[id].addTo(map);
    }
  }

  render();
}

function clearTrack(id){
  if(tracks[id]){
    tracks[id].setLatLngs([]);
  }
}

/* ================= LOAD + WS ================= */

async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await r.json();
  data.forEach(update);
}
load();

function connectWS(){
  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if(Array.isArray(data)) data.forEach(update);
    else update(data);
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
}

connectWS();

</script>

</body>
</html>
