<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Neon Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<meta name="theme-color" content="#05070b">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;

  display:flex;
  overflow:hidden;
}

/* FRAME */
.app-frame{
  position:fixed;
  inset:0;
  background:#070a0f;
  z-index:0;
}

/* LEFT PANEL */
#panel{
  width:390px;

  margin-top:1.5cm;
  margin-left:1.5cm;
  margin-bottom:1.5cm;

  overflow:auto;

  background:rgba(10,15,25,0.55);
  backdrop-filter:blur(16px);

  border:1px solid rgba(0,255,200,0.1);
  border-radius:16px;

  padding:14px;

  z-index:9999;
}

/* MAP RIGHT SIDE */
#map{
  flex:1;

  margin-top:1.5cm;
  margin-right:1.5cm;
  margin-bottom:1.5cm;

  margin-left:1cm; /* Abstand zum Infofeld */

  border-radius:16px;
  overflow:hidden;

  z-index:1;
}

/* DEVICE CARD */
.device{
  margin-top:10px;
  padding:12px;

  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,200,0.08);
  border-radius:14px;
}

.device b{
  color:#e6edf3;
}

/* BUTTONS */
button{
  margin:3px 2px;
  padding:6px 10px;
  font-size:12px;

  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);

  background:rgba(10,20,30,0.6);
  color:#c9d1d9;

  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
  border-color:rgba(0,255,200,0.6);
  box-shadow:0 0 12px rgba(0,255,200,0.25);
}

/* FOLLOW */
.follow.active{
  box-shadow:0 0 14px rgba(0,140,255,0.4);
}

/* ALARM */
.alarm.active{
  box-shadow:0 0 14px rgba(255,60,60,0.4);
}

/* CHIPS */
.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
  border:1px solid rgba(255,255,255,0.1);
}

.online{color:#00ff7b;border-color:#00ff7b55;}
.offline{color:#ff3b3b;border-color:#ff3b3b55;}
.alarmChip{color:#ff3b3b;border-color:#ff3b3b55;}

</style>
</head>

<body>

<div class="app-frame"></div>

<div id="panel">
  <b>🚗 GPS Control Center</b><br>
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <button onclick="toggleNav()">Nav</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices={};
const markers={};
const tracks={};
let followId=null;

/* MAP */
const map=L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* UPDATE */
function update(d){

  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(!lat||!lon) return;

  devices[id]=d;

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name)}).addTo(map);
    tracks[id]=L.polyline([],{
      color:"#00ffb3",
      weight:3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  tracks[id].addLatLng([lat,lon]);

  if(followId===id){
    map.panTo([lat,lon]);
  }

  render();
}

/* ICON */
function icon(name){
  const col="#00ffb3";
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="display:flex;justify-content:center;align-items:center;">
        <div style="font-size:24px;color:${col};text-shadow:0 0 10px ${col}">▲</div>
        <div style="position:absolute;font-size:10px;color:white">${letter}</div>
      </div>
    `
  });
}

/* RENDER */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(devices).forEach(d=>{
    const id=d.deviceId;

    el.innerHTML+=`
      <div class="device">

        <b>${d.name}</b>

        <span class="chip ${d.status==='online'?'online':'offline'}">
          ${d.status==='online'?'ONLINE':'OFFLINE'}
        </span>

        ${d.alarmActive?`<span class="chip alarmChip">ALARM</span>`:""}

        <br><br>

        📍 ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}<br>
        🚶 ${d.isMotion?"MOVING":"STILL"}<br>
        🔋 ${d.battery??"-"}%<br>
        🎯 ${d.accuracy??"-"} m<br>
        📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
        🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
        👀 ${d.isWatched?"WATCHED":"NOT WATCHED"}<br>
        ⏱ ${Math.max(0,Math.floor((Date.now()-d.timestamp)/1000))}s ago<br>

        <hr>

        <button class="${followId===id?'active':''}"
          onclick="follow('${id}')">
          ${followId===id?"Unfollow":"Follow"}
        </button>

        <button onclick="watch('${id}')">Watch</button>
        <button onclick="unwatch('${id}')">Unwatch</button>

        <button onclick="clearTrack('${id}')">Clear</button>

      </div>
    `;
  });
}

/* ACTIONS */
function follow(id){
  followId=followId===id?null:id;
}

function watch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch`,{method:"POST"});
}

function unwatch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
}

function clearTrack(id){
  if(tracks[id]) tracks[id].setLatLngs([]);
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* LOAD */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await r.json();
  data.forEach(update);
}
load();

/* WS */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=(m)=>{
  const d=JSON.parse(m.data);
  if(Array.isArray(d)) d.forEach(update);
  else update(d);
};

</script>

</body>
</html>
