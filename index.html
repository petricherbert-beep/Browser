<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.15),
    0 0 60px rgba(0,255,200,0.08);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  filter: contrast(1) brightness(0.75) saturate(0.95);
  box-shadow:
    0 0 15px rgba(0,255,200,0.25),
    0 0 50px rgba(0,255,200,0.35),
    0 0 100px rgba(0,255,200,0.25),
    0 0 150px rgba(0,255,200,0.15),
    inset 0 0 90px rgba(0,0,0,0.35);
}

.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

.info{
  font-size:12px;
  line-height:1.4;
}

button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
}

button:hover{
  transform:translateY(-1px);
  border-color:rgba(0,255,200,0.5);
}

.active-follow{ color:#3aa0ff; border-color:#3aa0ff; }
.active-track{ color:#00ffb3; border-color:#00ffb3; }
.active-watch{ color:#ffd84d; border-color:#ffd84d; }
.active-alarm{ color:#ff4d4d; border-color:#ff4d4d; }

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.2;}
  100%{opacity:1;}
}
</style>

</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>

<button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>

  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const anim = {};
const accidentWatch = {};

let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* COLOR */
function color(n){
  n=(n||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON */
function icon(name){
  const c=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;position:relative;">
        
        <div style="
          font-size:26px;
          color:${c};
          text-shadow:
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
        ">▲</div>

        <div style="
          position:absolute;
          font-size:11px;
          font-weight:700;
          color:#fff;
          text-shadow:0 0 6px rgba(0,0,0,0.9);
          transform:translateY(6px);
        ">${letter}</div>

      </div>
    `
  });
}

/* SMOOTH MOVE */
function smoothMove(id, lat, lon){
  const m=markers[id];
  if(!m) return;

  if(anim[id]) cancelAnimationFrame(anim[id]);

  const start=m.getLatLng();
  const t0=performance.now();

  function step(t){
    const p=Math.min((t-t0)/250,1);
    m.setLatLng([
      start.lat+(lat-start.lat)*p,
      start.lng+(lon-start.lng)*p
    ]);
    if(p<1) anim[id]=requestAnimationFrame(step);
  }

  anim[id]=requestAnimationFrame(step);
}

/* TRACK */
function addTrack(id, lat, lon){
  if(!tracks[id]){
    tracks[id] = { segments: [], points: [], crashBuffer: [], replayMarker:null };
  }

  const t = tracks[id];
  const last = t.points[t.points.length - 1];

  t.points.push({lat,lon,time:Date.now()});

  const point = L.circleMarker([lat, lon], {
    radius: 3,
    color: color(devices[id].name),
    fillOpacity: 1
  }).addTo(map);

  t.segments.push(point);

  if(last){
    const line = L.polyline([
      [last.lat,last.lon],
      [lat,lon]
    ],{
      color: color(devices[id].name),
      weight: 3,
      dashArray: "6,10",
      opacity: 1
    }).addTo(map);

    t.segments.push(line);
  }

  t.crashBuffer = t.points.filter(p => Date.now() - p.time < 30000);

  while(t.points.length > 30){
    t.points.shift();
    const a = t.segments.shift();
    const b = t.segments.shift();
    if(a) map.removeLayer(a);
    if(b) map.removeLayer(b);
  }

  updateTrackOpacity(id);
}

function updateTrackOpacity(id){
  const t = tracks[id];
  if(!t) return;

  const total = t.segments.length;

  t.segments.forEach((seg,i)=>{
    const op = 0.1 + (i/total)*0.9;
    if(seg.setStyle) seg.setStyle({opacity:op,fillOpacity:op});
  });
}

/* CRASH TRAIL */
function freezeCrashTrail(id){
  const t = tracks[id];
  if(!t || !t.crashBuffer) return;

  const pts = t.crashBuffer;

  for(let i=1;i<pts.length;i++){
    const line = L.polyline([
      [pts[i-1].lat,pts[i-1].lon],
      [pts[i].lat,pts[i].lon]
    ],{
      color:"#ff0000",
      weight:5,
      opacity:0.85
    }).addTo(map);
  }

  const last = pts[pts.length - 1];

  L.circleMarker([last.lat,last.lon],{
    radius:7,
    color:"#ff0000",
    fillColor:"#ff0000",
    fillOpacity:1
  }).addTo(map);
}

/* REPLAY (time-based) */
function startReplay(id){
  const t = tracks[id];
  if(!t || !t.crashBuffer.length) return;

  let i=0;

  if(t.replayMarker){
    map.removeLayer(t.replayMarker);
  }

  t.replayMarker = L.circleMarker([0,0],{
    radius:6,
    color:"#fff",
    fillColor:"#ff0000",
    fillOpacity:1
  }).addTo(map);

  function step(){
    if(i >= t.crashBuffer.length) return;

    const p = t.crashBuffer[i];

    t.replayMarker.setLatLng([p.lat,p.lon]);
    map.panTo([p.lat,p.lon],{animate:false});

    const next = t.crashBuffer[i+1];
    i++;

    if(next){
      const delay = next.time - p.time;
      setTimeout(step, Math.max(delay,80));
    }
  }

  step();
}

/* ACCIDENT LOGIC */
function handleAccidentLogic(id,d){
  const now=Date.now();

  if(!accidentWatch[id]){
    accidentWatch[id]={time:null,alert:false};
  }

  const a=accidentWatch[id];

  if(d.lastEvent==="Accident"){
    if(!a.time){
      a.time=now;
      a.alert=false;

      freezeCrashTrail(id);
    }
  } else {
    a.time=null;
    a.alert=false;

    if(markers[id]){
      markers[id].setIcon(icon(d.name));
    }

    return;
  }

  const noMove=!d.isMotion && (d.speed??0)<1;

  if(a.time && noMove && !a.alert){
    if(now-a.time>15000){
      map.flyTo([d.lat,d.lon],18);

      markers[id].setIcon(L.divIcon({
        html:`<div style="font-size:30px;color:red;animation:blink 1s infinite;">🚨</div>`
      }));

      markers[id].bindPopup("🚨 NO MOVEMENT AFTER ACCIDENT").openPopup();

      a.alert=true;
    }
  }
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(isNaN(lat)||isNaN(lon)) return;

  devices[id]={...devices[id],...d};

  if(!ui[id]){
    ui[id]={follow:false,track:false,watch:d.isWatched||false};
  }

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name)}).addTo(map);
  }

  smoothMove(id,lat,lon);

  if(ui[id].track){
    addTrack(id,lat,lon);
  }

  if(followId===id){
    map.panTo([lat,lon],{animate:false});
  }

  handleAccidentLogic(id,d);

  render();
}

/* CONTROLS */
function follow(id){
  if(followId===id){
    ui[id].follow=false;
    followId=null;
    render();
    return;
  }

  Object.keys(ui).forEach(k=>ui[k].follow=false);

  ui[id].follow=true;
  followId=id;

  map.flyTo([devices[id].lat,devices[id].lon],16);

  render();
}

function toggleTrack(id){
  ui[id].track=!ui[id].track;
  render();
}

function watch(id){
  const newState=!ui[id].watch;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${newState?"watch":"unwatch"}`,{
    method:"POST"
  }).then(()=>{
    ui[id].watch=newState;
    render();
  });
}

function alarm(id){
  devices[id].alarmActive=!devices[id].alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${devices[id].alarmActive}`,{
    method:"POST"
  });

  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && document.fullscreenElement){
    document.exitFullscreen();
  }
});

/* RENDER */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b><br><br>

        📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>

        <div class="info">
          ⚡ ${d.speed??0} km/h<br>
          🎯 ${d.accuracy??"-"} m<br>
          🔋 ${d.battery??"-"}%<br>
          🚶 ${d.isMotion?"MOVING":"STILL"}<br>
          📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
          🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
          👀 ${u.watch?"YES":"NO"}<br>
          ${d.alarmActive?'<span style="color:red">ALARM</span>':""}
          ${d.lastEvent==="Accident"?"<br>🚨 ACCIDENT":""}
        </div>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="follow('${id}')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="toggleTrack('${id}')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
        <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
        <button onclick="startReplay('${id}')">REPLAY</button>
      </div>
    `;
  });
}

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(a=>a.forEach(update));

/* WS */
let ws;
function connect(){
  ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage=(m)=>{
    const d=JSON.parse(m.data);
    Array.isArray(d)?d.forEach(update):update(d);
  };

  ws.onclose=()=>setTimeout(connect,2000);
}
connect();

</script>

</body>
</html>
