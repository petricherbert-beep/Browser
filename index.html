<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO FIXED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* PANEL */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 330px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS ULTRA PRO FIX</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE (IMPORTANT FIX)
========================= */
const markers = {};
const lastRaw = {};
const deviceList = [];

/* =========================
   SAFE NUMBER
========================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

/* =========================
   VECTOR BEARING
========================= */
function bearing(lat1, lon1, lat2, lon2){

  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);

  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* =========================
   ICON
========================= */
function icon(name, angle){

  const color =
    name?.toLowerCase().includes("nicole") ? "#ff3b30" :
    name?.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const letter = name?.[0]?.toUpperCase() || "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        transform:rotate(${angle}deg);
        font-size:42px;
        color:${color};
        text-shadow:0 0 4px black;
        position:relative;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:13px;
          font-weight:bold;
        ">
          ${letter}
        </div>
      </div>
    `,
    iconSize:[42,42],
    iconAnchor:[21,21]
  });
}

/* =========================
   UPDATE DEVICE (WS + LOAD)
========================= */
function update(d){

  const id = d.deviceId;

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null) return;

  const prev = lastRaw[id];

  let angle = 0;

  // 🔥 VECTOR: ONLY RAW → RAW
  if(prev){
    angle = bearing(prev.lat, prev.lon, lat, lon);
  }

  lastRaw[id] = {lat, lon};

  // marker create
  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(d.name, angle)
    }).addTo(map);
  } else {
    markers[id].setLatLng([lat, lon]);
    markers[id].setIcon(icon(d.name, angle));
  }

  // store list (NO DUPLICATES)
  if(!deviceList.find(x => x.deviceId === id)){
    deviceList.push(d);
    render();
  }
}

/* =========================
   RENDER LIST (CLEAN)
========================= */
function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  deviceList.forEach(d => {

    const div = document.createElement("div");
    div.className = "device";

    div.innerHTML = `
      <b>${d.name}</b><br>
      🚗 ${d.speed} km/h<br>
      🔋 ${d.battery}%
    `;

    div.onclick = () => {
      map.setView([d.lat, d.lon], 17);
    };

    el.appendChild(div);
  });
}

/* =========================
   LOAD INITIAL DATA
========================= */
async function load(){

  try {
    const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
    const data = await res.json();

    data.forEach(update);

  } catch(e){
    console.error("LOAD ERROR:", e);
  }
}

load();

/* =========================
   WEBSOCKET LIVE UPDATES
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onopen = () => console.log("🟢 WS connected");

ws.onerror = (e) => console.error("❌ WS error", e);

ws.onmessage = (m) => {
  try {
    update(JSON.parse(m.data));
  } catch(e){}
};

</script>

</body>
</html>
