<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.15),
    0 0 60px rgba(0,255,200,0.08);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  filter:contrast(1) brightness(0.75) saturate(0.95);
  box-shadow:
    0 0 15px rgba(0,255,200,0.25),
    0 0 50px rgba(0,255,200,0.35),
    0 0 100px rgba(0,255,200,0.25);
}

/* ALARM */
#map.alarm{
  animation: alarmFlash 0.5s infinite;
  box-shadow:
    0 0 10px rgba(255,0,0,0.5),
    0 0 60px rgba(255,0,0,0.4);
}

@keyframes alarmFlash{
  0%,100%{filter:brightness(0.8) saturate(1.2);}
  50%{filter:brightness(1.5) saturate(2);}
}

/* DEVICE */
.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

.info{font-size:12px; line-height:1.4;}

button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
}

.active-follow{color:#3aa0ff;box-shadow:0 0 10px #3aa0ff;}
.active-track{color:#00ffb3;box-shadow:0 0 10px #00ffb3;}
.active-watch{color:#ffd84d;box-shadow:0 0 10px #ffd84d;}
.active-alarm{color:#ff4d4d;box-shadow:0 0 10px #ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const anim = {};
const replayState = {};

let followId = null;

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* ================= COLOR ================= */
function color(n){
  n=(n||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ================= BEARING ================= */
function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180;
  const toDeg=x=>x*180/Math.PI;

  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
          Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));

  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ================= ICON ================= */
function icon(name,rot=0){
  const c=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  ">

    <div style="
      font-size:26px;
      color:${c};
      -webkit-text-stroke:1px #000;
      transform:rotate(${rot}deg);
      line-height:40px;
    ">▲</div>

    <div style="
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      font-size:11px;
      font-weight:700;
      color:#fff;
      text-shadow:0 0 6px #000;
    ">${letter}</div>

  </div>
    `
  });
}

/* ================= TRACK ================= */
function addTrack(id,lat,lon){
  const t = tracks[id] || (tracks[id]={pts:[], dots:[]});

  const last = t.pts[t.pts.length-1];

  if(last){
    const dx = last[0]-lat;
    const dy = last[1]-lon;

    if(Math.sqrt(dx*dx+dy*dy) < 0.00003){
      return; // ignorieren (~3m)
    }
  }

  t.pts.push([lat,lon]);

  if(t.pts.length>30) t.pts.shift();

  if(!t.poly){
    const c=color(devices[id].name);

    t.poly = L.polyline([],{
      color:c,
      weight:3,
      opacity:0.25,
      dashArray:"6,10"
    }).addTo(map);
  }

  t.poly.setLatLngs(t.pts);

  const dot = L.circleMarker([lat,lon],{
    radius:3,
    color:color(devices[id].name),
    fillOpacity:0.4
  }).addTo(map);

  t.dots.push(dot);

  if(t.dots.length > 30){
    const old = t.dots.shift();
    map.removeLayer(old);
  }
}


  function updateAlarmUI(){
  const any = Object.values(devices).some(d => d.alarmActive);
  document.getElementById("map").classList.toggle("alarm", any);
}
  
function clearTrack(id){
  const t = tracks[id];
  if(!t) return;

  t.pts = [];

  if(t.poly){
    map.removeLayer(t.poly);
    delete t.poly;
  }

  if(t.dots){
    t.dots.forEach(dot => map.removeLayer(dot));
    t.dots = [];
  }
}
  
/* ================= REPLAY ================= */
function startReplay(id,speed=700){
  const t = tracks[id];
  if(!t || !t.pts.length) return;
  if(replayState[id]) return;

  let i=0;

  const m=L.circleMarker(t.pts[0],{
    radius:6,
    color:"#fff",
    fillColor:"#fff",
    fillOpacity:1
  }).addTo(map);

  replayState[id]=m;

  function step(){
    if(i>=t.pts.length){
      map.removeLayer(m);
      delete replayState[id];
      return;
    }
    m.setLatLng(t.pts[i++]);
    setTimeout(step,speed);
  }

  step();
}

function stopReplay(id){
  if(replayState[id]){
    map.removeLayer(replayState[id]);
    delete replayState[id];
  }
}

/* ================= UPDATE ================= */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(!lat||!lon) return;

  const prev=devices[id];

  devices[id] = {
  ...(devices[id] || {}),
  ...d
};

  ui[id]=ui[id]||{follow:false,track:false,watch:false};

  const c=color(d.name);

  let rot=0;
  updateAlarmUI();
  if(prev && prev.lat === lat && prev.lon === lon){
  return;
}
  
  if(prev) rot=bearing(prev.lat,prev.lon,lat,lon);

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name,rot)}).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,rot));

  if(d.lastEvent==="Accident"){
    map.flyTo([lat,lon],17);

    L.circleMarker([lat,lon],{
      radius:8,
      color:"#ff0000",
      fillColor:"#ff0000",
      fillOpacity:1
    }).addTo(map);

    document.getElementById("map").classList.add("alarm");
  }

  if(ui[id].track) addTrack(id,lat,lon);

  if(followId===id) map.panTo([lat,lon]);

  render();
}

/* ================= UI ================= */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b><br><br>

        📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>

        <div class="info">
          ⚡ Speed: ${d.speed ?? 0} km/h<br>
          🎯 Accuracy: ±${d.accuracy ?? "-"} m<br>
          🔋 ${d.battery??"-"}%<br>
          🚶 ${d.isMotion?"MOVING":"STILL"}<br>
          📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
          🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
          👀 ${d.isWatched?"WATCHED":"NO"}<br>
          📡 ${d.status??""}<br>
          🚨 ${d.lastEvent??""}
        </div>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="toggle('${id}','follow')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="toggle('${id}','track')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
        <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
        <button onclick="startReplay('${id}',700)">REPLAY</button>
        <button onclick="stopReplay('${id}')">STOP</button>
        <button onclick="clearTrack('${id}')">CLEAR TRACK</button>
        <button onclick="clearAlarm('${id}')">CLEAR ALARM</button>
      </div>
    `;
  });
}

/* ================= TOGGLE ================= */
function toggle(id,k){
  ui[id][k]=!ui[id][k];
  if(k==="follow") followId=ui[id].follow?id:null;
  render();

}

  function clearAlarm(id){
  devices[id].alarmActive = false;
  updateAlarmUI();
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=false`,{
    method:"POST"
  });

  document.getElementById("map").classList.remove("alarm");

  render();
}

function watch(id){
  ui[id].watch=!ui[id].watch;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${ui[id].watch?"watch":"unwatch"}`,{method:"POST"});
  render();
}

function alarm(id){
  devices[id].alarmActive=!devices[id].alarmActive;
  updateAlarmUI();
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${devices[id].alarmActive}`,{method:"POST"});
  render();
}

/* ================= FULLSCREEN ================= */
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

/* ================= LOAD + WS ================= */
function connectWS(){
  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = e=>{
    const d = JSON.parse(e.data);
    Array.isArray(d)?d.forEach(update):update(d);
  };

  ws.onclose = ()=>{
    console.log("reconnect...");
    setTimeout(connectWS,2000);
  };

  ws.onerror = ()=> ws.close();
}

connectWS();

</script>

</body>
</html>
