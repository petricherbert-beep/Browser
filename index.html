<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS NAVIGATION STABLE</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel {
  position:absolute;
  top:12px; left:12px;
  width:380px;
  max-height:85vh;
  overflow:auto;
  background:rgba(20,20,20,0.85);
  backdrop-filter:blur(14px);
  color:white;
  padding:12px;
  border-radius:14px;
  z-index:9999;
}

button {
  margin:3px;
  padding:6px 8px;
  border:none;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.follow { background:#0a84ff; color:white; }
.watch { background:#ffcc00; color:black; }

@keyframes pulse {
  0% { transform:scale(1); opacity:0.8; }
  100% { transform:scale(2.2); opacity:0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🧭 GPS NAV STABLE</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* STATE */
const markers = {};
const tracks = {};
const list = [];
const last = {};
const angles = {};

let followId = null;

/* HELPERS */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

/* COLOR */
function getColor(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

/* BEARING */
function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ICON */
function icon(name, isWatched, accuracy){

  const color = getColor(name);
  const letter = (name?.[0] || "?").toUpperCase();

  const acc = accuracy ? Math.min(Math.max(accuracy*2,25),140) : 60;

  return L.divIcon({
    className:"",
    html:`
      <div style="width:70px;height:70px;position:relative;">

        <!-- ACCURACY -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          width:${acc}px;
          height:${acc}px;
          transform:translate(-50%,-50%);
          border-radius:50%;
          background:rgba(100,150,255,0.12);
          border:1px solid rgba(100,150,255,0.25);
        "></div>

        ${isWatched ? `
          <div style="
            position:absolute;
            width:86px;height:86px;
            border:2px solid gold;
            border-radius:50%;
            animation:pulse 1.5s infinite;
          "></div>
        ` : ''}

        <div style="
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
        ">
          <div style="position:relative;font-size:38px;color:${color};">
            ➤
            <span style="
              position:absolute;
              font-size:12px;
              font-weight:700;
              color:white;
              top:50%;
              left:50%;
              transform:translate(-50%,-50%);
            ">
              ${letter}
            </span>
          </div>
        </div>

      </div>
    `,
    iconSize:[70,70],
    iconAnchor:[35,35]
  });
}

/* CAMERA */
function updateCamera(){
  if(!followId) return;

  const pos = markers[followId]?.getLatLng();
  if(!pos) return;

  map.panTo(pos,{animate:true,duration:0.25});
}

/* UPDATE */
function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);
  if(lat===null||lon===null) return;

  const prev = last[id];

  let angle = angles[id];

  /* 🧠 FIX: Heading nur bei echter Bewegung */
  if(prev){

    const moved =
      Math.abs(lat - prev.lat) > 0.00001 ||
      Math.abs(lon - prev.lon) > 0.00001;

    const speedOk = (d.speed ?? 0) > 1;

    if(moved && speedOk){
      angle = bearing(prev.lat,prev.lon,lat,lon);
      angles[id] = angle;
    }
  }

  last[id] = {lat,lon};

  /* MARKER */
  if(!markers[id]){

    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, d.isWatched, d.accuracy),
      rotationAngle: angle || 0,
      rotationOrigin: "center"
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setRotationAngle(angle || 0);
  markers[id].setIcon(icon(d.name, d.isWatched, d.accuracy));

  /* TRACK */
  if(d.isWatched){
    if(!tracks[id]){
      tracks[id]=L.polyline([],{
        color:getColor(d.name),
        weight:4,
        opacity:0.85
      }).addTo(map);
    }
    tracks[id].addLatLng([lat,lon]);
  }

  /* ALARM */
  if(d.alarmActive && d.isWatched){
    const audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();

    fetch("https://gps-server-f9b6.onrender.com/notify",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        token:d.fcmToken,
        title:"🚨 Alarm",
        body:`${d.name} hat Alarm ausgelöst`
      })
    }).catch(()=>{});
  }

  const ex=list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  updateCamera();
  render();
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{

    const speed=(d.speed??0)*3.6;

    el.innerHTML+=`
      <div style="padding:10px;border-bottom:1px solid #333;">
        <b>${d.name}</b><br>
        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🎯 Accuracy: ${d.accuracy??"-"} m<br>
        🔋 Akku: ${d.battery??"-"}%<br>
        📡 Status: ${d.status??"unknown"}<br><br>

        <button class="follow" onclick="followId='${d.deviceId}'">Follow</button>
        <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
      </div>
    `;
  });
}

/* ACTIONS */
function watch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/watch",{method:"POST"});
}

/* LOAD */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d=await r.json();
  d.forEach(update);
}
load();

/* WS */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=(m)=>{try{update(JSON.parse(m.data));}catch(e){}};

</script>

</body>
</html>
