<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* Panel */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 280px;
  max-height: 80vh;
  overflow: auto;

  background: rgba(20,20,20,0.75);
  backdrop-filter: blur(12px);
  color: white;

  padding: 14px;
  border-radius: 14px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

.online { color: #2ecc71; }
.idle { color: #f1c40f; }
.offline { color: #e74c3c; }
</style>
</head>

<body>

<div id="panel">
  <b>📡 Tracker</b>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const currentPos = {};
const targetPos = {};
const lastPos = {};
const idToName = {};
let followId = null;

/* =========================
   HELPERS
========================= */
function lerp(a,b,t){ return a + (b-a)*t; }

function bearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;

  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* =========================
   ICON (FIXED)
========================= */
function createArrowIcon(angle, name="") {

  const n = (name || "").toLowerCase();

  let color = "#2ecc71";
  if (n.includes("nicole")) color = "#ff3b30"; // rot
  if (n.includes("oliver")) color = "#0a84ff"; // blau

  const initial = name ? name.charAt(0).toUpperCase() : "?";

  return L.divIcon({
    className: "",
    html: `
      <div style="
        transform: rotate(${angle}deg);
        font-size: 40px;
        color:${color};
        position: relative;
        text-shadow: 0 0 6px rgba(0,0,0,0.6);
      ">
        ➤

        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform: translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:14px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize: [44,44],
    iconAnchor: [22,22]
  });
}

/* =========================
   LIST
========================= */
function renderList(devs){
  const list=document.getElementById("list");
  list.innerHTML="";

  devs.forEach(d=>{
    idToName[d.deviceId]=d.name;

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      <small class="${d.status}">● ${d.status}</small><br>
      🔋 ${d.battery}% | 🚗 ${d.speed} km/h
    `;

    div.onclick=()=>{
      followId=d.deviceId;
      map.setView([d.lat,d.lon],17);
      markers[d.deviceId]?.openPopup();
    };

    list.appendChild(div);
  });
}

/* =========================
   UPDATE DEVICE
========================= */
function update(d){

  const {deviceId,lat,lon,speed,battery,accuracy,name,status}=d;

  idToName[deviceId]=name;

  targetPos[deviceId]={lat,lon};

  if(!currentPos[deviceId]){
    currentPos[deviceId]={lat,lon};
  }

  if(!markers[deviceId]){
    markers[deviceId]=L.marker([lat,lon],{
      icon:createArrowIcon(0,name)
    }).addTo(map);

    markers[deviceId].bindPopup(`
      <div style="min-width:200px">
        <b style="font-size:16px;">📍 ${name}</b><br><br>
        🚗 Speed: ${speed} km/h<br>
        🔋 Battery: ${battery}%<br>
        🎯 Accuracy: ${accuracy} m<br>
        📡 Status: ${status}
      </div>
    `);
  }
}

/* =========================
   ANIMATION LOOP
========================= */
function animate(){

  Object.keys(targetPos).forEach(id=>{

    const c=currentPos[id];
    const t=targetPos[id];

    if(!c||!t) return;

    const nl=lerp(c.lat,t.lat,0.08);
    const no=lerp(c.lon,t.lon,0.08);

    let ang=0;

    if(lastPos[id]){
      ang=bearing(lastPos[id].lat,lastPos[id].lon,nl,no);
    }

    lastPos[id]=t;

    c.lat=nl;
    c.lon=no;

    if(markers[id]){
      markers[id].setLatLng([nl,no]);
      markers[id].setIcon(createArrowIcon(ang,idToName[id]||""));
    }

    if(followId===id){
      map.setView([nl,no],map.getZoom(),{animate:false});
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   LOAD
========================= */
async function load(){
  const res=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await res.json();

  data.forEach(update);
  renderList(data);
}

load();

/* =========================
   WS
========================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  const d=JSON.parse(m.data);
  update(d);
  load();
};

</script>

</body>
</html>
