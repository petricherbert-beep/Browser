<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Realtime Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel{
  position:absolute;
  top:10px; left:10px;
  width:360px;
  max-height:90vh;
  overflow:auto;
  background:rgba(20,20,20,0.9);
  color:white;
  padding:10px;
  border-radius:12px;
  z-index:9999;
}

.device{
  border-bottom:1px solid #333;
  padding:10px 0;
}

button{
  margin:2px;
  padding:5px 7px;
  font-size:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.watch{background:#ffcc00;}
.follow{background:#0a84ff;color:white;}
.alarm{background:#ff3b30;color:white;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Realtime Pro</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   STATE
========================= */

const devices = {};
const markers = {};
const tracks = {};
const lastPos = {};
const heading = {};

let followId = null;
let lastPan = 0;

/* =========================
   MAP
========================= */

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* =========================
   HELPERS
========================= */

const n = v => Number(v);

function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

/* FIXED HEADING (NO EAST BUG) */
function bearing(a,b,c,d){

  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const y = Math.sin(toRad(d - b)) * Math.cos(toRad(c));
  const x = Math.cos(toRad(c)) * Math.sin(toRad(c)) -
            Math.sin(toRad(a)) * Math.cos(toRad(c)) *
            Math.cos(toRad(d - b));

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* =========================
   MARKER ICON (NO CIRCLE)
========================= */

function icon(name, angle){

  const col = color(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[50,50],
    iconAnchor:[25,25],

    html:`
      <div style="position:relative;width:50px;height:50px;
        display:flex;align-items:center;justify-content:center;">

        <div style="
          font-size:28px;
          color:${col};
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:12px;
          font-weight:700;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* =========================
   REALTIME UPDATE
========================= */

function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);

  if(!lat || !lon) return;

  const prev = lastPos[id];

  let angle = heading[id] || 0;

  if(prev && (d.speed ?? 0) > 0.5){
    angle = bearing(prev.lat,prev.lon,lat,lon);
    heading[id] = angle;
  }

  lastPos[id] = {lat,lon};

  devices[id] = d;

  /* marker */
  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angle)
    }).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 4,
      opacity: 0.8
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name, angle));

  tracks[id].addLatLng([lat,lon]);

  /* FOLLOW */
  if(followId === id){
    const now = Date.now();
    if(now - lastPan > 300){
      lastPan = now;
      map.panTo([lat,lon], {animate:true,duration:0.25});
    }
  }

  render();
}

/* =========================
   UI
========================= */

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d => {

    const speed = (d.speed ?? 0) * 3.6;

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b><br>

        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🔋 ${d.battery ?? "-"}%<br>
        📡 ${d.status ?? "unknown"}<br>
        🎯 accuracy: ${d.accuracy ?? "-"}m<br>
        ⏱ ${new Date(d.timestamp || Date.now()).toLocaleTimeString()}<br>
        🚨 ${d.alarmActive ? "ALARM ON" : "OK"}<br>

        <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
        <button onclick="unwatch('${d.deviceId}')">Unwatch</button>
        <button class="follow" onclick="follow('${d.deviceId}')">Follow</button>
        <button class="alarm" onclick="alarm('${d.deviceId}')">Alarm</button>
      </div>
    `;
  });
}

/* =========================
   ACTIONS
========================= */

function watch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch`,{method:"POST"});
}

function unwatch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
}

function follow(id){
  followId = id;
}

function alarm(id){
  const d = devices[id];
  const newState = !d.alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${newState}`,{
    method:"POST"
  });
}

/* =========================
   INITIAL LOAD
========================= */

async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await r.json();
  data.forEach(update);
}
load();

/* =========================
   WEBSOCKET
========================= */

const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m) => {
  try {
    const data = JSON.parse(m.data);

    if(Array.isArray(data)){
      data.forEach(update);
    } else {
      update(data);
    }

  } catch(e){}
};

</script>

</body>
</html>
