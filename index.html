<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS CLEAN PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 340px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS CLEAN PRO</b>
  <hr>
  <div id="list"></div>
  <hr>
  <div id="infoBox">👆 Select device</div>
</div>

<div id="map"></div>

<script>

console.log("INIT OK");

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const devices = {};
const rendered = new Set();

let followedId = null;

/* =========================
   SAFE NUMBER
========================= */
function n(v){
  const x = Number(v);
  return Number.isFinite(x) ? x : null;
}

/* =========================
   ICON
========================= */
function icon(name="", angle=0){

  const color =
    name.toLowerCase().includes("nicole") ? "#ff3b30" :
    name.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        transform:rotate(${angle}deg);
        font-size:40px;
        color:${color};
        text-shadow:-1px -1px 0 black,1px 1px 0 black;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:13px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize:[40,40],
    iconAnchor:[20,20]
  });
}

/* =========================
   UPDATE DEVICE
========================= */
function update(d){

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null) return;

  const id = d.deviceId;

  devices[id] = d;

  /* MARKER */
  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(d.name)
    }).addTo(map);

    markers[id].on("click",()=>{
      followedId = id;
      map.setView([lat, lon], 17);
      showInfo(d);
    });
  } else {
    markers[id].setLatLng([lat, lon]);
  }

  /* LIST (ONLY ONCE) */
  render(d);
}

/* =========================
   LIST (NO DUPLICATES)
========================= */
function render(d){

  if(rendered.has(d.deviceId)) return;
  rendered.add(d.deviceId);

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className = "device";

  div.innerHTML = `
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick = ()=>{
    followedId = d.deviceId;
    map.setView([d.lat, d.lon], 17);
    showInfo(d);
  };

  el.appendChild(div);
}

/* =========================
   INFO
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML = `
    <b>${d.name}</b><br><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
    📡 ${d.status || "-"}<br>
  `;
}

/* =========================
   LOAD
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(update);
}

load();

/* =========================
   WS (LIVE ONLY)
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m)=>{
  try{
    const d = JSON.parse(m.data);
    update(d);
  } catch(e){
    console.log("WS ERROR");
  }
};

</script>

</body>
</html>
