<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Neon Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: #070b12;
  color: #d7fff7;
}

#map {
  height: 100vh;
  filter: contrast(1.1) brightness(1.05);
}

/* PANEL */
#panel{
  position:absolute;
  top:16px;
  left:16px;
  width:390px;
  max-height:92vh;
  overflow:auto;

  background: rgba(10, 15, 25, 0.55);
  backdrop-filter: blur(16px);

  border: 1px solid rgba(0,255,200,0.1);
  border-radius: 16px;

  padding: 14px;
  z-index: 9999;

  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* BUTTONS */
button{
  margin: 3px 2px;
  padding: 6px 10px;
  font-size: 12px;

  border-radius: 10px;
  border: 1px solid rgba(0,255,200,0.15);

  background: rgba(10, 20, 30, 0.6);
  color: #d7fff7;

  cursor: pointer;
  transition: 0.2s;

  backdrop-filter: blur(8px);
}

button:hover{
  transform: translateY(-1px);
  border-color: rgba(0,255,200,0.6);
  box-shadow: 0 0 12px rgba(0,255,200,0.25);
}

.follow{ border-color: rgba(0,180,255,0.3); }
.watch{ border-color: rgba(255,204,0,0.3); }
.alarm{ border-color: rgba(255,60,60,0.4); }

/* DEVICE CARD */
.device{
  margin-top: 10px;
  padding: 12px;

  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,255,200,0.08);
  border-radius: 14px;

  transition: 0.2s;
}

.device:hover{
  border-color: rgba(0,255,200,0.25);
  box-shadow: 0 0 18px rgba(0,255,200,0.08);
}

/* TEXT */
.device b{
  font-size: 15px;
}

/* CHIPS */
.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
  border:1px solid rgba(255,255,255,0.1);
}

.online{ background:rgba(52,199,89,0.15); }
.idle{ background:rgba(255,204,0,0.12); }
.alarmChip{ background:rgba(255,60,60,0.2); }

</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Neon Dashboard</b><br>

  <button onclick="toggleNav()">Nav</button>
  <button onclick="toggleAlarmSystem()">System</button>

  <hr>

  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices = {};
const markers = {};
const tracks = {};
const showTracks = {};
const lastPos = {};
const heading = {};

let followId = null;
let navMode = false;

let alarmEnabled = true;

/* HELPERS */
function getLastSeenSeconds(ts){
  if(!ts) return "?";
  return Math.max(0, Math.floor((Date.now() - ts) / 1000));
}

function color(name){
  const n = (name||"").toLowerCase();
  if(n.includes("oliver")) return "#00e5ff";
  if(n.includes("nicole")) return "#ff4d6d";
  return "#00ffb3";
}

function accuracyColor(acc){
  if(acc == null) return "#fff";
  if(acc <= 5) return "#00ff99";
  if(acc <= 20) return "#ffd60a";
  return "#ff3b30";
}

function bearing(lat1, lon1, lat2, lon2){
  const toRad = x => x*Math.PI/180;
  const toDeg = x => x*180/Math.PI;

  const φ1 = toRad(lat1);
  const φ2 = toRad(lat2);
  const Δλ = toRad(lon2-lon1);

  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) -
            Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

function distance(a,b){
  const R=6371e3;
  const toRad=x=>x*Math.PI/180;

  const φ1=toRad(a.lat), φ2=toRad(b.lat);
  const Δφ=toRad(b.lat-a.lat);
  const Δλ=toRad(b.lon-a.lon);

  const x =
    Math.sin(Δφ/2)**2 +
    Math.cos(φ1)*Math.cos(φ2)*
    Math.sin(Δλ/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* UPDATE */
function update(d){

  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(!lat||!lon) return;

  const prev=lastPos[id];
  let angle=heading[id]||0;

  const moving=d.isMotion||(d.speed??0)>0.5;

  if(prev&&moving){
    angle=bearing(prev.lat,prev.lon,lat,lon);
    heading[id]=angle;
  }

  if(prev){
    if(distance(prev,{lat,lon})>500) return;
  }

  lastPos[id]={lat,lon};
  devices[id]=d;

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name,angle)
    }).addTo(map);

    tracks[id]=L.polyline([],{
      color:color(d.name),
      weight:3
    });
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,angle));

  if(tracks[id]){
    const last=tracks[id].getLatLngs().slice(-1)[0];
    if(!last||distance(last,{lat,lon})>2){
      tracks[id].addLatLng([lat,lon]);
    }
  }

  if(followId===id){
    if(navMode){
      const z=17;
      const p=map.project([lat,lon],z);
      p.y-=150;
      map.setView(map.unproject(p,z),z);
    } else {
      map.panTo([lat,lon]);
    }
  }

  render();
}

/* ICON */
function icon(name,angle){
  const col=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[50,50],
    iconAnchor:[25,25],
    html:`
      <div style="position:relative;width:50px;height:50px;
      display:flex;align-items:center;justify-content:center;">

        <div style="
          font-size:26px;
          color:${col};
          transform:rotate(${angle}deg);
          text-shadow:0 0 10px ${col};
        ">▲</div>

        <div style="
          position:absolute;
          font-size:10px;
          font-weight:bold;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(devices).forEach(d=>{
    const id=d.deviceId;

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b>
        <span class="chip ${d.status}">${d.status||"unknown"}</span>
        ${d.alarmActive?`<span class="chip alarmChip">ALARM</span>`:""}
        <br>

        📍 ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}<br>
        🚶 ${d.isMotion?"MOVING":"STILL"}<br>
        🔋 ${d.battery??"-"}%<br>

        🎯 <span style="color:${accuracyColor(d.accuracy)}">
          ${d.accuracy??"-"} m
        </span><br>

        ⏱ ${getLastSeenSeconds(d.timestamp)}s ago<br>

        <hr>

        <button class="follow" onclick="follow('${id}')">Follow</button>
        <button onclick="toggleTrack('${id}')">Track</button>
        <button onclick="clearTrack('${id}')">Clear</button>
      </div>
    `;
  });
}

/* ACTIONS */
function follow(id){
  followId = followId===id?null:id;
}

function toggleNav(){
  navMode=!navMode;
}

function toggleAlarmSystem(){
  alarmEnabled=!alarmEnabled;
}

/* TRACK */
function toggleTrack(id){
  showTracks[id]=!showTracks[id];
  if(showTracks[id]===false){
    map.removeLayer(tracks[id]);
  } else {
    tracks[id].addTo(map);
  }
}

function clearTrack(id){
  if(tracks[id]) tracks[id].setLatLngs([]);
}

/* LOAD */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await r.json();
  data.forEach(update);
}
load();

/* WS */
function connect(){
  const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage=(m)=>{
    const d=JSON.parse(m.data);
    if(Array.isArray(d)) d.forEach(update);
    else update(d);
  };

  ws.onclose=()=>setTimeout(connect,2000);
}
connect();

</script>

</body>
</html>
