<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<meta name="theme-color" content="#05070b">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.app-frame{
  position:fixed;
  inset:0;
  background:#070a0f;
  z-index:0;
}

#panel{
  width:390px;
  margin:1.5cm 0 1.5cm 1.5cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  z-index:9999;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
}

#map{
  flex:1;
  margin:1.5cm 1.5cm 1.5cm 1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

/* DEVICE */
.device{
  margin-top:10px;
  padding:12px;
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  border:1px solid rgba(0,255,200,0.08);
}

.device b{color:#e6edf3;}

.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
}

.online{color:#00ff7b;border:1px solid #00ff7b55;}
.offline{color:#ff3b3b;border:1px solid #ff3b3b55;}
.alarmChip{color:#ff3b3b;border:1px solid #ff3b3b55;}

/* TOGGLES */
.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0;
  padding:8px 10px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,200,0.08);
}

.toggle input{
  appearance:none;
  width:40px;
  height:20px;
  background:#222;
  border-radius:20px;
  position:relative;
  cursor:pointer;
  transition:0.2s;
}

.toggle input:checked{
  background:#00ffb3;
  box-shadow:0 0 10px #00ffb3;
}

.toggle input::before{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  top:2px;
  left:2px;
  background:white;
  border-radius:50%;
  transition:0.2s;
}

.toggle input:checked::before{
  left:22px;
}

button{
  margin-top:8px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:rgba(10,20,30,0.6);
  color:#c9d1d9;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app-frame"></div>

<div id="panel">
  <b>🚗 GPS Control Center</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>
const devices = {};
const markers = {};
const tracks = {};

const followState = {};
const trackState = {};
const watchState = {};

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* COLORS */
function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON */
function icon(name){
  const col=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="display:flex;align-items:center;justify-content:center;">
        <div style="font-size:26px;color:${col};text-shadow:0 0 10px ${col};">▲</div>
        <div style="position:absolute;font-size:10px;color:white;font-weight:700;">${letter}</div>
      </div>
    `
  });
}

/* UPDATE DEVICE */
function update(d){
  const id = d.deviceId;
  const lat = +d.lat, lon = +d.lon;
  if(!lat || !lon) return;

  devices[id] = d;
  watchState[id] = d.isWatched;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon], {icon: icon(d.name)}).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  const pts = tracks[id].getLatLngs();
  pts.push([lat,lon]);
  if(pts.length > 500) pts.shift();
  tracks[id].setLatLngs(pts);

  if(followState[id]){
    map.setView([lat,lon], map.getZoom(), {animate:false});
  }

  render();
}

/* ACTIONS */
function follow(id){
  followState[id] = !followState[id];
}

function toggleTrack(id){
  trackState[id] = !trackState[id];
  if(tracks[id]){
    trackState[id] ? map.addLayer(tracks[id]) : map.removeLayer(tracks[id]);
  }
}

function watchToggle(id){
  watchState[id] = !watchState[id];

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${watchState[id] ? "watch" : "unwatch"}`,{
    method:"POST"
  }).catch(()=>{});
}

function toggleAlarm(id){
  const d = devices[id];
  if(!d) return;

  d.alarmActive = !d.alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${d.alarmActive}`,{
    method:"POST"
  }).catch(()=>{});

  render();
}

function clearTrack(id){
  if(tracks[id]) tracks[id].setLatLngs([]);
}

/* RENDER */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d=>{
    const id = d.deviceId;

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b>

        <span class="chip ${d.status==='online'?'online':'offline'}">
          ${d.status==='online'?'ONLINE':'OFFLINE'}
        </span>

        ${d.alarmActive ? `<span class="chip alarmChip">ALARM</span>` : ""}

        <br><br>

        📍 ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}<br>
        🚶 ${d.isMotion ? "MOVING" : "STILL"}<br>
        🔋 ${d.battery ?? "-"}%<br>

        <hr>

        <label class="toggle">
          <span>FOLLOW</span>
          <input type="checkbox" onchange="follow('${id}')" ${followState[id] ? "checked" : ""}>
        </label>

        <label class="toggle">
          <span>TRACK</span>
          <input type="checkbox" onchange="toggleTrack('${id}')" ${trackState[id] ? "checked" : ""}>
        </label>

        <label class="toggle">
          <span>WATCH</span>
          <input type="checkbox" onchange="watchToggle('${id}')" ${watchState[id] ? "checked" : ""}>
        </label>

        <label class="toggle">
          <span>ALARM</span>
          <input type="checkbox" onchange="toggleAlarm('${id}')" ${d.alarmActive ? "checked" : ""}>
        </label>

        <button onclick="clearTrack('${id}')">CLEAR TRACK</button>
      </div>
    `;
  });
}

/* LOAD */
async function load(){
  try{
    const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
    const data = await r.json();
    data.forEach(update);
  }catch(e){
    console.error(e);
  }
}
load();

/* WEBSOCKET */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m)=>{
  try{
    const d = JSON.parse(m.data);
    if(Array.isArray(d)) d.forEach(update);
    else update(d);
  }catch(e){}
};
</script>

</body>
</html>
