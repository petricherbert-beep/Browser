<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:system-ui;
  background:#05070b;
  color:#e6edf3;
  overflow:hidden;
}

/* SIDEBAR */
#panel{
  width:360px;
  padding:14px;
  overflow:auto;
  background:rgba(10,15,25,0.6);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(0,255,200,0.15);
}

/* MAP */
#map{
  flex:1;
}

/* HEADER */
.header{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

/* DEVICE CARD */
.device{
  padding:12px;
  margin-bottom:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,200,0.1);
  transition:0.2s;
}

.device:hover{
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(0,255,200,0.2);
}

.name{
  font-weight:700;
  font-size:14px;
}

.coords{
  font-size:11px;
  opacity:0.7;
}

.info{
  font-size:12px;
  margin-top:6px;
  line-height:1.5;
}

/* STATUS */
.online{ color:#00ff9c; }
.offline{ color:#ff4d4d; }

/* BUTTONS */
.row{
  margin-top:8px;
}

button{
  padding:6px 10px;
  font-size:11px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.2);
  background:#0b1320;
  color:#c9d1d9;
  cursor:pointer;
  margin:2px;
  transition:0.2s;
}

button:hover{
  box-shadow:0 0 10px rgba(0,255,200,0.4);
}

.active{
  border-color:#00ffb3;
  box-shadow:0 0 10px #00ffb3;
}

.follow{ color:#3aa0ff; border-color:#3aa0ff; }
.track{ color:#00ffb3; border-color:#00ffb3; }
.zoom{ color:#ffd84d; border-color:#ffd84d; }

/* FULLSCREEN */
.full{
  width:100%;
  margin-bottom:10px;
  font-weight:700;
}
</style>
</head>

<body>

<div id="panel">
  <button class="full" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <div class="header">📡 DEVICES</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* 🔐 CONFIG */
const API_KEY = "LaLuna170284?";
const BASE = "https://gps-server-f9b6.onrender.com";

/* STATE */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* SOCKET */
const socket = io(BASE,{
  auth:{ apiKey: API_KEY }
});

socket.on("location_update", update);

/* FETCH */
function api(url,opts={}){
  return fetch(BASE+url,{
    ...opts,
    headers:{
      "x-api-key":API_KEY,
      "Content-Type":"application/json",
      ...(opts.headers||{})
    }
  });
}

/* COLOR */
function color(name){
  name=(name||"").toLowerCase();
  if(name.includes("oliver")) return "#3aa0ff";
  if(name.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON */
function icon(name){
  const c=color(name);
  const l=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    html:`<div style="
      width:34px;height:34px;border-radius:50%;
      background:${c};
      display:flex;align-items:center;justify-content:center;
      font-weight:900;color:#000;
      box-shadow:0 0 10px ${c};
    ">${l}</div>`,
    className:"",
    iconSize:[34,34]
  });
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  if(!d.lat || !d.lon) return;

  devices[id]={...devices[id],...d};
  ui[id]=ui[id]||{follow:false,track:false};

  if(!markers[id]){
    markers[id]=L.marker([d.lat,d.lon],{icon:icon(d.name)}).addTo(map);
  }

  markers[id].setLatLng([d.lat,d.lon]);

  if(ui[id].track){
    if(!tracks[id]){
      tracks[id]=L.polyline([],{
        color:color(d.name),
        weight:3
      }).addTo(map);
    }
    const pts=tracks[id].getLatLngs();
    pts.push([d.lat,d.lon]);
    if(pts.length>150) pts.shift();
    tracks[id].setLatLngs(pts);
  }

  if(followId===id) map.panTo([d.lat,d.lon]);

  render();
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];
    const online = Date.now() - (d.lastSeen||0) < 30000;

    el.innerHTML+=`
    <div class="device">
      <div class="name">${d.name||id}</div>
      <div class="coords">${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}</div>

    <div class="info"> 
    ⚡ ${d.speed||0} km/h<br> 
    🎯 ±${d.accuracy||"-"} m<br> 🔋 ${d.battery||"-"}%<br> 
    🚶 ${d.isMotion?"MOVING":"STILL"}<br> 
    📡 ${online?"🟢 ONLINE":"🔴 OFFLINE"}<br> 
    ⏱ ${d.timestamp?new Date(d.timestamp).toLocaleTimeString():"-"}<br> 
    👀 WATCH: ${u?.watch?"YES":"NO"} </div>

      <div class="row">
        <button class="${u.follow?'active follow':''}" onclick="follow('${id}')">FOLLOW</button>
        <button class="${u.track?'active track':''}" onclick="track('${id}')">TRACK</button>
        <button class="zoom" onclick="zoomTo('${id}')">ZOOM</button>
      </div>
    </div>
    `;
  });
}

/* ACTIONS */
function follow(id){
  ui[id].follow=!ui[id].follow;
  followId=ui[id].follow?id:null;
  render();
}

function track(id){
  ui[id].track=!ui[id].track;
  if(!ui[id].track && tracks[id]) tracks[id].setLatLngs([]);
  render();
}

function zoomTo(id){
  const d=devices[id];
  if(d) map.setView([d.lat,d.lon],16);
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* INIT */
api("/devices")
.then(r=>r.json())
.then(arr=>arr.forEach(update));

</script>

</body>
</html>
