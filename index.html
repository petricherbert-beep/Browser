<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:380px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.15);
  box-shadow:0 0 50px rgba(0,255,200,0.25);
  backdrop-filter: blur(12px);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 80px rgba(0,255,200,0.25);
}

/* DEVICE */
.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.15);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  box-shadow:0 0 12px rgba(0,255,200,0.35);
}

/* GLOW */
.glow-btn{
  width:100%;
  font-weight:700;
  border:1px solid rgba(0,255,200,0.35);
  box-shadow:0 0 12px rgba(0,255,200,0.35);
}

.glow-btn:hover{
  box-shadow:0 0 20px rgba(0,255,200,0.7);
}

/* STATES */
.active-follow{ color:#3aa0ff; border-color:#3aa0ff; }
.active-track{ color:#00ffb3; border-color:#00ffb3; }
.active-watch{ color:#ffd84d; border-color:#ffd84d; }
.active-alarm{ color:#ff4d4d; border-color:#ff4d4d; }
</style>
</head>

<body>

<div id="panel">
  <button class="glow-btn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const SERVER = "https://gps-server-f9b6.onrender.com";
const API_KEY = "DEIN_GEHEIMER_SCHLUESSEL";

const devices = {};
const ui = {};
const markers = {};
const tracks = {};
let followId = null;

/* SAFE FETCH (WICHTIG) */
async function apiFetch(url, options = {}) {
  const res = await fetch(`${SERVER}${url}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      ...(options.headers || {})
    }
  });

  const text = await res.text();

  if (!res.ok) {
    console.error("SERVER ERROR:", res.status, text);
    return [];
  }

  try {
    return JSON.parse(text);
  } catch (e) {
    console.error("INVALID JSON:", text);
    return [];
  }
}

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* SOCKET */
const socket = io(SERVER);
socket.on("location_update", update);

/* ICON */
function icon(name){
  const n = (name||"").toLowerCase();
  let c = "#00ffb3";
  let l = (name?.[0]||"?").toUpperCase();

  if(n.includes("nicole")) { c="#ff3b3b"; l="N"; }
  if(n.includes("oliver")) { c="#3aa0ff"; l="O"; }

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;font-size:34px;color:${c};">▲</div>
        <div style="position:absolute;font-size:13px;color:#fff;">${l}</div>
      </div>`
  });
}

/* UPDATE */
function update(d){
  if(!d.deviceId) return;

  const id = d.deviceId;
  devices[id] = {...devices[id],...d};
  ui[id] = ui[id] || {follow:false,track:false,watch:false};

  if(!markers[id]){
    markers[id] = L.marker([d.lat,d.lon],{icon:icon(d.name)}).addTo(map);
  } else {
    markers[id].setLatLng([d.lat,d.lon]);
  }

  if(ui[id].track){
    if(!tracks[id]){
      tracks[id] = L.polyline([],{
        color:"#00ffb3",
        weight:3
      }).addTo(map);
    }
    const pts = tracks[id].getLatLngs();
    pts.push([d.lat,d.lon]);
    tracks[id].setLatLngs(pts.slice(-200));
  }

  if(followId === id){
    map.panTo([d.lat,d.lon]);
  }

  render();
}

/* UI */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.entries(devices).forEach(([id,d])=>{
    const u = ui[id];
    const online = Date.now() - (d.lastSeen||0) < 30000;

    el.innerHTML += `
      <div class="device">
        <b>${d.name||id}</b><br><br>
        📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
        ⚡ ${d.speed||0} km/h<br>
        🔋 ${d.battery||"-"}%<br>
        📡 ${online?"ONLINE":"OFFLINE"}<br>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="follow('${id}')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="track('${id}')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
        <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
      </div>
    `;
  });
}

/* ACTIONS */
function follow(id){
  ui[id].follow = !ui[id].follow;
  followId = ui[id].follow ? id : null;
  render();
}

function track(id){
  ui[id].track = !ui[id].track;
  if(!ui[id].track && tracks[id]) tracks[id].setLatLngs([]);
  render();
}

function watch(id){
  ui[id].watch = !ui[id].watch;
  apiFetch(`/devices/${id}/watch`,{
    method:"POST",
    body: JSON.stringify({watch:ui[id].watch})
  });
  render();
}

function alarm(id){
  const state = !devices[id].alarmActive;
  devices[id].alarmActive = state;

  apiFetch(`/devices/${id}/alarm?active=${state}`,{
    method:"POST"
  });

  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* INIT */
apiFetch("/devices")
  .then(data => data.forEach(update));

</script>

</body>
</html>
