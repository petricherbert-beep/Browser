<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO MAX</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0b0f14;
}

#map {
  position:absolute;
  top:0;
  bottom:0;
  width:100%;
}

/* Bottom panel */
#panel {
  position:absolute;
  bottom:0;
  width:100%;
  height:32%;
  background:rgba(20,20,20,0.85);
  backdrop-filter:blur(14px);
  color:white;
  border-radius:18px 18px 0 0;
  padding:12px;
  overflow:auto;
}

.device {
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
}

.device:hover {
  background:rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">
  <b>🚗 ULTRA PRO MAX</b>
  <div id="list"></div>
</div>

<script>
mapboxgl.accessToken = "YOUR_MAPBOX_TOKEN";

/* =========================
   MAP INIT
========================= */
const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/navigation-night-v1",
  center: [15.42, 47.09],
  zoom: 14,
  pitch: 60,
  bearing: 0,
  antialias: true
});

/* =========================
   STATE
========================= */
const devices = new Map();
let followedId = null;

/* =========================
   HELPERS
========================= */
function bearing(lat1, lon1, lat2, lon2){
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;

  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* =========================
   CAMERA FOLLOW
========================= */
function followCar(lon, lat, heading){

  const dist = 0.0025;
  const rad = heading*Math.PI/180;

  const camLng = lon - Math.sin(rad)*dist;
  const camLat = lat - Math.cos(rad)*dist;

  map.easeTo({
    center:[camLng, camLat],
    bearing:heading,
    pitch:65,
    duration:300,
    easing:t=>t
  });
}

/* =========================
   ADD DEVICE
========================= */
function addDevice(id, lng, lat){

  map.addSource(id, {
    type:"geojson",
    data:{
      type:"Feature",
      geometry:{
        type:"Point",
        coordinates:[lng,lat]
      },
      properties:{heading:0}
    }
  });

  map.addLayer({
    id:id,
    type:"symbol",
    source:id,
    layout:{
      "icon-image":"car-15",
      "icon-size":1.5,
      "icon-rotate":["get","heading"],
      "icon-rotation-alignment":"map"
    }
  });

  map.addSource(id+"-trail", {
    type:"geojson",
    data:{
      type:"Feature",
      geometry:{
        type:"LineString",
        coordinates:[]
      }
    }
  });

  map.addLayer({
    id:id+"-trail",
    type:"line",
    source:id+"-trail",
    paint:{
      "line-color":"#00ffff",
      "line-width":3,
      "line-opacity":0.7
    }
  });

  devices.set(id,{
    current:{lat,lon:lng},
    target:{lat,lon:lng},
    last:null,
    heading:0,
    trail:[]
  });
}

/* =========================
   UPDATE DEVICE
========================= */
function updateDevice(d){

  const {deviceId, lat, lon, name} = d;

  if(!devices.has(deviceId)){
    addDevice(deviceId, lon, lat);
    renderDevice(d);
  }

  const dev = devices.get(deviceId);
  dev.target = {lat, lon};
}

/* =========================
   SMOOTH ENGINE
========================= */
function animate(){

  devices.forEach((dev,id)=>{

    const c = dev.current;
    const t = dev.target;

    c.lat += (t.lat - c.lat)*0.15;
    c.lon += (t.lon - c.lon)*0.15;

    if(dev.last){
      const raw = bearing(dev.last.lat, dev.last.lon, c.lat, c.lon);

      let diff = raw - dev.heading;
      if(diff>180) diff-=360;
      if(diff<-180) diff+=360;

      dev.heading += diff*0.2;
    }

    dev.last = {lat:c.lat, lon:c.lon};

    /* update map */
    const source = map.getSource(id);
    if(source){
      source.setData({
        type:"Feature",
        geometry:{
          type:"Point",
          coordinates:[c.lon, c.lat]
        },
        properties:{heading:dev.heading}
      });
    }

    /* trail */
    dev.trail.push([c.lon, c.lat]);
    if(dev.trail.length>40) dev.trail.shift();

    const trailSrc = map.getSource(id+"-trail");
    if(trailSrc){
      trailSrc.setData({
        type:"Feature",
        geometry:{
          type:"LineString",
          coordinates:dev.trail
        }
      });
    }

    if(id === followedId){
      followCar(c.lon, c.lat, dev.heading);
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   UI LIST
========================= */
function renderDevice(d){

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className = "device";

  div.innerHTML = `
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick = ()=>{
    followedId = d.deviceId;
  };

  el.appendChild(div);
}

/* =========================
   LOAD
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(updateDevice);
}

load();

/* =========================
   WS AUTO RECONNECT
========================= */
function connectWS(){

  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (m)=>{
    const d = JSON.parse(m.data);
    updateDevice(d);
  };

  ws.onclose = ()=>{
    console.log("reconnecting...");
    setTimeout(connectWS, 2000);
  };
}

connectWS();

</script>

</body>
</html>
