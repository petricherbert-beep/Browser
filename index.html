<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO - STABLE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 340px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

button {
  margin-top:6px;
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#1f1f1f;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS ULTRA PRO (STABLE)</b>

  <button onclick="navigationMode=!navigationMode">
    📍 Toggle Navigation
  </button>

  <hr>

  <div id="list"></div>

  <hr>

  <div id="infoBox">👆 Select device</div>
</div>

<div id="map"></div>

<script>

console.log("START OK");

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const names = {};

let followedId = null;
let navigationMode = false;

/* =========================
   SAFE NUMBER
========================= */
function n(v){
  const x = Number(v);
  return Number.isFinite(x) ? x : null;
}

/* =========================
   ICON (STABLE + OUTLINE)
========================= */
function icon(angle, name="") {

  const color =
    name.toLowerCase().includes("nicole") ? "#ff3b30" :
    name.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        position:relative;
        transform:rotate(${angle}deg);
        font-size:44px;
        color:${color};
        text-shadow:
          -1px -1px 0 black,
           1px -1px 0 black,
          -1px  1px 0 black,
           1px  1px 0 black;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:14px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize:[44,44],
    iconAnchor:[22,22]
  });
}

/* =========================
   BEARING
========================= */
function bearing(a,b,c,d){

  const toRad = x => x*Math.PI/180;
  const toDeg = x => x*180/Math.PI;

  const dLon = toRad(d-b);

  const y = Math.sin(dLon)*Math.cos(toRad(c));
  const x =
    Math.cos(toRad(a))*Math.sin(toRad(c)) -
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* =========================
   INFO
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML=`
    <b>${d.name}</b><br><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
    📡 ${d.status}<br>
  `;
}

/* =========================
   UPDATE (REAL TIME SAFE)
========================= */
function update(d){

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null) return;

  const id = d.deviceId;

  names[id] = d.name;

  let ang = 0;

  const prev = markers[id]?.getLatLng();

  if(prev){
    ang = bearing(prev.lat, prev.lng, lat, lon);
  }

  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(ang, d.name)
    }).addTo(map);

    markers[id].on("click",()=>{
      followedId = id;
      navigationMode = true;
      showInfo(d);
      map.setView([lat, lon], 17);
    });

    render(d);
  } else {
    markers[id].setLatLng([lat, lon]);
    markers[id].setIcon(icon(ang, d.name));
  }

  /* CAMERA FOLLOW (SAFE) */
  if(navigationMode && id === followedId){
    map.panTo([lat, lon], {
      animate: true,
      duration: 0.25
    });
  }

  if(followedId === id){
    showInfo(d);
  }
}

/* =========================
   LIST (NO DUPLICATES)
========================= */
const rendered = new Set();

function render(d){

  if(rendered.has(d.deviceId)) return;
  rendered.add(d.deviceId);

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className="device";

  div.innerHTML=`
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick=()=>{
    followedId = d.deviceId;
    navigationMode = true;
    showInfo(d);
    map.setView([d.lat, d.lon], 17);
  };

  el.appendChild(div);
}

/* =========================
   LOAD INITIAL
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(update);
  data.forEach(render);
}

load();

/* =========================
   WS (REAL TIME)
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onopen = ()=>console.log("WS CONNECTED");

ws.onmessage = (m)=>{
  try{
    update(JSON.parse(m.data));
  }catch(e){
    console.log("WS PARSE ERROR");
  }
};

ws.onerror = (e)=>console.log("WS ERROR");

ws.onclose = ()=>{
  console.log("WS CLOSED → reload");
  setTimeout(()=>location.reload(), 2000);
};

</script>

</body>
</html>
