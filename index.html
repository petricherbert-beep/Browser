<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<title>GPS Realtime Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel{
  position:absolute;
  top:10px; left:10px;
  width:360px;
  max-height:90vh;
  overflow:auto;
  background:rgba(20,20,20,0.9);
  color:white;
  padding:10px;
  border-radius:12px;
  z-index:9999;
}

.device{
  border-bottom:1px solid #333;
  padding:10px 0;
}

button{
  margin:2px;
  padding:5px 7px;
  font-size:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.watch{background:#ffcc00;}
.follow{background:#0a84ff;color:white;}
.alarm{background:#ff3b30;color:white;}

@keyframes pulseWatch {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(2.2); opacity: 0; }
}
</style>

</head>

<body>

<div id="panel">
  <b>🚗 GPS Realtime Pro</b>
  <button onclick="toggleNav()">Nav</button>
  <button onclick="toggleAlarm()">🔊 Alarm</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */

const devices = {};
const markers = {};
const tracks = {};
const lastPos = {};
const heading = {};

let followId = null;
let navMode = false;
let lastPan = 0;

let alarmEnabled = true;

/* 🔊 Alarm */
const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;
let activeAlarmDevice = null;

/* 🔓 Audio Unlock (Mobile) */
document.addEventListener("click", () => {
  alarmAudio.play().then(() => {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
  }).catch(()=>{});
}, { once: true });

/* ================= MAP ================= */

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= HELPERS ================= */

function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

function bearing(lat1, lon1, lat2, lon2){
  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const φ1 = toRad(lat1);
  const φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);

  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x =
    Math.cos(φ1) * Math.sin(φ2) -
    Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* ================= ICON ================= */

function icon(name, angle, isWatched){

  const col = color(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[60,60],
    iconAnchor:[30,30],

    html:`
      <div style="position:relative;width:60px;height:60px;
        display:flex;align-items:center;justify-content:center;">

        ${isWatched ? `
          <div style="
            position:absolute;
            width:70px;height:70px;
            border:2px solid gold;
            border-radius:50%;
            animation:pulseWatch 1.5s infinite;
          "></div>
        ` : ""}

        <div style="
          position:absolute;
          font-size:30px;
          color:black;
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:28px;
          color:${col};
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:11px;
          font-weight:800;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* ================= UPDATE ================= */

function update(d){

  const id = d.deviceId;
  const lat = Number(d.lat);
  const lon = Number(d.lon);
  if(!lat || !lon) return;

  const prev = lastPos[id];
  let angle = heading[id] || 0;

  if(prev && (d.speed ?? 0) > 0.5){
    const moved =
      Math.abs(lat-prev.lat) > 0.00001 ||
      Math.abs(lon-prev.lon) > 0.00001;

    if(moved){
      angle = bearing(prev.lat, prev.lon, lat, lon);
      heading[id] = angle;
    }
  }

  lastPos[id] = {lat,lon};
  devices[id] = d;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angle, d.isWatched)
    }).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 4,
      opacity: 0.8
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  const displayAngle = navMode ? 0 : angle;
  markers[id].setIcon(icon(d.name, displayAngle, d.isWatched));

  /* Track Limit */
  tracks[id].addLatLng([lat,lon]);

  const MAX_POINTS = 500;
  if (tracks[id].getLatLngs().length > MAX_POINTS) {
    tracks[id].setLatLngs(
      tracks[id].getLatLngs().slice(-MAX_POINTS)
    );
  }

  /* FOLLOW */
  if(followId === id){
    if(navMode){
      navigationCamera(lat, lon, angle);
    } else {
      normalFollow(lat, lon);
    }
  }

  /* 🔊 Alarm */
  if(followId === id && alarmEnabled){

    if(d.alarmActive && activeAlarmDevice !== id){
      alarmAudio.play().catch(()=>{});
      activeAlarmDevice = id;
    }

    if(!d.alarmActive && activeAlarmDevice === id){
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      activeAlarmDevice = null;
    }

  } else {
    if(activeAlarmDevice){
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      activeAlarmDevice = null;
    }
  }

  render();
}

/* ================= CAMERA ================= */

function normalFollow(lat, lon){
  const now = Date.now();
  if(now - lastPan < 300) return;

  lastPan = now;
  map.panTo([lat,lon], {animate:true,duration:0.25});
}

function navigationCamera(lat, lon, angle){

  const now = Date.now();
  if(now - lastPan < 200) return;
  lastPan = now;

  const zoom = 17;

  const point = map.project([lat, lon], zoom);
  point.y -= 150;

  const newLatLng = map.unproject(point, zoom);

  map.setView(newLatLng, zoom, {
    animate:true,
    duration:0.3
  });
}

/* ================= UI ================= */

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d => {

    const speed = (d.speed ?? 0) * 3.6;

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b><br>

        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🔋 ${d.battery ?? "-"}%<br>
        📡 ${d.status ?? "unknown"}<br>
        🎯 ${d.accuracy ?? "-"}m<br>
        ⏱ ${new Date(d.timestamp||Date.now()).toLocaleTimeString()}<br>
        🚨 ${d.alarmActive ? "ALARM" : "OK"}<br>
        🔊 System: ${alarmEnabled ? "AN" : "AUS"}<br>

        <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
        <button onclick="unwatch('${d.deviceId}')">Unwatch</button>

        <button class="follow" style="
          background:${followId === d.deviceId ? '#00ff88' : '#0a84ff'};
          color:white;
        " onclick="follow('${d.deviceId}')">
          Follow
        </button>

        <button class="alarm" onclick="alarm('${d.deviceId}')">Alarm</button>
      </div>
    `;
  });
}

/* ================= ACTIONS ================= */

function watch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch`,{method:"POST"});
}

function unwatch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
}

function follow(id){
  followId = (followId === id ? null : id);
  render();
}

function toggleNav(){
  navMode = !navMode;
}

function toggleAlarm(){
  alarmEnabled = !alarmEnabled;

  if(!alarmEnabled){
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
    activeAlarmDevice = null;
  }

  render();
}

function alarm(id){
  const d = devices[id];
  const newState = !d.alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${newState}`,{
    method:"POST"
  });
}

/* ================= LOAD ================= */

async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await r.json();
  data.forEach(update);
}
load();

/* ================= WS ================= */

function connectWS(){

  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (m) => {
    try{
      const data = JSON.parse(m.data);

      if(Array.isArray(data)){
        data.forEach(update);
      } else {
        update(data);
      }

    }catch(e){}
  };

  ws.onclose = () => {
    console.log("WS reconnect...");
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

connectWS();

</script>

</body>
</html>
