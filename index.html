<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS REALTIME TRACKING</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel {
  position:absolute;
  top:12px; left:12px;
  width:390px;
  max-height:85vh;
  overflow:auto;
  background:rgba(20,20,20,0.9);
  backdrop-filter:blur(14px);
  color:white;
  padding:12px;
  border-radius:14px;
  z-index:9999;
}

button {
  margin:3px;
  padding:6px 8px;
  border:none;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.follow { background:#0a84ff; color:white; }
.watch { background:#ffcc00; color:black; }

@keyframes pulse {
  0% { transform:scale(1); opacity:0.8; }
  100% { transform:scale(2.2); opacity:0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 REALTIME GPS SYSTEM</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* STATE */
const markers = {};
const tracks = {};
const list = {};
const last = {};
const angles = {};
const alarmState = {};

let followId = null;

/* HELPERS */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

/* COLOR */
function getColor(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

/* BEARING */
function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ICON */
function icon(name){

  const color = getColor(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    html:`
      <div style="width:70px;height:70px;position:relative;">

        <!-- DOT -->
        <div style="
          position:absolute;
          width:16px;height:16px;
          border-radius:50%;
          background:${color};
          top:50%;left:50%;
          transform:translate(-50%,-50%);
        "></div>

        <!-- VECTOR -->
        <div style="
          position:absolute;
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:34px;
          color:${color};
        ">
          ▲
        </div>

        <!-- LETTER -->
        <div style="
          position:absolute;
          top:50%;left:50%;
          transform:translate(-50%,-50%);
          font-size:11px;
          font-weight:800;
          color:white;
        ">
          ${letter}
        </div>

      </div>
    `
  });
}

/* REALTIME UPDATE (IMPORTANT FIX) */
function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);
  if(lat===null||lon===null) return;

  const prev = last[id];

  let angle = angles[id];

  if(prev){

    const moved =
      Math.abs(lat - prev.lat) > 0.00001 ||
      Math.abs(lon - prev.lon) > 0.00001;

    const speedOk = (d.speed ?? 0) > 0.5;

    if(moved && speedOk){
      angle = bearing(prev.lat,prev.lon,lat,lon);
      angles[id] = angle;
    }
  }

  last[id] = {lat,lon};

  /* MARKER CREATE */
  if(!markers[id]){

    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name),
      rotationAngle:0,
      rotationOrigin:"center"
    }).addTo(map);

    tracks[id]=L.polyline([],{
      color:getColor(d.name),
      weight:4,
      opacity:0.8
    }).addTo(map);
  }

  /* 🚀 INSTANT MOVE (NO LAG) */
  markers[id].setLatLng([lat,lon]);
  markers[id].setRotationAngle(angle || 0);

  tracks[id].addLatLng([lat,lon]);

  /* ALARM FIX */
  alarmState[id] = d.alarmActive;

  if(d.alarmActive && d.isWatched){
    const audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
  }

  /* STORE */
  list[id] = d;

  render(); // lightweight ok now
}

/* TOGGLE ALARM */
function toggleAlarm(id){

  const state = !alarmState[id];
  alarmState[id] = state;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ alarmActive: state })
  });
}

/* WATCH */
function watch(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch`,{method:"POST"});
}

/* UI (LIGHTWEIGHT) */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(list).forEach(d=>{

    const speed=(d.speed??0)*3.6;

    el.innerHTML+=`
      <div style="padding:10px;border-bottom:1px solid #333;">
        <b>${d.name}</b><br>
        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🔋 ${d.battery??"-"}%<br>
        📡 ${d.status??"unknown"}<br>

        <div style="color:${d.alarmActive ? '#ff3b30' : '#888'};">
          ${d.alarmActive ? "🚨 ALARM" : "OK"}
        </div>

        <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
        <button onclick="toggleAlarm('${d.deviceId}')"
          style="background:${d.alarmActive ? '#ff3b30' : '#444'}; color:white;">
          🚨 Alarm
        </button>
      </div>
    `;
  });
}

/* LOAD */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d=await r.json();
  d.forEach(update);
}
load();

/* WS REALTIME */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=(m)=>{try{update(JSON.parse(m.data));}catch(e){}};

</script>

</body>
</html>
