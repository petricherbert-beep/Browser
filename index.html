<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Realtime Pro - MASTER</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

/* ... DEIN CSS UNVERÄNDERT ... */
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Realtime MASTER</b><br>

  <button onclick="toggleNav()">Nav</button>
  <button onclick="toggleAlarmSystem()">🔊 System</button>

  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */

const devices = {};
const markers = {};
const tracks = {};
const showTracks = {};   // ✅ NEU
const lastPos = {};
const heading = {};

let followId = null;
let navMode = false;

let alarmEnabled = true;
let activeAlarmDevice = null;

const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;

/* ================= MAP ================= */

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= UPDATE ================= */

function update(d){

  const id = d.deviceId;
  const lat = Number(d.lat);
  const lon = Number(d.lon);
  if(!lat || !lon) return;

  devices[id] = d;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon]).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  /* ===== TRACK ===== */

  if(!tracks[id]){
    tracks[id] = L.polyline([], {
      color: "#4dffb5",
      weight: 4,
      opacity: 0.8
    });

    if(showTracks[id] !== false){
      tracks[id].addTo(map);
    }
  }

  // Punkte IMMER speichern
  tracks[id].addLatLng([lat,lon]);

  // Sichtbarkeit steuern
  if(showTracks[id] === false){
    map.removeLayer(tracks[id]);
  }

  render();
}

/* ================= UI ================= */

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d => {

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b><br>

        <button onclick="follow('${d.deviceId}')">Follow</button>

        <!-- ✅ NEU -->
        <button onclick="toggleTrack('${d.deviceId}')">
          ${showTracks[d.deviceId] === false ? "Track ON" : "Track OFF"}
        </button>

        <button onclick="clearTrack('${d.deviceId}')">
          🧹 Clear Track
        </button>
      </div>
    `;
  });
}

/* ================= ACTIONS ================= */

function follow(id){
  followId = (followId === id ? null : id);
}

/* ✅ NEU */
function toggleTrack(id){

  showTracks[id] = showTracks[id] === false ? true : false;

  if(tracks[id]){
    if(showTracks[id] === false){
      map.removeLayer(tracks[id]);
    } else {
      tracks[id].addTo(map);
    }
  }

  render();
}

/* ✅ NEU */
function clearTrack(id){
  if(tracks[id]){
    tracks[id].setLatLngs([]);
  }
}

/* ================= LOAD ================= */

async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await r.json();
  data.forEach(update);
}
load();

/* ================= WS ================= */

function connectWS(){
  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if(Array.isArray(data)) data.forEach(update);
    else update(data);
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
}

connectWS();

</script>

</body>
</html>
