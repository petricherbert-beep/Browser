<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO SAFE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* PANEL */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 330px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.78);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

button {
  margin-top:6px;
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#1f1f1f;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 ULTRA PRO (CRASH SAFE)</b>

  <div style="margin-top:8px;">
    <button onclick="navigationMode = !navigationMode">
      📍 Navigation Mode
    </button>
  </div>

  <hr>

  <div id="list"></div>

  <hr>

  <div id="infoBox">👆 Select device</div>
</div>

<div id="map"></div>

<script>

console.log("SCRIPT LOADED ✅");

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE (SAFE INIT)
========================= */
const markers = {};
const current = {};
const target = {};
const last = {};
const headingState = {};
const names = {};

let followedId = null;
let navigationMode = false;

/* =========================
   SAFE NUMBER HELPER
========================= */
function safeNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

/* =========================
   ICON
========================= */
function icon(angle, name="") {

  const n = (name || "").toLowerCase();

  let color = "#2ecc71";
  if (n.includes("nicole")) color = "#ff3b30";
  if (n.includes("oliver")) color = "#0a84ff";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className: "",
    html: `
      <div style="
        transform: rotate(${angle}deg);
        font-size: 42px;
        color: ${color};
        position: relative;
      ">
        ➤
        <div style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%,-50%) rotate(-${angle}deg);
          color: white;
          font-size: 14px;
          font-weight: 800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize: [44, 44],
    iconAnchor: [22, 22]
  });
}

/* =========================
   BEARING SAFE
========================= */
function bearing(lat1, lon1, lat2, lon2) {

  if([lat1,lon1,lat2,lon2].some(v => !Number.isFinite(v))) return 0;

  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);

  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* =========================
   FOLLOW CAMERA
========================= */
function followCar(lat, lon, heading) {

  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;

  const offset = 0.0012;
  const rad = heading * Math.PI / 180;

  const camLat = lat - Math.cos(rad) * offset;
  const camLon = lon - Math.sin(rad) * offset;

  map.setView([camLat, camLon], map.getZoom(), {
    animate: true,
    duration: 0.25
  });
}

/* =========================
   INFO PANEL
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML=`
    <b>${d.name}</b><br><br>

    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
    🎯 ${d.accuracy} m<br>
    📡 ${d.status}<br>

    <hr>

    <button onclick="setAlarm('${d.deviceId}', true)">🚨 Alarm ON</button>
    <button onclick="setAlarm('${d.deviceId}', false)">🔕 Alarm OFF</button>

    <button onclick="watch('${d.deviceId}')">👁 Watch ON</button>
    <button onclick="unwatch('${d.deviceId}')">🚫 Watch OFF</button>
  `;
}

/* =========================
   API SAFE
========================= */
async function setAlarm(id,v){
  try{
    await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${v}`,{method:"POST"});
  }catch(e){console.log(e);}
}

async function watch(id){
  try{
    await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/watch?watcherId=web`,{method:"POST"});
  }catch(e){}
}

async function unwatch(id){
  try{
    await fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/unwatch`,{method:"POST"});
  }catch(e){}
}

/* =========================
   UPDATE (CRASH SAFE CORE)
========================= */
function update(d){

  const lat = safeNum(d.lat);
  const lon = safeNum(d.lon);

  if(lat === null || lon === null) return;

  const id = d.deviceId;

  names[id] = d.name || "unknown";

  target[id] = {lat, lon};

  if(!current[id]){
    current[id] = {lat, lon};
  }

  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(0, d.name)
    }).addTo(map);

    markers[id].on("click",()=>{
      followedId = id;
      navigationMode = true;
      showInfo(d);
      map.setView([lat, lon], 17);
    });

    render(d);
  }

  if(followedId === id){
    showInfo(d);
  }
}

/* =========================
   ENGINE (FULL SAFE)
========================= */
function animate(){

  Object.keys(target).forEach(id=>{

    const c = current[id];
    const t = target[id];

    if(!c || !t) return;

    const nl = c.lat + (t.lat - c.lat) * 0.12;
    const no = c.lon + (t.lon - c.lon) * 0.12;

    if(!Number.isFinite(nl) || !Number.isFinite(no)) return;

    let ang = headingState[id] || 0;

    const prev = last[id];

    if(prev){

      const dist =
        Math.abs(nl - prev.lat) +
        Math.abs(no - prev.lon);

      if(dist > 0.00001){

        let raw = bearing(prev.lat, prev.lon, nl, no);

        let diff = raw - ang;

        if(diff > 180) diff -= 360;
        if(diff < -180) diff += 360;

        ang += diff * 0.2;

        headingState[id] = ang;
      }
    }

    last[id] = {lat: nl, lon: no};

    c.lat = nl;
    c.lon = no;

    if(markers[id]){
      markers[id].setLatLng([nl, no]);
      markers[id].setIcon(icon(ang, names[id] || ""));
    }

    if(navigationMode && id === followedId){
      followCar(nl, no, ang);
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   LIST
========================= */
function render(d){

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className = "device";

  div.innerHTML = `
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick = ()=>{
    followedId = d.deviceId;
    navigationMode = true;
    showInfo(d);
    map.setView([d.lat, d.lon], 17);
  };

  el.appendChild(div);
}

/* =========================
   LOAD
========================= */
async function load(){
  try{
    const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
    const data = await res.json();

    data.forEach(update);
    render(data);
  }catch(e){
    console.log("LOAD ERROR", e);
  }
}

load();

/* =========================
   WS SAFE
========================= */
let ws;

function connectWS(){

  ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onopen = ()=>console.log("WS CONNECTED ✅");

  ws.onmessage = (m)=>{
    try{
      const d = JSON.parse(m.data);
      update(d);
    }catch(e){
      console.log("WS PARSE ERROR", e);
    }
  };

  ws.onerror = (e)=>console.log("WS ERROR", e);

  ws.onclose = ()=>{
    console.log("WS CLOSED → reconnect");
    setTimeout(connectWS, 2000);
  };
}

connectWS();

</script>

</body>
</html>
