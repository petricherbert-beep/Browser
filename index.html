<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.15),
    0 0 60px rgba(0,255,200,0.08);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  filter:contrast(1) brightness(0.75) saturate(0.95);
  box-shadow:
    0 0 15px rgba(0,255,200,0.25),
    0 0 50px rgba(0,255,200,0.35),
    0 0 100px rgba(0,255,200,0.25),
    0 0 150px rgba(0,255,200,0.15),
    inset 0 0 90px rgba(0,0,0,0.35);
}

/* ALARM MODE */
#map.alarm{
  animation: alarmFlash 0.6s infinite;
  box-shadow:
    0 0 10px rgba(255,0,0,0.5),
    0 0 40px rgba(255,0,0,0.4),
    0 0 120px rgba(255,0,0,0.3),
    inset 0 0 120px rgba(255,0,0,0.25);
}

@keyframes alarmFlash{
  0%,100%{filter:brightness(0.8) saturate(1.2);}
  50%{filter:brightness(1.4) saturate(1.8);}
}

.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

.info{
  font-size:12px;
  line-height:1.4;
  opacity:0.9;
}

button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
}

.active-follow{color:#3aa0ff;}
.active-track{color:#00ffb3;}
.active-watch{color:#ffd84d;}
.active-alarm{color:#ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const anim = {};
const crashState = {};
const replayState = {};

let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* ICON */
function icon(name){
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
        <div style="font-size:26px;color:#00ffb3;text-shadow:-1px -1px 0 #000,1px -1px 0 #000;">▲</div>
        <div style="position:absolute;font-size:11px;color:#fff;font-weight:800;text-shadow:0 0 4px #000;">${letter}</div>
      </div>
    `
  });
}

/* TRACK */
function addTrack(id,lat,lon){
  if(!tracks[id]) tracks[id]={points:[],layers:[],locked:false};

  const t=tracks[id];
  if(t.locked) return;

  t.points.push({lat,lon,time:Date.now()});

  const op=Math.max(0.15,t.points.length/30);

  const dot=L.circleMarker([lat,lon],{
    radius:3,
    color:"#00ffb3",
    fillOpacity:op
  }).addTo(map);

  t.layers.push(dot);

  const prev=t.points.at(-2);
  if(prev){
    const line=L.polyline([[prev.lat,prev.lon],[lat,lon]],{
      color:"#00ffb3",
      weight:3,
      opacity:op,
      dashArray:"6,10"
    }).addTo(map);

    t.layers.push(line);
  }

  if(t.points.length>30){
    t.points.shift();
    const a=t.layers.shift();
    const b=t.layers.shift();
    if(a)map.removeLayer(a);
    if(b)map.removeLayer(b);
  }
}

/* LAST RED */
function markLastRed(id){
  const t=tracks[id];
  if(!t || !t.points.length) return;

  const p=t.points.at(-1);

  L.circleMarker([p.lat,p.lon],{
    radius:7,
    color:"#ff0000",
    fillColor:"#ff0000",
    fillOpacity:1
  }).addTo(map);
}

/* STOP REPLAY */
function stopReplay(id){
  if(replayState[id]){
    map.removeLayer(replayState[id]);
    delete replayState[id];
  }
}

/* REPLAY */
function startReplay(id,speed=700){
  const t=tracks[id];
  if(!t || !t.points.length) return;
  if(replayState[id]) return;

  let i=0;

  const m=L.circleMarker([t.points[0].lat,t.points[0].lon],{
    radius:6,
    color:"#fff",
    fillColor:"#fff",
    fillOpacity:1
  }).addTo(map);

  replayState[id]=m;

  function step(){
    if(i>=t.points.length){
      map.removeLayer(m);
      delete replayState[id];
      return;
    }

    const p=t.points[i];
    m.setLatLng([p.lat,p.lon]);
    i++;
    setTimeout(step,speed);
  }

  step();
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(isNaN(lat)||isNaN(lon)) return;

  devices[id]={
    ...devices[id],
    ...d,
    lastUpdate:Date.now()
  };

  if(!ui[id]){
    ui[id]={follow:false,track:false,watch:false,alarm:false};
  }

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name)}).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  /* ACCIDENT */
  if(d.lastEvent==="Accident"){
    if(!crashState[id]){
      crashState[id]={active:true};

      if(tracks[id]) tracks[id].locked=true;

      markLastRed(id);

      ui[id].alarm=true;

      map.flyTo([lat,lon],17);
      document.getElementById("map").classList.add("alarm");

      startReplay(id,700);
    }
  }

  if(ui[id].track) addTrack(id,lat,lon);

  if(followId===id) map.panTo([lat,lon]);

  render();
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b>

        <div class="info">
          📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
          🔋 ${d.battery??"-"}%<br>
          🚶 ${d.isMotion?"MOVING":"STILL"}<br>
          📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
          🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
          👀 WATCH: ${d.isWatched?"YES":"NO"}<br>
          📡 STATUS: ${d.status??"unknown"}<br>
          ⏱ ${new Date(d.lastUpdate).toLocaleTimeString()}<br>
          🚨 ${d.lastEvent??"none"}
        </div>

        <hr>

        <button onclick="uiToggle('${id}','follow')">FOLLOW</button>
        <button onclick="uiToggle('${id}','track')">TRACK</button>
        <button onclick="toggleWatch('${id}')">WATCH</button>
        <button onclick="startReplay('${id}',700)">REPLAY</button>
        <button onclick="stopReplay('${id}')">STOP</button>
      </div>
    `;
  });
}

/* TOGGLES */
function uiToggle(id,k){
  ui[id][k]=!ui[id][k];
  if(k==="follow") followId=ui[id].follow?id:null;
  render();
}

function toggleWatch(id){
  const s=!ui[id].watch;
  ui[id].watch=s;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${s?"watch":"unwatch"}`,{method:"POST"});
  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  document.fullscreenElement?
    document.exitFullscreen():
    document.documentElement.requestFullscreen();
}

/* WS */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=e=>{
  const d=JSON.parse(e.data);
  Array.isArray(d)?d.forEach(update):update(d);
};

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(a=>a.forEach(update));

</script>

</body>
</html>
