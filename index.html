<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<meta name="theme-color" content="#05070b">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* BACKGROUND */
.app-frame{
  position:fixed;
  inset:0;
  background:#070a0f;
}

/* PANEL */
#panel{
  width:390px;
  margin:1.5cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  backdrop-filter:blur(14px);
  border-radius:18px;
  padding:14px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:0 0 25px rgba(0,255,200,0.10);
  z-index:9999;
}

/* MAP */
#map{
  flex:1;
  margin:1.5cm 1.5cm 1.5cm 0;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,255,200,0.12);
}

/* DEVICE */
.device{
  margin-top:10px;
  padding:12px;
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  border:1px solid rgba(0,255,200,0.08);
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:rgba(0,0,0,0.3);
  color:white;
  cursor:pointer;
}

/* GENERIC ACTIVE GLOW */
.active-follow,
.active-track,
.active-watch,
.active-alarm{
  box-shadow:
    0 0 10px currentColor,
    0 0 20px currentColor,
    0 0 40px currentColor;
}

/* COLORS */
.active-follow{ color:#3aa0ff; border-color:#3aa0ff; }
.active-track{ color:#00ffb3; border-color:#00ffb3; }
.active-watch{ color:#ffd84d; border-color:#ffd84d; }

/* ALARM BLINK */
.active-alarm{
  color:#ff3b3b;
  border-color:#ff3b3b;
  animation:alarmBlink 1s infinite;
}

@keyframes alarmBlink{
  0%{ box-shadow:0 0 8px red; }
  50%{ box-shadow:0 0 30px red; }
  100%{ box-shadow:0 0 8px red; }
}

/* CHIPS */
.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
}

.online{color:#00ff7b;border:1px solid #00ff7b55;}
.offline{color:#ff3b3b;border:1px solid #ff3b3b55;}
.alarmChip{color:#ff3b3b;border:1px solid #ff3b3b55;}

/* MARKER ALARM PULSE */
.marker-alarm{
  animation:markerPulse 1.2s infinite;
  filter:drop-shadow(0 0 10px red);
}

@keyframes markerPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.4); }
  100%{ transform:scale(1); }
}
</style>

</head>

<body>

<div class="app-frame"></div>

<div id="panel">
  <b>🚗 GPS Control Center</b><br>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const devices={}, markers={}, tracks={};
const followState={}, trackState={}, watchState={}, alarmState={};

const map=L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* COLOR */
function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON */
function icon(d){
  const col=color(d.name);
  const letter=(d.name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div class="${alarmState[d.deviceId] ? "marker-alarm":""}" style="
        font-size:26px;
        color:${col};
        text-shadow:0 0 10px ${col};
      ">▲</div>
      <div style="position:absolute;font-size:10px;color:white;">${letter}</div>
    `
  });
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(!lat||!lon) return;

  devices[id]=d;

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d)}).addTo(map);

    tracks[id]=L.polyline([],{
      color:color(d.name),
      weight:3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d));

  tracks[id].addLatLng([lat,lon]);

  if(followState[id]) map.panTo([lat,lon]);

  render();
}

/* TOGGLES */
function toggleFollow(id){
  followState[id]=!followState[id];
}

function toggleTrack(id){
  trackState[id]=!trackState[id];
  if(tracks[id]){
    trackState[id]?map.addLayer(tracks[id]):map.removeLayer(tracks[id]);
  }
}

function toggleWatch(id){
  watchState[id]=!watchState[id];
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${watchState[id]?'watch':'unwatch'}`,{
    method:"POST"
  });
}

function toggleAlarm(id){
  alarmState[id]=!alarmState[id];
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${alarmState[id]}`,{
    method:"POST"
  });
}

/* RENDER */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(devices).forEach(d=>{
    const id=d.deviceId;

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b>

        <span class="chip ${d.status==='online'?'online':'offline'}">
          ${d.status}
        </span>

        ${d.alarmActive?`<span class="chip alarmChip">ALARM</span>`:""}

        <br><br>

        📍 ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}<br>
        🚶 ${d.isMotion?"MOVING":"STILL"}<br>
        🔋 ${d.battery??"-"}%<br>

        <hr>

        <button class="${followState[id]?'active-follow':''}"
          onclick="toggleFollow('${id}')">FOLLOW</button>

        <button class="${trackState[id]?'active-track':''}"
          onclick="toggleTrack('${id}')">TRACK</button>

        <button class="${watchState[id]?'active-watch':''}"
          onclick="toggleWatch('${id}')">WATCH</button>

        <button class="${alarmState[id]?'active-alarm':''}"
          onclick="toggleAlarm('${id}')">ALARM</button>
      </div>
    `;
  });
}

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(data=>data.forEach(update));

/* WS */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=m=>{
  const d=JSON.parse(m.data);
  Array.isArray(d)?d.forEach(update):update(d);
};
</script>

</body>
</html>
