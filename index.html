<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.15),
    0 0 60px rgba(0,255,200,0.08);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  filter:contrast(1) brightness(0.75) saturate(0.95);
  box-shadow:
    0 0 15px rgba(0,255,200,0.25),
    0 0 50px rgba(0,255,200,0.35),
    0 0 100px rgba(0,255,200,0.25),
    0 0 150px rgba(0,255,200,0.15),
    inset 0 0 90px rgba(0,0,0,0.35);
  animation: glowPulse 15s ease-in-out infinite;
}

/* ALARM MAP MODE */
#map.alarm{
  animation: alarmFlash 0.6s infinite;
  box-shadow:
    0 0 10px rgba(255,0,0,0.5),
    0 0 40px rgba(255,0,0,0.4),
    0 0 120px rgba(255,0,0,0.3),
    inset 0 0 120px rgba(255,0,0,0.25);
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:
      0 0 15px rgba(0,255,200,0.25),
      0 0 50px rgba(0,255,200,0.35),
      0 0 100px rgba(0,255,200,0.25);
  }
  50%{
    box-shadow:
      0 0 25px rgba(0,255,200,0.4),
      0 0 80px rgba(0,255,200,0.5),
      0 0 120px rgba(0,255,200,0.3);
  }
}

@keyframes alarmFlash{
  0%,100%{filter:brightness(0.8) saturate(1.2);}
  50%{filter:brightness(1.4) saturate(1.8);}
}

/* DEVICE */
.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

.info{
  font-size:12px;
  line-height:1.4;
  opacity:0.9;
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
}

/* ACTIVE STATES */
.active-follow{color:#3aa0ff; box-shadow:0 0 10px #3aa0ff;}
.active-track{color:#00ffb3; box-shadow:0 0 10px #00ffb3;}
.active-watch{color:#ffd84d; box-shadow:0 0 10px #ffd84d;}
.active-alarm{color:#ff4d4d; box-shadow:0 0 10px #ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const anim = {};
const crashState = {};
const replayState = {};

let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* COLOR */
function color(n){
  n=(n||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* BEARING */
function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180;
  const toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
          Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ICON */
function icon(name,rot=0){
  const c=color(name);
  const l=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;position:relative;">
        <div style="font-size:26px;color:${c};transform:rotate(${rot}deg);
          text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">
          ▲
        </div>
        <div style="position:absolute;font-size:11px;font-weight:800;color:#fff;
          text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">
          ${l}
        </div>
      </div>
    `
  });
}

/* TRACK */
function addTrack(id,lat,lon){
  if(!tracks[id]) tracks[id]={points:[],layers:[],locked:false};

  const t=tracks[id];
  if(t.locked) return;

  const now=Date.now();
  t.points.push({lat,lon,time:now});

  const op=Math.max(0.15,t.points.length/30);

  const dot=L.circleMarker([lat,lon],{
    radius:3,
    color:color(devices[id].name),
    fillOpacity:op
  }).addTo(map);

  t.layers.push(dot);

  const prev=t.points.at(-2);
  if(prev){
    const line=L.polyline([[prev.lat,prev.lon],[lat,lon]],{
      color:color(devices[id].name),
      weight:3,
      opacity:op,
      dashArray:"6,10"
    }).addTo(map);

    t.layers.push(line);
  }

  if(t.points.length>30){
    t.points.shift();
    const a=t.layers.shift();
    const b=t.layers.shift();
    if(a)map.removeLayer(a);
    if(b)map.removeLayer(b);
  }
}

/* LAST RED */
function markLastRed(id){
  const t=tracks[id];
  if(!t || !t.points.length) return;

  const p=t.points.at(-1);

  L.circleMarker([p.lat,p.lon],{
    radius:7,
    color:"#ff0000",
    fillColor:"#ff0000",
    fillOpacity:1
  }).addTo(map);
}

/* REPLAY */
function startReplay(id,speed=700){
  const t=tracks[id];
  if(!t || !t.points.length) return;

  if(replayState[id]) return;

  let i=0;

  const m=L.circleMarker([t.points[0].lat,t.points[0].lon],{
    radius:6,
    color:"#fff",
    fillColor:"#fff",
    fillOpacity:1
  }).addTo(map);

  replayState[id]=m;

  function step(){
    if(i>=t.points.length){
      map.removeLayer(m);
      delete replayState[id];
      return;
    }

    const p=t.points[i];
    m.setLatLng([p.lat,p.lon]);
    i++;
    setTimeout(step,speed);
  }

  step();
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(isNaN(lat)||isNaN(lon)) return;

  const prev=devices[id];
  devices[id]={...devices[id],...d};

  if(!ui[id]){
    ui[id]={follow:false,track:false,watch:false,alarm:false};
  }

  let rot=0;
  if(prev) rot=bearing(prev.lat,prev.lon,lat,lon);

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name,rot)}).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,rot));

  /* ACCIDENT */
  if(d.lastEvent==="Accident"){
    if(!crashState[id]){
      crashState[id]={active:true};

      if(tracks[id]) tracks[id].locked=true;

      markLastRed(id);

      ui[id].alarm=true;

      map.flyTo([lat,lon],17);
      document.getElementById("map").classList.add("alarm");

      startReplay(id,700);
    }
  }

  if(ui[id].track) addTrack(id,lat,lon);

  smooth(id,lat,lon);

  if(followId===id) map.panTo([lat,lon]);

  render();
}

/* SMOOTH */
function smooth(id,lat,lon){
  const m=markers[id];
  if(!m) return;

  if(anim[id]) cancelAnimationFrame(anim[id]);

  const s=m.getLatLng();
  const t0=performance.now();

  function step(t){
    const p=Math.min((t-t0)/250,1);
    m.setLatLng([
      s.lat+(lat-s.lat)*p,
      s.lng+(lon-s.lng)*p
    ]);
    if(p<1) anim[id]=requestAnimationFrame(step);
  }

  anim[id]=requestAnimationFrame(step);
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b>

        <div class="info">
          📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
          ⚡ ${d.speed||0} km/h<br>
          🔋 ${d.battery||"-"}%<br>
          🚶 ${d.isMotion?"MOVING":"STILL"}<br>
          🚨 ${d.lastEvent||""}
        </div>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="toggle('follow','${id}')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="toggle('track','${id}')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="toggleWatch('${id}')">WATCH</button>
        <button class="${u.alarm?'active-alarm':''}" onclick="toggleAlarm('${id}')">ALARM</button>
        <button onclick="startReplay('${id}',700)">REPLAY</button>
      </div>
    `;
  });
}

/* TOGGLES */
function toggle(k,id){
  ui[id][k]=!ui[id][k];
  if(k==="follow") followId=ui[id].follow?id:null;
  render();
}

function toggleWatch(id){
  const s=!ui[id].watch;
  ui[id].watch=s;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${s?"watch":"unwatch"}`,{method:"POST"});
  render();
}

function toggleAlarm(id){
  const s=!ui[id].alarm;
  ui[id].alarm=s;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${s}`,{method:"POST"});
  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  document.fullscreenElement ?
    document.exitFullscreen() :
    document.documentElement.requestFullscreen();
}

/* WS */
let ws;
function connect(){
  ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    Array.isArray(d)?d.forEach(update):update(d);
  };
  ws.onclose=()=>setTimeout(connect,2000);
}
connect();

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(a=>a.forEach(update));

</script>

</body>
</html>
