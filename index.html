<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS TESLA TRACKING SYSTEM</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 340px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 12px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

button {
  margin: 3px;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.alarm { background:#ff3b30; color:white; }
.stop { background:#34c759; color:white; }
.follow { background:#0a84ff; color:white; }

/* TESLA GLOW */
.leaflet-interactive {
  filter:
    drop-shadow(0 0 6px rgba(58,160,255,0.35))
    drop-shadow(0 0 12px rgba(58,160,255,0.15));
}

/* ALARM */
@keyframes pulse {
  0% { transform:scale(1); opacity:0.9; }
  100% { transform:scale(2.5); opacity:0; }
}
.alarm-ring {
  position:absolute;
  width:70px;
  height:70px;
  border:3px solid red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:pulse 1s infinite;
  box-shadow:0 0 20px red;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 TESLA GPS DISPATCH</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const trails = {};
const trailLines = {};
const last = {};
const angles = {};
const alarmState = {};
const list = [];

let followTargets = new Set();
let followMode = false;

/* ================= AUDIO ================= */
const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;
let audioReady = false;

document.addEventListener("click",()=>{
  if(!audioReady){
    alarmAudio.play().then(()=>{ alarmAudio.pause(); audioReady=true; });
  }
});

/* ================= HELPERS ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function speak(t){
  const m=new SpeechSynthesisUtterance(t);
  m.lang="de-DE";
  speechSynthesis.cancel();
  speechSynthesis.speak(m);
}

function formatTime(ts){
  if(!ts) return "?";
  const d=Date.now()-ts;
  const s=Math.floor(d/1000);
  if(s<60) return s+"s ago";
  const m=Math.floor(s/60);
  if(m<60) return m+"m ago";
  return Math.floor(m/60)+"h ago";
}

/* ================= TESLA COLORS ================= */
function getColor(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

/* ================= SPLINE (TESLA STYLE) ================= */
function spline(points){
  if(points.length<3) return points;

  const out=[];
  for(let i=0;i<points.length-2;i++){
    const p0=points[i];
    const p1=points[i+1];
    const p2=points[i+2];

    for(let t=0;t<=1;t+=0.25){
      const lat=0.5*((2*p1[0])+(-p0[0]+p2[0])*t);
      const lon=0.5*((2*p1[1])+(-p0[1]+p2[1])*t);
      out.push([lat,lon]);
    }
  }
  return out;
}

/* ================= ICON ================= */
function icon(name, angle, alarm, accuracy){

  const n=(name||"").toLowerCase();
  const color=getColor(name);

  let letter="?";
  if(n.includes("oliver")) letter="O";
  else if(n.includes("nicole")) letter="N";
  else letter=(name?.[0]||"?").toUpperCase();

  const acc=accuracy?Math.max(20,Math.min(accuracy,120)):60;

  return L.divIcon({
    className:"",
    html:`
      <div style="position:relative;width:70px;height:70px;">

        ${alarm?'<div class="alarm-ring"></div>':''}

        <div style="
          position:absolute;
          width:${acc}px;
          height:${acc}px;
          border:2px solid rgba(255,255,255,0.2);
          border-radius:50%;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%);
        "></div>

        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(${angle}deg);
          font-size:38px;
          color:${color};
        ">➤</div>

        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%);
          width:18px;
          height:18px;
          border-radius:50%;
          background:rgba(0,0,0,0.6);
          display:flex;
          align-items:center;
          justify-content:center;
          color:white;
          font-size:12px;
          font-weight:700;
        ">
          ${letter}
        </div>

      </div>
    `,
    iconSize:[70,70],
    iconAnchor:[35,35]
  });
}

/* ================= UPDATE ================= */
function update(d){

  if(!d?.deviceId) return;

  const id=d.deviceId;
  const lat=n(d.lat);
  const lon=n(d.lon);
  if(lat===null||lon===null) return;

  const prev=last[id];

  let angle=0;
  if(prev) angle=bearing(prev.lat,prev.lon,lat,lon);

  const smoothed=(angles[id]??angle)+(angle-(angles[id]??angle))*0.25;
  angles[id]=smoothed;

  last[id]={lat,lon};

  if(!trails[id]) trails[id]=[];
  trails[id].push([lat,lon]);
  if(trails[id].length>100) trails[id].shift();

  if(!trailLines[id]){
    trailLines[id]=L.polyline([],{
      color:getColor(d.name),
      weight:6,
      opacity:0.15
    }).addTo(map);
  }

  const smooth=spline(trails[id]);
  trailLines[id].setLatLngs(smooth);

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name,smoothed,d.alarmActive,d.accuracy)
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,smoothed,d.alarmActive,d.accuracy));

  const ex=list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  /* ALARM */
  if(d.alarmActive && !alarmState[id]){
    alarmState[id]=true;
    if(audioReady) alarmAudio.play();
    speak("Alarm bei "+d.name);
    map.flyTo([lat,lon],18);
  }

  if(!d.alarmActive && alarmState[id]){
    alarmState[id]=false;
    alarmAudio.pause();
  }

  /* FOLLOW */
  if(followTargets.has(id)){
    map.panTo([lat,lon]);
  }

  if(followMode){
    const pts=[...followTargets].map(i=>markers[i]?.getLatLng()).filter(Boolean);
    if(pts.length===1) map.panTo(pts[0]);
    if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{padding:[60,60]});
  }

  render();
}

/* ================= RENDER ================= */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      🚗 ${d.speed ?? 0} km/h<br>
      📡 ${d.status ?? "?"}<br>
      📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
      📡 ${d.accuracy ?? "?"} m<br>
      🔋 ${d.battery ?? "?"}%<br>
      ⏱ ${formatTime(d.timestamp)}<br><br>

      <button class="alarm" onclick="alarm('${d.deviceId}')">Alarm</button>
      <button class="stop" onclick="stop('${d.deviceId}')">Stop</button>
      <button class="follow" onclick="toggleFollow('${d.deviceId}')">Follow</button>
    `;

    el.appendChild(div);
  });
}

/* ================= ACTIONS ================= */
function alarm(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=true",{method:"POST"});
}

function stop(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=false",{method:"POST"});
}

function toggleFollow(id){
  if(followTargets.has(id)) followTargets.delete(id);
  else followTargets.add(id);
  followMode=followTargets.size>0;
}

/* ================= LOAD ================= */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d=await r.json();
  d.forEach(update);
}
load();

/* ================= WS ================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=(m)=>{try{update(JSON.parse(m.data));}catch(e){}};

</script>
</body>
</html>
