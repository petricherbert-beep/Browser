<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Realtime 2</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel{
  position:absolute;
  top:10px; left:10px;
  width:360px;
  max-height:90vh;
  overflow:auto;
  background:rgba(20,20,20,0.9);
  color:white;
  padding:10px;
  border-radius:12px;
  z-index:9999;
}

.device{
  border-bottom:1px solid #333;
  padding:10px 0;
}

button{
  margin:2px;
  padding:5px 7px;
  font-size:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.watch{background:#ffcc00;}
.follow{background:#0a84ff;color:white;}
.alarm{background:#ff3b30;color:white;}

@keyframes pulseWatch {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(2.2); opacity: 0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Realtime Pro</b>
  <button onclick="toggleNav()">Nav</button>
  <button onclick="toggleAlarm()">🔊 Alarm</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */

const devices = {};
const markers = {};
const tracks = {};
const lastPos = {};
const heading = {};

let followId = null;
let navMode = false;
let lastPan = 0;

let alarmEnabled = true;

const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;
let activeAlarmDevice = null;

/* ================= MAP (NORMAL MODE) ================= */

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= HELPERS ================= */

function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

function bearing(lat1, lon1, lat2, lon2){
  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const φ1 = toRad(lat1);
  const φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);

  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x =
    Math.cos(φ1) * Math.sin(φ2) -
    Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* ================= ICON ================= */

function icon(name, angle, isWatched){

  const col = color(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[60,60],
    iconAnchor:[30,30],

    html:`
      <div style="position:relative;width:60px;height:60px;
        display:flex;align-items:center;justify-content:center;">

        <div style="
          position:absolute;
          font-size:30px;
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:28px;
          color:${col};
          transform: rotate(${angle||0}deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:11px;
          font-weight:800;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* ================= UPDATE ================= */

function update(d){

  const id = d.deviceId;
  const lat = Number(d.lat);
  const lon = Number(d.lon);
  if(!lat || !lon) return;

  const prev = lastPos[id];
  let angle = heading[id] || 0;

  if(prev && (d.speed ?? 0) > 0.5){
    const moved =
      Math.abs(lat-prev.lat) > 0.00001 ||
      Math.abs(lon-prev.lon) > 0.00001;

    if(moved){
      angle = bearing(prev.lat, prev.lon, lat, lon);
      heading[id] = angle;
    }
  }

  lastPos[id] = {lat,lon};
  devices[id] = d;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angle, d.isWatched)
    }).addTo(map);

    tracks[id] = L.polyline([], {
      color: color(d.name),
      weight: 4,
      opacity: 0.8
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name, angle, d.isWatched));

  tracks[id].addLatLng([lat,lon]);

  const MAX_POINTS = 500;
  if (tracks[id].getLatLngs().length > MAX_POINTS) {
    tracks[id].setLatLngs(tracks[id].getLatLngs().slice(-MAX_POINTS));
  }

  if(followId === id){
    if(navMode){
      navigationCamera(lat, lon);
    } else {
      map.panTo([lat,lon], {animate:true});
    }
  }

  render();
}

/* ================= CAMERA ================= */

function navigationCamera(lat, lon){

  const zoom = 17;
  const point = map.project([lat, lon], zoom);
  point.y -= 150;

  map.setView(map.unproject(point, zoom), zoom, {
    animate:true
  });
}

/* ================= UI ================= */

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d => {

    const speed = (d.speed ?? 0) * 3.6;

    el.innerHTML += `
      <div class="device">
        <b>${d.name}</b><br>
        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🚨 ${d.alarmActive ? "ALARM" : "OK"}<br>

        <button onclick="follow('${d.deviceId}')">Follow</button>
      </div>
    `;
  });
}

/* ================= ACTIONS ================= */

function follow(id){
  followId = id;
}

function toggleNav(){
  navMode = !navMode;
}

function toggleAlarm(){
  alarmEnabled = !alarmEnabled;
}

/* ================= WS ================= */

function connectWS(){

  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if(Array.isArray(data)) data.forEach(update);
    else update(data);
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
}

connectWS();

</script>

</body>
</html>
