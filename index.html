<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<meta name="theme-color" content="#05070b">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.app-frame{
  position:fixed;
  inset:0;
  background:#070a0f;
  z-index:0;
}

/* PANEL (ORIGINAL BEHALTEN + GLOW BALANCED) */
#panel{
  width:390px;
  margin:1.5cm 0 1.5cm 1.5cm;
  overflow:auto;

  background:rgba(10,15,25,0.55);
  backdrop-filter:blur(16px);
  border-radius:18px;
  padding:14px;

  border:1px solid rgba(0,255,200,0.15);

  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 25px rgba(0,255,200,0.12),
    0 0 60px rgba(0,255,200,0.06);

  z-index:9999;
}

/* MAP (KORRIGIERT + MODERATER GLOW) */
#map{
  flex:1;
  margin:1.5cm 1.5cm 1.5cm 1cm;

  border-radius:20px;
  overflow:hidden;

  position:relative;
  z-index:1;

  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 0 30px rgba(0,255,200,0.15),
    0 0 70px rgba(0,255,200,0.10),
    0 0 140px rgba(0,255,200,0.06);

  transition:box-shadow 0.3s ease;
}

/* MAP ACTIVE PULSE */
.map-active{
  animation:mapPulse 2.5s ease-in-out infinite;
}

@keyframes mapPulse{
  0%{
    box-shadow:
      0 0 30px rgba(0,255,200,0.15),
      0 0 70px rgba(0,255,200,0.10);
  }
  50%{
    box-shadow:
      0 0 55px rgba(0,255,200,0.25),
      0 0 120px rgba(0,255,200,0.16);
  }
  100%{
    box-shadow:
      0 0 30px rgba(0,255,200,0.15),
      0 0 70px rgba(0,255,200,0.10);
  }
}

/* DEVICE */
.device{
  margin-top:10px;
  padding:12px;
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  border:1px solid rgba(0,255,200,0.08);
}

.device:hover{
  border-color:rgba(0,255,200,0.25);
  box-shadow:0 0 20px rgba(0,255,200,0.08);
}

.device b{color:#e6edf3;}

/* BUTTONS */
button{
  margin:3px 2px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:rgba(10,20,30,0.6);
  color:#c9d1d9;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
  border-color:rgba(0,255,200,0.6);
}

/* WATCH TOGGLE */
.active-watch{
  color:#ffd84d;
  border-color:#ffd84d;
  box-shadow:0 0 15px #ffd84d;
}

/* ALARM BUTTON PULSE */
.active-alarm{
  color:#ff4d4d;
  border-color:#ff4d4d;
  animation:alarmPulse 1.5s infinite;
}

@keyframes alarmPulse{
  0%{ box-shadow:0 0 8px #ff4d4d; }
  50%{ box-shadow:0 0 22px #ff4d4d; }
  100%{ box-shadow:0 0 8px #ff4d4d; }
}

/* MARKER ALARM PULSE */
.marker-alarm{
  animation:markerPulse 1.2s infinite;
}

@keyframes markerPulse{
  0%{ transform:scale(1); filter:drop-shadow(0 0 5px red); }
  50%{ transform:scale(1.35); filter:drop-shadow(0 0 15px red); }
  100%{ transform:scale(1); filter:drop-shadow(0 0 5px red); }
}

/* CHIPS (ORIGINAL BEHALTEN) */
.chip{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  margin-left:6px;
  border:1px solid rgba(255,255,255,0.1);
}

.online{color:#00ff7b;border-color:#00ff7b55;}
.offline{color:#ff3b3b;border-color:#ff3b3b55;}
.alarmChip{color:#ff3b3b;border-color:#ff3b3b55;}
</style>

</head>

<body>

<div class="app-frame"></div>

<div id="panel">
  <b>🚗 GPS Control Center</b><br>
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE (ORIGINAL + WATCH FIX) */
const devices={}, markers={}, tracks={};
const trackState={}, followState={}, watchState={};

let followId=null;

/* COLOR LOGIC (ORIGINAL BEHALTEN!) */
function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* MAP */
const map=L.map("map").setView([47.09,15.42],13);

/* ORIGINAL STYLE BACK */
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* ICON (FIX: COLOR BLEIBT + ALARM PULSE) */
function icon(d){
  const col=color(d.name);
  const letter=(d.name?.[0]||"?").toUpperCase();

  const alarmClass = d.alarmActive ? "marker-alarm" : "";

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div class="${alarmClass}" style="
        font-size:26px;
        color:${col};
        text-shadow:0 0 10px ${col};
      ">▲</div>
      <div style="
        position:absolute;
        font-size:10px;
        color:white;
        font-weight:700;
      ">${letter}</div>
    `
  });
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(!lat||!lon) return;

  devices[id]=d;
  watchState[id]=d.isWatched;

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d)}).addTo(map);

    tracks[id]=L.polyline([],{
      color:color(d.name),
      weight:3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d));

  if(followState[id]){
    map.panTo([lat,lon]);
  }

  updateMapGlow();
  render();
}

/* MAP GLOW (KONTROLLIERT) */
function updateMapGlow(){
  const anyActive =
    Object.values(followState).some(v=>v) ||
    Object.values(trackState).some(v=>v) ||
    Object.values(watchState).some(v=>v);

  document.getElementById("map").classList.toggle("map-active",anyActive);
}

/* FOLLOW */
function follow(id){
  followState[id]=!followState[id];
  updateMapGlow();
}

/* TRACK */
function toggleTrack(id){
  trackState[id]=!trackState[id];

  if(tracks[id]){
    trackState[id]?map.addLayer(tracks[id]):map.removeLayer(tracks[id]);
  }

  updateMapGlow();
}

/* WATCH TOGGLE (FIX) */
function toggleWatch(id){
  watchState[id]=!watchState[id];

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${watchState[id]?'watch':'unwatch'}`,{
    method:"POST"
  });

  updateMapGlow();
  render();
}

/* ALARM */
function toggleAlarm(id){
  const d=devices[id];
  if(!d) return;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${!d.alarmActive}`,{
    method:"POST"
  });
}

/* CLEAR */
function clearTrack(id){
  if(tracks[id]) tracks[id].setLatLngs([]);
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* RENDER (ORIGINAL + WATCH FIX) */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(devices).forEach(d=>{
    const id=d.deviceId;

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b>

        <span class="chip ${d.status==='online'?'online':'offline'}">
          ${d.status==='online'?'ONLINE':'OFFLINE'}
        </span>

        ${d.alarmActive?`<span class="chip alarmChip">ALARM</span>`:""}

        <br><br>

        📍 ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}<br>
        🚶 ${d.isMotion?"MOVING":"STILL"}<br>

        🔋 ${d.battery??"-"}%<br>
        🎯 ${d.accuracy??"-"} m<br>
        📶 ${d.isWifi?"WIFI":"MOBILE"}<br>
        🔒 ${d.isLocked?"LOCKED":"UNLOCKED"}<br>
        👀 ${watchState[id]?"WATCHED":"NOT WATCHED"}<br>

        <hr>

        <button onclick="follow('${id}')">
          🎯 FOLLOW ${followState[id]?"ON":"OFF"}
        </button>

        <button onclick="toggleTrack('${id}')">
          📍 TRACK ${trackState[id]?"ON":"OFF"}
        </button>

        <button class="${watchState[id]?'active-watch':''}"
          onclick="toggleWatch('${id}')">
          👀 WATCH
        </button>

        <button class="${d.alarmActive?'active-alarm':''}"
          onclick="toggleAlarm('${id}')">
          🚨 ALARM
        </button>

        <button onclick="clearTrack('${id}')">CLEAR</button>
      </div>
    `;
  });
}

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(d=>d.forEach(update));

/* WS */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  const d=JSON.parse(m.data);
  Array.isArray(d)?d.forEach(update):update(d);
};
</script>

</body>
</html>
