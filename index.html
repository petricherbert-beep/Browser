<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:380px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.15);
  box-shadow:0 0 50px rgba(0,255,200,0.25);
  backdrop-filter: blur(12px);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 80px rgba(0,255,200,0.25);
  filter:brightness(0.85) contrast(1.15);
}

/* DEVICE */
.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.15);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  transition:0.2s;
}

.device:hover{
  box-shadow:0 0 20px rgba(0,255,200,0.15);
}

.info{
  font-size:12px;
  opacity:0.9;
  line-height:1.4;
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 0 12px rgba(0,255,200,0.35);
}

/* FULLSCREEN */
.glow-btn{
  margin-bottom:10px;
  width:100%;
  font-weight:700;
  border:1px solid rgba(0,255,200,0.35);
  box-shadow:0 0 12px rgba(0,255,200,0.35);
}

.glow-btn:hover{
  box-shadow:0 0 20px rgba(0,255,200,0.7),
             0 0 50px rgba(0,255,200,0.3);
}

/* ACTIVE STATES */
.active-follow{ color:#3aa0ff; border-color:#3aa0ff; box-shadow:0 0 10px #3aa0ff; }
.active-track{ color:#00ffb3; border-color:#00ffb3; box-shadow:0 0 10px #00ffb3; }
.active-watch{ color:#ffd84d; border-color:#ffd84d; box-shadow:0 0 10px #ffd84d; }
.active-alarm{ color:#ff4d4d; border-color:#ff4d4d; box-shadow:0 0 10px #ff4d4d; }
</style>
</head>

<body>

<div id="panel">
  <button class="glow-btn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const SERVER = "https://gps-server-f9b6.onrender.com";
const API_KEY = "LaLuna170284?";
  
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);
/* SOCKET */
const socket = io(SERVER);
socket.on("location_update", update);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
  
}).addTo(map);
function apiFetch(url, options = {}) {
  return fetch(`${SERVER}${url}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      ...(options.headers || {})
    }
  });
}

/* ICON */
function icon(name){
  const n = (name || "").toLowerCase();

  let color = "#00ffb3";
  let letter = (name?.[0] || "?").toUpperCase();

  if(n.includes("nicole")) { color = "#ff3b3b"; letter="N"; }
  if(n.includes("oliver")) { color = "#3aa0ff"; letter="O"; }

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
    <div style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;font-size:34px;color:${color};text-shadow:0 0 10px ${color};">▲</div>
      <div style="position:absolute;font-size:13px;font-weight:900;color:white;text-shadow:0 0 5px #000;">${letter}</div>
    </div>`
  });
}

/* UPDATE */
function update(d){
  const id = d.deviceId;
  if(!id || !d.lat || !d.lon) return;

  devices[id] = {...devices[id], ...d};
  ui[id] = ui[id] || {follow:false, track:false, watch:false};

  if(!markers[id]){
    markers[id] = L.marker([d.lat,d.lon],{icon:icon(d.name)}).addTo(map);
  } else {
    markers[id].setLatLng([d.lat,d.lon]);
  }

  if(ui[id].track){
    if(!tracks[id]){
      tracks[id] = L.polyline([],{
        color:"#00ffb3",
        weight:3,
        opacity:0.7
      }).addTo(map);
    }
    const pts = tracks[id].getLatLngs();
    pts.push([d.lat,d.lon]);
    if(pts.length>200) pts.shift();
    tracks[id].setLatLngs(pts);
  }

  if(followId === id){
    map.panTo([d.lat,d.lon]);
  }

  render();
}

/* UI */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.entries(devices).forEach(([id,d])=>{
    const u = ui[id] || {};
    const online = Date.now() - (d.lastSeen||0) < 30000;

    el.innerHTML += `
    <div class="device">
      <b>${d.name || id}</b><br><br>

      📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>

      <div class="info">
        ⚡ ${d.speed||0} km/h<br>
        🎯 ±${d.accuracy||"-"} m<br>
        🔋 ${d.battery||"-"}%<br>
        🚶 ${d.isMotion?"MOVING":"STILL"}<br>
        📡 ${online?"🟢 ONLINE":"🔴 OFFLINE"}<br>
      </div>

      <hr>

      <button class="${u.follow?'active-follow':''}" onclick="follow('${id}')">FOLLOW</button>
      <button class="${u.track?'active-track':''}" onclick="track('${id}')">TRACK</button>
      <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
      <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
    </div>`;
  });
}

/* ACTIONS */
function follow(id){
  ui[id].follow = !ui[id].follow;
  followId = ui[id].follow ? id : null;
  render();
}

function track(id){
  ui[id].track = !ui[id].track;
  if(!ui[id].track && tracks[id]) tracks[id].setLatLngs([]);
  render();
}

function watch(id){
  ui[id].watch = !ui[id].watch;
  fetch(`${SERVER}/devices/${id}/watch`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ watch: ui[id].watch })
  });
  render();
}

function alarm(id){
  const state = !devices[id].alarmActive;
  devices[id].alarmActive = state;

  fetch(`${SERVER}/devices/${id}/alarm?active=${state}`,{
    method:"POST"
  });

  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* INIT */
fetch(`${SERVER}/devices`)
.then(r=>r.json())
.then(list => list.forEach(update));

</script>

</body>
</html>
