<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ Socket.IO -->

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
}

#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
}
</style>

</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */
const devices = {};
const markers = {};

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* ================= UPDATE ================= */
function update(d){
  console.log("📡 UPDATE:", d);

  const id = d.deviceId;
  const lat = +d.lat;
  const lon = +d.lon;

  if(lat == null || lon == null) return;

  devices[id] = d;

  if(!markers[id]){
    markers[id] = L.marker([lat,lon]).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  render();
}

/* ================= UI ================= */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.values(devices).forEach(d=>{
    el.innerHTML += `
      <div style="margin-bottom:10px">
        <b>${d.name}</b><br>
        📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
        🔋 ${d.battery ?? "-"}%<br>
        🚶 ${d.isMotion ? "MOVING" : "STILL"}<br>
      </div>
    `;
  });
}

/* ================= LOAD ================= */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(data=>{
  console.log("📦 INIT:", data);
  data.forEach(update);
})
.catch(err=>{
  console.error("❌ FETCH ERROR:", err);
});

/* ================= SOCKET.IO ================= */
const socket = io("https://gps-server-f9b6.onrender.com");

socket.on("connect", () => {
  console.log("✅ Socket verbunden");
});

socket.on("location_update", d => {
  update(d);
});

socket.on("disconnect", () => {
  console.log("❌ Socket getrennt");
});

</script>

</body>
</html>
