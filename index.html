<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS PRO DISPATCH MAP</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 340px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 12px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

button {
  margin: 3px;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.alarm { background:#ff3b30; color:white; }
.stop { background:#34c759; color:white; }
.follow { background:#0a84ff; color:white; }

/* ALARM */
@keyframes pulse {
  0% { transform:scale(1); opacity:0.9; }
  100% { transform:scale(2.6); opacity:0; }
}
.alarm-ring {
  position:absolute;
  width:70px;
  height:70px;
  border:3px solid red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:pulse 1s infinite;
  box-shadow:0 0 20px red;
}

/* SHAKE */
@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,1px); }
  50% { transform: translate(-2px,-1px); }
  75% { transform: translate(2px,-2px); }
  100% { transform: translate(0,0); }
}
.shake { animation: shake 0.2s infinite; }

.leaflet-interactive {
  filter: drop-shadow(0 0 6px rgba(10,132,255,0.4));
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS DISPATCH PRO</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const trails = {};
const last = {};
const angles = {};
const alarmState = {};
const list = [];

let followTargets = new Set();
let followMode = false;

/* ================= AUDIO ================= */
const alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;
let audioReady = false;

document.addEventListener("click",()=>{
  if(!audioReady){
    alarmAudio.play().then(()=>{ alarmAudio.pause(); audioReady=true; });
  }
});

/* ================= HELPERS ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function distance(a,b,c,d){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const d1=toRad(c-a),d2=toRad(d-b);
  const x=Math.sin(d1/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(d2/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function speak(t){
  const m=new SpeechSynthesisUtterance(t);
  m.lang="de-DE";
  speechSynthesis.cancel();
  speechSynthesis.speak(m);
}

function formatTime(ts){
  if(!ts) return "?";
  const diff = Date.now() - ts;
  const sec = Math.floor(diff/1000);
  if(sec < 60) return sec+"s ago";
  const min = Math.floor(sec/60);
  if(min < 60) return min+"m ago";
  return Math.floor(min/60)+"h ago";
}

/* ================= ICON ================= */
function icon(name, angle, alarm, accuracy){

  const n = (name || "").toLowerCase();

  const color =
    n.includes("oliver") ? "#0a84ff" :
    n.includes("nicole") ? "#ff3b30" :
    "#2ecc71";

  let letter = "?";
  if(n.includes("oliver")) letter = "O";
  else if(n.includes("nicole")) letter = "N";
  else letter = (name?.[0] || "?").toUpperCase();

  const acc = accuracy ? Math.max(20, Math.min(accuracy, 120)) : 60;

  return L.divIcon({
    className:"",
    html:`
      <div style="position:relative;width:70px;height:70px;">

        ${alarm ? '<div class="alarm-ring"></div>' : ''}

        <!-- ACCURACY RING -->
        <div style="
          position:absolute;
          width:${acc}px;
          height:${acc}px;
          border:2px solid rgba(255,255,255,0.25);
          border-radius:50%;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%);
        "></div>

        <!-- ARROW -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(${angle}deg);
          font-size:40px;
          color:${color};
        ">➤</div>

        <!-- LETTER -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%);
          width:20px;
          height:20px;
          border-radius:50%;
          background:rgba(0,0,0,0.6);
          display:flex;
          align-items:center;
          justify-content:center;
          color:white;
          font-size:12px;
          font-weight:700;
        ">
          ${letter}
        </div>

      </div>
    `,
    iconSize:[70,70],
    iconAnchor:[35,35]
  });
}

/* ================= UPDATE ================= */
function update(d){

  if(!d?.deviceId) return;

  const id=d.deviceId;
  const lat=n(d.lat);
  const lon=n(d.lon);

  if(lat===null||lon===null) return;

  const prev=last[id];

  if(prev){
    const dist=distance(prev.lat,prev.lon,lat,lon);
    if(dist<3) return;
  }

  let newAngle = 0;
  if(prev) newAngle=bearing(prev.lat,prev.lon,lat,lon);

  const smoothed = (angles[id] ?? newAngle) + (newAngle - (angles[id] ?? newAngle)) * 0.25;
  angles[id]=smoothed;

  last[id]={lat,lon};

  if(!trails[id]) trails[id]=[];
  trails[id].push([lat,lon]);
  if(trails[id].length>80) trails[id].shift();

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name,smoothed,d.alarmActive,d.accuracy)
    }).addTo(map);

    markers[id].trail=L.polyline([],{
      color:"#0a84ff",
      weight:3,
      opacity:0.7
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,smoothed,d.alarmActive,d.accuracy));
  markers[id].trail.setLatLngs(trails[id]);

  const ex=list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  /* ALARM */
  if(d.alarmActive && !alarmState[id]){
    alarmState[id]=true;
    if(audioReady) alarmAudio.play();
    speak("Alarm bei "+d.name);
    map.flyTo([lat,lon],18);
    document.getElementById("panel").classList.add("shake");
    setTimeout(()=>document.getElementById("panel").classList.remove("shake"),1200);
  }

  if(!d.alarmActive && alarmState[id]){
    alarmState[id]=false;
    alarmAudio.pause();
  }

  /* FOLLOW */
  if(followTargets.has(id)){
    map.panTo([lat,lon]);
  }

  if(followMode){
    const pts=[...followTargets].map(id=>markers[id]?.getLatLng()).filter(Boolean);
    if(pts.length===1) map.panTo(pts[0]);
    if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{padding:[60,60]});
  }

  render();
}

/* ================= RENDER ================= */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  list.forEach(d=>{

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      📡 ${d.status ?? "?"}<br>
      🚗 ${d.speed ?? 0} km/h<br>
      📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
      📡 ${d.accuracy ?? "?"} m<br>
      🔋 ${d.battery ?? "?"}%<br>
      ⏱ ${formatTime(d.timestamp)}<br><br>

      <button class="alarm" onclick="alarm('${d.deviceId}')">Alarm</button>
      <button class="stop" onclick="stop('${d.deviceId}')">Stop</button>
      <button class="follow" onclick="toggleFollow('${d.deviceId}')">Follow</button>
      <button onclick="watch('${d.deviceId}')">Watch</button>
      <button onclick="unwatch('${d.deviceId}')">Unwatch</button>
    `;

    el.appendChild(div);
  });
}

/* ================= ACTIONS ================= */
function alarm(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=true",{method:"POST"});
}

function stop(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/alarm?active=false",{method:"POST"});
}

function watch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/watch?watcherId=web",{method:"POST"});
}

function unwatch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/unwatch",{method:"POST"});
}

function toggleFollow(id){
  if(followTargets.has(id)) followTargets.delete(id);
  else followTargets.add(id);
  followMode = followTargets.size>0;
}

/* ================= LOAD ================= */
async function load(){
  const r=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d=await r.json();
  d.forEach(update);
}
load();

/* ================= WS ================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage=(m)=>{ try{update(JSON.parse(m.data));}catch(e){} };

</script>
</body>
</html>
