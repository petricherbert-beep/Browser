<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS VECTOR FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 320px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  color: white;
  padding: 12px;
  border-radius: 12px;
}

.device {
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 VECTOR TRACKER</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= MAP ================= */
const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const lastPos = {};
const rendered = new Set();

/* ================= SAFE ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

/* ================= VECTOR HEADING ================= */
function bearing(lat1, lon1, lat2, lon2){

  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);

  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* ================= ICON ================= */
function icon(name, angle){

  const color =
    name?.toLowerCase().includes("nicole") ? "#ff3b30" :
    name?.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const letter = name?.[0]?.toUpperCase() || "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        transform:rotate(${angle}deg);
        font-size:42px;
        color:${color};
        text-shadow:0 0 4px black;
        position:relative;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:13px;
          font-weight:bold;
        ">
          ${letter}
        </div>
      </div>
    `,
    iconSize:[42,42],
    iconAnchor:[21,21]
  });
}

/* ================= UPDATE ================= */
function update(d){

  const id = d.deviceId;

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null) return;

  const prev = lastPos[id];

  let angle = 0;

  if(prev){
    angle = bearing(prev.lat, prev.lon, lat, lon);
  }

  lastPos[id] = {lat, lon};

  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(d.name, angle)
    }).addTo(map);
  } else {
    markers[id].setLatLng([lat, lon]);
    markers[id].setIcon(icon(d.name, angle));
  }

  renderList(d);
}

/* ================= LIST ================= */
function renderList(d){

  if(rendered.has(d.deviceId)) return;
  rendered.add(d.deviceId);

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className = "device";

  div.innerHTML = `<b>${d.name}</b>`;

  div.onclick = () => {
    map.setView([d.lat, d.lon], 17);
  };

  el.appendChild(div);
}

/* ================= LOAD ================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();
  data.forEach(update);
}
load();

/* ================= WS ================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m)=>{
  try {
    update(JSON.parse(m.data));
  } catch(e){}
};

</script>

</body>
</html>
