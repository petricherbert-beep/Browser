<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL GLOW */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 20px rgba(0,255,200,0.15),
    0 0 60px rgba(0,255,200,0.08);
}

/* MAP GLOW */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  filter:contrast(1) brightness(0.75) saturate(0.95);
  box-shadow:
    0 0 15px rgba(0,255,200,0.25),
    0 0 50px rgba(0,255,200,0.35),
    0 0 100px rgba(0,255,200,0.25),
    0 0 150px rgba(0,255,200,0.15),
    inset 0 0 90px rgba(0,0,0,0.35);
  animation: glowPulse 15s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:
      0 0 15px rgba(0,255,200,0.25),
      0 0 50px rgba(0,255,200,0.35),
      0 0 100px rgba(0,255,200,0.25);
  }
  50%{
    box-shadow:
      0 0 20px rgba(0,255,200,0.4),
      0 0 70px rgba(0,255,200,0.5),
      0 0 120px rgba(0,255,200,0.3);
  }
}

.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

.info{
  font-size:12px;
  line-height:1.4;
  opacity:0.9;
  margin-top:6px;
}

button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.15);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
  transition:0.15s;
}

button:hover{
  border-color:rgba(0,255,200,0.5);
}

/* ACTIVE STATES */
.active-follow{color:#3aa0ff; box-shadow:0 0 10px #3aa0ff;}
.active-track{color:#00ffb3; box-shadow:0 0 10px #00ffb3;}
.active-watch{color:#ffd84d; box-shadow:0 0 10px #ffd84d;}
.active-alarm{color:#ff4d4d; box-shadow:0 0 10px #ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* STATE */
const devices={};
const ui={};
const markers={};
const tracks={};
const anim={};
const crashState={};
const replayState={};
let followId=null;

/* MAP */
const map=L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* COLOR */
function color(n){
  n=(n||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* BEARING */
function getBearing(lat1,lon1,lat2,lon2){
  const toRad=x=>x*Math.PI/180;
  const toDeg=x=>x*180/Math.PI;
  const dLon=toRad(lon2-lon1);
  const y=Math.sin(dLon)*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-
          Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* ICON */
function icon(name,rot=0){
  const c=color(name);
  const letter=(name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;position:relative;">
        <div style="
          font-size:26px;
          color:${c};
          transform:rotate(${rot}deg);
          text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        ">▲</div>
        <div style="
          position:absolute;
          font-size:11px;
          font-weight:800;
          color:#fff;
          text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        ">${letter}</div>
      </div>
    `
  });
}

/* TRACK */
function addTrack(id,lat,lon){
  if(!tracks[id])tracks[id]={points:[],segments:[],locked:false};

  const t=tracks[id];
  if(t.locked)return;

  const now=Date.now();
  t.points.push({lat,lon,time:now});

  const idx=t.points.length;
  const opacity=Math.max(0.15,idx/30);

  const p=L.circleMarker([lat,lon],{
    radius:3,
    color:color(devices[id].name),
    fillOpacity:opacity
  }).addTo(map);

  t.segments.push(p);

  const last=t.points.at(-2);
  if(last){
    const line=L.polyline([[last.lat,last.lon],[lat,lon]],{
      color:color(devices[id].name),
      weight:3,
      opacity:opacity,
      dashArray:"6,10"
    }).addTo(map);

    t.segments.push(line);
  }

  if(t.points.length>30){
    t.points.shift();
    const a=t.segments.shift();
    const b=t.segments.shift();
    if(a)map.removeLayer(a);
    if(b)map.removeLayer(b);
  }
}

/* LAST POINT RED */
function markLastRed(id){
  const t=tracks[id];
  if(!t||!t.points.length)return;

  const p=t.points.at(-1);

  L.circleMarker([p.lat,p.lon],{
    radius:6,
    color:"#ff0000",
    fillColor:"#ff0000",
    fillOpacity:1
  }).addTo(map);
}

/* CRASH */
function freezeCrash(id){
  const t=tracks[id];
  if(!t)return;

  t.locked=true;
}

/* UPDATE */
function update(d){
  const id=d.deviceId;
  const lat=+d.lat, lon=+d.lon;
  if(isNaN(lat)||isNaN(lon))return;

  const prev=devices[id];
  devices[id]={...devices[id],...d};

  if(!ui[id]){
    ui[id]={follow:false,track:false,watch:false,alarm:false,replay:false};
  }

  let rot=0;
  if(prev)rot=getBearing(prev.lat,prev.lon,lat,lon);

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name,rot)}).addTo(map);
  }

  markers[id].setIcon(icon(d.name,rot));
  markers[id].setLatLng([lat,lon]);

  if(d.lastEvent==="Accident"){
    freezeCrash(id);
    markLastRed(id);
  }

  if(ui[id].track) addTrack(id,lat,lon);

  smooth(id,lat,lon);

  if(followId===id)map.panTo([lat,lon]);

  render();
}

/* SMOOTH */
function smooth(id,lat,lon){
  const m=markers[id];
  if(!m)return;

  if(anim[id])cancelAnimationFrame(anim[id]);

  const s=m.getLatLng();
  const t0=performance.now();

  function step(t){
    const p=Math.min((t-t0)/250,1);
    m.setLatLng([
      s.lat+(lat-s.lat)*p,
      s.lng+(lon-s.lng)*p
    ]);
    if(p<1)anim[id]=requestAnimationFrame(step);
  }

  anim[id]=requestAnimationFrame(step);
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div class="device">
        <b>${d.name}</b><br><br>

        <div class="info">
          📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
          ⚡ ${d.speed||0} km/h<br>
          🔋 ${d.battery||"-"}%<br>
          🚶 ${d.isMotion?"MOVING":"STILL"}<br>
          🚨 ${d.lastEvent==="Accident"?"ACCIDENT":""}
        </div>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="toggle('follow','${id}')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="toggle('track','${id}')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="toggleWatch('${id}')">WATCH</button>
        <button class="${u.alarm?'active-alarm':''}" onclick="toggleAlarm('${id}')">ALARM</button>
      </div>
    `;
  });
}

/* TOGGLES */
function toggle(k,id){
  ui[id][k]=!ui[id][k];
  if(k==="follow")followId=ui[id].follow?id:null;
  render();
}

function toggleWatch(id){
  const s=!ui[id].watch;
  ui[id].watch=s;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${s?"watch":"unwatch"}`,{method:"POST"});
  render();
}

function toggleAlarm(id){
  const s=!ui[id].alarm;
  ui[id].alarm=s;
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${s}`,{method:"POST"});
  render();
}

/* FULLSCREEN */
function toggleFullscreen(){
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
}

/* WS */
let ws;
function connect(){
  ws=new WebSocket("wss://gps-server-f9b6.onrender.com");
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    Array.isArray(d)?d.forEach(update):update(d);
  };
  ws.onclose=()=>setTimeout(connect,2000);
}
connect();

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(a=>a.forEach(update));

</script>

</body>
</html>
