<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS FAKE MOTION ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  width: 340px;
  max-height: 85vh;
  overflow: auto;

  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;

  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 FAKE MOTION GPS</b>
  <hr>
  <div id="list"></div>
  <hr>
  <div id="infoBox">👆 Select device</div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const rendered = new Set();

const smooth = {};
const lastRaw = {};
const heading = {};

/* =========================
   SAFE NUMBER
========================= */
function n(v){
  const x = Number(v);
  return Number.isFinite(x) ? x : null;
}

/* =========================
   HELPERS
========================= */
function lerp(a,b,t){
  return a + (b - a) * t;
}

function distance(a,b){
  const dx = a.lat - b.lat;
  const dy = a.lon - b.lon;
  return Math.sqrt(dx*dx + dy*dy);
}

/* =========================
   HEADING (CORRECT)
========================= */
function bearing(lat1, lon1, lat2, lon2){

  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);

  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* =========================
   ICON
========================= */
function icon(name, angle){

  const color =
    name?.toLowerCase().includes("nicole") ? "#ff3b30" :
    name?.toLowerCase().includes("oliver") ? "#0a84ff" :
    "#2ecc71";

  const initial = name ? name[0].toUpperCase() : "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="
        position:relative;
        transform:rotate(${angle}deg);
        font-size:42px;
        color:${color};
        text-shadow:-1px -1px 0 black,1px 1px 0 black;
      ">
        ➤
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          transform:translate(-50%,-50%) rotate(-${angle}deg);
          color:white;
          font-size:14px;
          font-weight:800;
        ">
          ${initial}
        </div>
      </div>
    `,
    iconSize:[42,42],
    iconAnchor:[21,21]
  });
}

/* =========================
   UPDATE (RAW → SMOOTH)
========================= */
function update(d){

  const id = d.deviceId;

  const lat = n(d.lat);
  const lon = n(d.lon);

  if(lat === null || lon === null) return;

  const raw = {lat, lon};

  lastRaw[id] = raw;

  if(!smooth[id]){
    smooth[id] = {lat, lon};
  }

  if(!heading[id]){
    heading[id] = 0;
  }

  const prev = smooth[id];

  /* REAL HEADING */
  heading[id] = bearing(prev.lat, prev.lon, lat, lon);

  /* STORE TARGET */
  smooth[id].target = raw;

  /* MARKER INIT */
  if(!markers[id]){
    markers[id] = L.marker([lat, lon], {
      icon: icon(d.name, heading[id])
    }).addTo(map);
  }

  renderList(d);
}

/* =========================
   ANIMATION LOOP (FAKE MOTION ENGINE)
========================= */
function animate(){

  Object.keys(smooth).forEach(id => {

    const s = smooth[id];
    if(!s.target) return;

    /* smooth movement */
    s.lat = lerp(s.lat, s.target.lat, 0.15);
    s.lon = lerp(s.lon, s.target.lon, 0.15);

    if(markers[id]){
      markers[id].setLatLng([s.lat, s.lon]);
      markers[id].setIcon(icon(lastRaw[id]?.name || "?", heading[id]));
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   LIST (NO DUPLICATES)
========================= */
function renderList(d){

  if(rendered.has(d.deviceId)) return;
  rendered.add(d.deviceId);

  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className="device";

  div.innerHTML=`
    <b>${d.name}</b><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%
  `;

  div.onclick=()=>{
    map.setView([d.lat, d.lon], 17);
  };

  el.appendChild(div);
}

/* =========================
   INFO
========================= */
function showInfo(d){
  document.getElementById("infoBox").innerHTML = `
    <b>${d.name}</b><br><br>
    🚗 ${d.speed} km/h<br>
    🔋 ${d.battery}%<br>
  `;
}

/* =========================
   LOAD
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(update);
}

load();

/* =========================
   WS
========================= */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (m)=>{
  try{
    update(JSON.parse(m.data));
  }catch(e){}
};

</script>

</body>
</html>
