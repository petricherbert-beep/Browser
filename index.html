<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

#panel{
  width:390px;
  margin:1.5cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  z-index:10;
}

#map{
  flex:1;
  margin:1.5cm;
  border-radius:20px;
  overflow:hidden;
  position:relative;

  filter: contrast(0.82) brightness(0.92) saturate(0.85);
}

.map-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:999;

  /* ✅ FIXED VIGNETTE */
  background: radial-gradient(circle at center,
    rgba(0,0,0,0.00) 0%,
    rgba(0,0,0,0.00) 55%,
    rgba(0,0,0,0.12) 75%,
    rgba(0,0,0,0.30) 90%,
    rgba(0,0,0,0.55) 100%
  );
}

/* chips */
.chip{font-size:11px;padding:2px 6px;border-radius:999px}
.online{color:#00ff7b}
.offline{color:#ff3b3b}
.alarm{color:#ff4d4d}

button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid #00ffb355;
  background:#0a141f;
  color:#c9d1d9;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>
<div class="map-overlay"></div>

<script>

/* STATE */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
const anim = {};
let followId = null;

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(map);

/* COLOR */
function color(n){
  n=(n||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#00ffb3";
}

/* ICON (RESTORED SHARP STYLE) */
function icon(name){
  const c = color(name);
  const letter = (name?.[0]||"?").toUpperCase();

  return L.divIcon({
    className:"",
    iconSize:[40,40],
    iconAnchor:[20,20],
    html:`
      <div style="text-align:center">
        <div style="
          font-size:26px;
          color:${c};
          text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        ">▲</div>
        <div style="position:absolute;margin-top:-18px;font-size:10px;color:#fff">${letter}</div>
      </div>
    `
  });
}

/* SMOOTH (no leak) */
function smooth(id, lat, lon){
  const m = markers[id];
  if(!m) return;

  if(anim[id]) cancelAnimationFrame(anim[id]);

  const start = m.getLatLng();
  const t0 = performance.now();

  function step(t){
    const p = Math.min((t-t0)/250,1);

    m.setLatLng([
      start.lat + (lat-start.lat)*p,
      start.lng + (lon-start.lng)*p
    ]);

    if(p<1) anim[id]=requestAnimationFrame(step);
  }

  anim[id]=requestAnimationFrame(step);
}

/* TRACK */
function track(id, lat, lon){
  const t = tracks[id];
  if(!t) return;

  const p = t.getLatLngs();
  p.push([lat,lon]);
  if(p.length>400) p.splice(0,p.length-400);
  t.setLatLngs(p);
}

/* UPDATE */
function update(d){
  const id = d.deviceId;
  const lat = +d.lat, lon = +d.lon;
  if(!lat||!lon) return;

  devices[id] = {...devices[id], ...d};
  ui[id] = ui[id] || {follow:false,track:false,watch:false};

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{icon:icon(d.name)}).addTo(map);
    tracks[id]=L.polyline([], {color:color(d.name),weight:3}).addTo(map);
  }

  smooth(id,lat,lon);
  track(id,lat,lon);

  if(followId===id){
    map.panTo([lat,lon]);
  }

  render();
}

/* FOLLOW */
function follow(id){
  ui[id].follow=!ui[id].follow;
  followId = ui[id].follow ? id : null;

  if(followId && devices[id]){
    map.flyTo([devices[id].lat,devices[id].lon],16);
  }

  render();
}

/* UI */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
      <div>
        <b>${d.name}</b>
        <span class="chip ${d.status==='online'?'online':'offline'}">
          ${d.status}
        </span><br>

        📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>

        <button onclick="follow('${id}')">FOLLOW</button>
      </div>
      <hr>
    `;
  });
}

/* LOAD */
fetch("https://gps-server-f9b6.onrender.com/devices")
.then(r=>r.json())
.then(a=>a.forEach(update));

/* WS */
let ws;
function connect(){
  ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage=(m)=>{
    const d=JSON.parse(m.data);
    Array.isArray(d)?d.forEach(update):update(d);
  };

  ws.onclose=()=>setTimeout(connect,2000);
}
connect();

</script>

</body>
</html>
