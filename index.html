<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:390px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.55);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:0 0 20px rgba(0,255,200,0.15);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  filter:brightness(0.8) saturate(1.1);
  box-shadow:0 0 50px rgba(0,255,200,0.25);
}

/* ALARM EFFECT */
#map.alarm{
  animation: flash 0.4s infinite;
  box-shadow:0 0 40px rgba(255,0,0,0.6);
}

@keyframes flash{
  0%,100%{filter:brightness(0.8) saturate(1);}
  50%{filter:brightness(1.6) saturate(2);}
}

/* DEVICE CARD */
.device{
  padding:10px;
  margin-bottom:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,200,0.12);
  box-shadow:0 0 10px rgba(0,255,200,0.08);
}

.info{
  font-size:12px;
  line-height:1.4;
  opacity:0.9;
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  cursor:pointer;
  background:#0a141f;
  color:#c9d1d9;
  border:1px solid rgba(0,255,200,0.15);
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 10px rgba(0,255,200,0.3);
}

/* ACTIVE STATES */
.active-follow{color:#3aa0ff; box-shadow:0 0 10px #3aa0ff;}
.active-track{color:#00ffb3; box-shadow:0 0 10px #00ffb3;}
.active-watch{color:#ffd84d; box-shadow:0 0 10px #ffd84d;}
.active-alarm{color:#ff4d4d; box-shadow:0 0 10px #ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS Control Center</b><br><br>
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* ================= STATE ================= */
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
let followId = null;

/* ================= MAP ================= */
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

/* ================= ALARM UI ================= */
function updateAlarmUI(){
  const any = Object.values(devices).some(d=>d.alarmActive);
  document.getElementById("map").classList.toggle("alarm", any);
}

/* ================= UPDATE ================= */
function update(d){
  const id = d.deviceId;
  if(!id) return;

  const lat = Number(d.lat);
  const lon = Number(d.lon);

  if(isNaN(lat) || isNaN(lon)) return;

  const prev = devices[id];

  // MERGE FIX
  devices[id] = {
    ...(devices[id]||{}),
    ...d,
    lat, lon
  };

  ui[id] = ui[id] || {follow:false,track:false,watch:false};

  if(!markers[id]){
    markers[id] = L.marker([lat,lon]).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);

  if(followId === id){
    map.panTo([lat,lon]);
  }

  updateAlarmUI();
  render();
}

/* ================= UI ================= */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  Object.entries(devices).forEach(([id,d])=>{

    const u = ui[id];

    el.innerHTML += `
      <div class="device">

        <b>${d.name || id}</b><br><br>

        <div class="info">
          📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
          ⚡ ${d.speed ?? 0} km/h<br>
          🔋 ${d.battery ?? "-"}%<br>
          🚶 ${d.isMotion ? "MOVING":"STILL"}<br>
          📶 ${d.isWifi ? "WIFI":"MOBILE"}<br>
          🔒 ${d.isLocked ? "LOCKED":"UNLOCKED"}<br>
          👀 ${d.isWatched ? "WATCHED":"NO"}<br>
          🚨 ${d.lastEvent ?? ""}
        </div>

        <hr>

        <button class="${u.follow?'active-follow':''}" onclick="follow('${id}')">FOLLOW</button>
        <button class="${u.track?'active-track':''}" onclick="track('${id}')">TRACK</button>
        <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
        <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>

      </div>
    `;
  });
}

/* ================= ACTIONS ================= */
function follow(id){
  Object.keys(ui).forEach(k=>ui[k].follow=false);
  ui[id].follow = !ui[id].follow;
  followId = ui[id].follow ? id : null;
  render();
}

function track(id){
  ui[id].track = !ui[id].track;
  render();
}

function watch(id){
  ui[id].watch = !ui[id].watch;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/${ui[id].watch?"watch":"unwatch"}`,{
    method:"POST"
  });

  render();
}

function alarm(id){
  devices[id].alarmActive = !devices[id].alarmActive;

  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=${devices[id].alarmActive}`,{
    method:"POST"
  });

  updateAlarmUI();
  render();
}

/* ================= FULLSCREEN ================= */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* ================= WS ================= */
function connectWS(){
  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = e=>{
    try{
      const d = JSON.parse(e.data);
      Array.isArray(d) ? d.forEach(update) : update(d);
    }catch(err){}
  };

  ws.onclose = ()=> setTimeout(connectWS,2000);
  ws.onerror = ()=> ws.close();
}

connectWS();

</script>

</body>
</html>
