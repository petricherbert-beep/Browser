<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Control Center</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#05070b;
  color:#c9d1d9;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* PANEL */
#panel{
  width:360px;
  margin:1cm;
  overflow:auto;
  background:rgba(10,15,25,0.6);
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(0,255,200,0.15);
  box-shadow:0 0 40px rgba(0,255,200,0.2);
}

/* MAP */
#map{
  flex:1;
  margin:1cm;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,255,200,0.25);
}

/* DEVICE */
.device{
  padding:10px;
  margin-bottom:10px;
  border:1px solid rgba(0,255,200,0.1);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
}

/* BUTTONS */
button{
  margin:3px;
  padding:6px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,200,0.2);
  background:#0a141f;
  color:#c9d1d9;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 10px rgba(0,255,200,0.4);
}

/* ACTIVE */
.active-follow{color:#3aa0ff;border-color:#3aa0ff;}
.active-track{color:#00ffb3;border-color:#00ffb3;}
.active-watch{color:#ffd84d;border-color:#ffd84d;}
.active-alarm{color:#ff4d4d;border-color:#ff4d4d;}
</style>
</head>

<body>

<div id="panel">
  <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

// 🔑 API KEY
const API_KEY = "LaLuna170284?;

// 🌐 SERVER
const BASE = "https://gps-server-f9b6.onrender.com";

// STATE
const devices = {};
const ui = {};
const markers = {};
const tracks = {};
let followId = null;

// MAP
const map = L.map("map").setView([47.09,15.42],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

// SOCKET
const socket = io(BASE);
socket.on("location_update", update);

// API HELPER
async function apiFetch(url, options = {}) {
  const res = await fetch(BASE + url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      ...(options.headers || {})
    }
  });

  if (!res.ok) {
    const text = await res.text();
    console.error("SERVER ERROR:", res.status, text);
  }

  return res;
}

// UPDATE
function update(d){
  const id=d.deviceId;
  if(!d.lat || !d.lon) return;

  devices[id]={...devices[id],...d};
  ui[id]=ui[id]||{follow:false,track:false,watch:false};

  if(!markers[id]){
    markers[id]=L.marker([d.lat,d.lon]).addTo(map);
  }

  markers[id].setLatLng([d.lat,d.lon]);

  if(ui[id].track){
    if(!tracks[id]){
      tracks[id]=L.polyline([],{color:"#00ffb3"}).addTo(map);
    }
    const pts=tracks[id].getLatLngs();
    pts.push([d.lat,d.lon]);
    if(pts.length>200) pts.shift();
    tracks[id].setLatLngs(pts);
  }

  if(followId===id){
    map.panTo([d.lat,d.lon]);
  }

  render();
}

// UI
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  Object.entries(devices).forEach(([id,d])=>{
    const u=ui[id];

    el.innerHTML+=`
    <div class="device">
      <b>${d.name||id}</b><br>
      📍 ${(+d.lat).toFixed(5)}, ${(+d.lon).toFixed(5)}<br>
      ⚡ ${d.speed||0} km/h<br>
      🔋 ${d.battery||"-"}%<br>
      📡 ${(Date.now()-d.lastSeen<60000)?"🟢":"🔴"}<br>

      <hr>

      <button class="${u.follow?'active-follow':''}" onclick="follow('${id}')">FOLLOW</button>
      <button class="${u.track?'active-track':''}" onclick="track('${id}')">TRACK</button>
      <button class="${u.watch?'active-watch':''}" onclick="watch('${id}')">WATCH</button>
      <button class="${d.alarmActive?'active-alarm':''}" onclick="alarm('${id}')">ALARM</button>
    </div>
    `;
  });
}

// ACTIONS
function follow(id){
  ui[id].follow=!ui[id].follow;
  followId=ui[id].follow?id:null;
  render();
}

function track(id){
  ui[id].track=!ui[id].track;
  render();
}

async function watch(id){
  const newState=!ui[id].watch;
  ui[id].watch=newState;
  render();

  await apiFetch(`/devices/${id}/watch`,{
    method:"POST",
    body:JSON.stringify({watch:newState})
  });
}

async function alarm(id){
  const state=!devices[id].alarmActive;
  devices[id].alarmActive=state;
  render();

  await apiFetch(`/devices/${id}/alarm?active=${state}`,{
    method:"POST"
  });
}

// FULLSCREEN
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

// INIT LOAD
apiFetch("/devices")
.then(r=>r.json())
.then(arr=>arr.forEach(update));

</script>

</body>
</html>
