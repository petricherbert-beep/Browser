<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS ULTRA PRO (Leaflet MAX)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; background:#0b0f14; font-family:system-ui; }
#map { height:100vh; }

/* PANEL */
#panel {
  position:absolute;
  bottom:0;
  width:100%;
  max-height:35%;
  background:rgba(20,20,20,0.85);
  backdrop-filter:blur(12px);
  color:white;
  padding:10px;
  border-radius:16px 16px 0 0;
  overflow:auto;
  z-index:9999;
}

.device {
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
}

.device:hover { background:rgba(255,255,255,0.05); }

button {
  margin-top:6px;
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#1f1f1f;
  color:white;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 ULTRA PRO (Leaflet)</b>

  <button onclick="toggleNav()">📍 Toggle Navigation</button>

  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP
========================= */
const map = L.map("map").setView([47.09, 15.42], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const devices = {};
const trails = {};

let followedId = null;
let navigationMode = false;

/* =========================
   HELPERS
========================= */
function bearing(lat1, lon1, lat2, lon2){
  const toRad = d=>d*Math.PI/180;
  const toDeg = r=>r*180/Math.PI;

  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* =========================
   CAMERA (FAKE NAV)
========================= */
function follow(lat, lon, heading){

  const offset = 0.0015;
  const rad = heading*Math.PI/180;

  const camLat = lat - Math.cos(rad)*offset;
  const camLon = lon - Math.sin(rad)*offset;

  map.setView([camLat, camLon], map.getZoom(), {
    animate:true,
    duration:0.25
  });
}

/* =========================
   ICON
========================= */
function icon(angle){
  return L.divIcon({
    className:"",
    html:`<div style="transform:rotate(${angle}deg);font-size:34px;">➤</div>`,
    iconSize:[30,30],
    iconAnchor:[15,15]
  });
}

/* =========================
   UPDATE
========================= */
function update(d){

  const {deviceId, lat, lon} = d;

  if(!devices[deviceId]){
    devices[deviceId] = {
      current:{lat,lon},
      target:{lat,lon},
      last:null,
      heading:0,
      marker:L.marker([lat,lon],{icon:icon(0)}).addTo(map)
    };

    trails[deviceId] = L.polyline([], {color:"cyan"}).addTo(map);

    devices[deviceId].marker.on("click",()=>{
      followedId = deviceId;
      navigationMode = true;
    });

    render(d);
  }

  devices[deviceId].target = {lat,lon};
}

/* =========================
   ENGINE
========================= */
function animate(){

  Object.keys(devices).forEach(id=>{

    const dev = devices[id];
    const c = dev.current;
    const t = dev.target;

    c.lat += (t.lat - c.lat)*0.15;
    c.lon += (t.lon - c.lon)*0.15;

    if(dev.last){
      let raw = bearing(dev.last.lat, dev.last.lon, c.lat, c.lon);

      let diff = raw - dev.heading;
      if(diff>180) diff-=360;
      if(diff<-180) diff+=360;

      dev.heading += diff*0.2;
    }

    dev.last = {lat:c.lat, lon:c.lon};

    dev.marker.setLatLng([c.lat, c.lon]);
    dev.marker.setIcon(icon(dev.heading));

    trails[id].addLatLng([c.lat, c.lon]);

    if(trails[id].getLatLngs().length > 40){
      trails[id].setLatLngs(trails[id].getLatLngs().slice(-40));
    }

    if(navigationMode && id===followedId){
      follow(c.lat, c.lon, dev.heading);
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   UI
========================= */
function render(d){
  const el = document.getElementById("list");

  const div = document.createElement("div");
  div.className="device";

  div.innerHTML = `<b>${d.name}</b><br>🚗 ${d.speed} km/h`;

  div.onclick = ()=>{
    followedId = d.deviceId;
    navigationMode = true;
  };

  el.appendChild(div);
}

function toggleNav(){
  navigationMode = !navigationMode;
}

/* =========================
   LOAD
========================= */
async function load(){
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data = await res.json();

  data.forEach(update);
}

load();

/* =========================
   WS RECONNECT
========================= */
function connectWS(){

  const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

  ws.onmessage = m=>{
    const d = JSON.parse(m.data);
    update(d);
  };

  ws.onclose = ()=>{
    setTimeout(connectWS,2000);
  };
}

connectWS();

</script>

</body>
</html>
