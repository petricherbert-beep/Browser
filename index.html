<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS NAVIGATION PRO</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 380px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 12px;
  border-radius: 14px;
}

button {
  margin: 3px;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.follow { background:#0a84ff; color:white; }
.watch { background:#ffcc00; color:black; }

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.2); opacity: 0; }
}
</style>
</head>

<body>

<div id="panel">
  <b>🧭 GPS NAVIGATION PRO</b><br><br>

  <button onclick="toggleNavMode()" style="background:#00c2ff;color:white;">
    🧭 Navigation Mode
  </button>

  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* MAP */
const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* STATE */
const markers = {};
const tracks = {};
const list = [];
const last = {};
const angles = {};

let followId = null;
let navigationMode = false;

let smoothAngle = 0;

const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

/* COLOR */
function getColor(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

/* BEARING */
function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* SMOOTH ANGLE */
function smooth(a){
  let diff = a - smoothAngle;
  diff = ((diff + 540) % 360) - 180;
  smoothAngle += diff * 0.12;
  return smoothAngle;
}

/* ICON */
function icon(name, angle, isWatched, accuracy){

  const color = getColor(name);
  const letter = (name?.[0] || "?").toUpperCase();

  const acc = accuracy ? Math.min(Math.max(accuracy * 2, 25), 140) : 60;

  return L.divIcon({
    className:"",
    html:`
      <div style="width:70px;height:70px;position:relative;">

        <!-- ACCURACY -->
        <div style="
          position:absolute;
          top:50%;
          left:50%;
          width:${acc}px;
          height:${acc}px;
          transform:translate(-50%,-50%);
          border-radius:50%;
          background:rgba(100,150,255,0.12);
          border:1px solid rgba(100,150,255,0.25);
        "></div>

        <!-- WATCH -->
        ${isWatched ? `
          <div style="
            position:absolute;
            width:86px;
            height:86px;
            border:2px solid gold;
            border-radius:50%;
            animation:pulse 1.5s infinite;
          "></div>
        ` : ''}

        <!-- ARROW -->
        <div style="
          position:absolute;
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
        ">
          <div style="
            transform: rotate(${angle}deg);
            transition: transform 0.15s linear;
            font-size:38px;
            color:${color};
            display:flex;
            align-items:center;
            justify-content:center;
          ">
            ➤
            <span style="
              position:absolute;
              font-size:12px;
              font-weight:700;
              color:white;
            ">
              ${letter}
            </span>
          </div>
        </div>

      </div>
    `,
    iconSize:[70,70],
    iconAnchor:[35,35]
  });
}

/* TIME */
function timeAgo(ts){
  const diff = Date.now() - ts;
  const sec = Math.floor(diff / 1000);
  if(sec < 10) return "gerade eben";
  if(sec < 60) return sec + "s";
  return Math.floor(sec/60) + " min";
}

/* NAV MODE TOGGLE */
function toggleNavMode(){
  navigationMode = !navigationMode;

  if(!navigationMode){
    const pane = map.getPane("mapPane");
    if(pane){
      pane.style.transform = "rotate(0deg)";
    }
  }
}

/* CAMERA */
function updateCamera(){

  if(!followId) return;

  const pos = markers[followId]?.getLatLng();
  if(!pos) return;

  const angle = angles[followId] || 0;

  if(navigationMode){

    const a = smooth(angle || 0);

    map.panTo(pos, {animate:true, duration:0.3});
    map.setZoom(18);

    const pane = map.getPane("mapPane");
    if(pane){
      pane.style.transform = `rotate(${-a}deg)`;
      pane.style.transformOrigin = "center";
    }

    return;
  }

  map.panTo(pos, {animate:true, duration:0.25});
}

/* UPDATE */
function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);
  if(lat===null||lon===null) return;

  const prev = last[id];

  if(prev && (lat !== prev.lat || lon !== prev.lon)){
    const raw = bearing(prev.lat, prev.lon, lat, lon);

    const delta = Math.abs(raw - (angles[id] || 0));
    if(delta > 1.5){
      angles[id] = raw;
    }
  }

  last[id] = {lat,lon};

  if(!markers[id]){
    markers[id] = L.marker([lat,lon],{
      icon: icon(d.name, angles[id] || 0, d.isWatched, d.accuracy)
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name, angles[id] || 0, d.isWatched, d.accuracy));

  /* TRACK */
  if(d.isWatched){
    if(!tracks[id]){
      tracks[id] = L.polyline([], {
        color: getColor(d.name),
        weight: 4,
        opacity: 0.85
      }).addTo(map);
    }
    tracks[id].addLatLng([lat,lon]);
  }

  /* ALARM */
  if(d.alarmActive && d.isWatched){
    const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
    map.panTo([lat,lon]);
  }

  const ex = list.find(x=>x.deviceId===id);
  if(!ex) list.push(d);
  else Object.assign(ex,d);

  updateCamera();
  render();
}

/* UI */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  list.forEach(d => {

    const speed = (d.speed ?? 0) * 3.6;

    const div = document.createElement("div");
    div.className = "device";

    div.innerHTML = `
      <b>${d.name}</b><br>

      📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
      🚗 Speed: ${speed.toFixed(1)} km/h<br>
      🎯 Accuracy: ${d.accuracy ?? "-"} m<br>
      🔋 Akku: ${d.battery ?? "-"}%<br>
      📡 Status: ${d.status ?? "unknown"}<br>
      ⏱️ Zuletzt: ${timeAgo(d.timestamp)}<br><br>

      <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
      <button onclick="unwatch('${d.deviceId}')">Unwatch</button>
      <button class="follow" onclick="followId='${d.deviceId}'">Follow</button>
    `;

    el.appendChild(div);
  });
}

/* ACTIONS */
function watch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/watch",{method:"POST"});
}

function unwatch(id){
  fetch("https://gps-server-f9b6.onrender.com/devices/"+id+"/unwatch",{method:"POST"});
}

/* LOAD */
async function load(){
  const r = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const d = await r.json();
  d.forEach(update);
}
load();

/* WS */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");
ws.onmessage = (m)=>{ try{ update(JSON.parse(m.data)); }catch(e){} };

</script>

</body>
</html>
