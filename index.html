<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map {
  height: 100vh;
}

/* 🖤 Panel */
#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;

  background: rgba(20,20,20,0.75);
  backdrop-filter: blur(12px);
  color: white;

  padding: 14px;
  border-radius: 14px;
  width: 280px;
  max-height: 80vh;
  overflow: auto;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

.online { color: #2ecc71; }
.idle { color: #f1c40f; }
.offline { color: #e74c3c; }
</style>
</head>

<body>

<div id="panel">
  <b>📡 Tracker</b>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* =========================
   STATE
========================= */
const markers = {};
const lastPos = {};
const lastAngle = {};
const current = {};
const target = {};
let followId = null;

/* =========================
   MATH
========================= */
function lerp(a,b,t){ return a + (b-a)*t; }

function bearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;

  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);

  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

/* =========================
   ICON (PFEIL + INITIAL + FARBE)
========================= */
function createArrowIcon(angle, name="") {
  const n = (name||"").toLowerCase();

  let color = "#2ecc71";
  if (n.includes("nicole")) color = "#ff3b30"; // rot
  if (n.includes("oliver")) color = "#0a84ff"; // blau

  const initial = (name && name.length > 0)
    ? name[0].toUpperCase()
    : "?";

  return L.divIcon({
    className: "",
    html: `
      <div style="
        transform: rotate(${angle}deg);
        width: 44px;
        height: 44px;

        display:flex;
        align-items:center;
        justify-content:center;

        background: ${color};
        border: 2px solid rgba(0,0,0,0.6);
        border-radius: 50% 50% 50% 0;
        transform-origin: center;

        box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      ">
        <div style="
          transform: rotate(-${angle}deg);
          color:white;
          font-weight:700;
          font-size:16px;
        ">${initial}</div>
      </div>
    `,
    iconSize: [44,44],
    iconAnchor: [22,22]
  });
}

/* =========================
   LIST
========================= */
function renderList(devs){
  const list = document.getElementById("list");
  list.innerHTML = "";

  devs.forEach(d=>{
    const div = document.createElement("div");
    div.className = "device";

    div.innerHTML = `
      <b>${d.name}</b><br>
      <small class="${d.status}">● ${d.status}</small><br>
      🔋 ${d.battery}% | 🚗 ${d.speed} km/h
    `;

    div.onclick = ()=>{
      followId = d.deviceId;
      map.setView([d.lat,d.lon],17);
      markers[d.deviceId]?.openPopup();
    };

    list.appendChild(div);
  });
}

/* =========================
   UPDATE
========================= */
function update(d){
  const {deviceId,lat,lon,speed,battery,accuracy,name,status}=d;

  target[deviceId]={lat,lon};

  if(!current[deviceId]){
    current[deviceId]={lat,lon};
  }

  if(!markers[deviceId]){
    const m=L.marker([lat,lon],{
      icon:createArrowIcon(0,name)
    }).addTo(map);

    m.bindPopup(`
      <div style="min-width:200px">
        <b style="font-size:16px;">📍 ${name}</b><br><br>
        📌 Lat: ${lat.toFixed(5)}<br>
        📌 Lon: ${lon.toFixed(5)}<br>
        🚗 Speed: ${speed} km/h<br>
        🔋 Battery: ${battery}%<br>
        🎯 Accuracy: ${accuracy} m<br>
        📡 Status: ${status}
      </div>
    `);

    markers[deviceId]=m;
  }
}

/* =========================
   ANIMATION LOOP
========================= */
function animate(){
  Object.keys(target).forEach(id=>{

    const c=current[id];
    const t=target[id];

    if(!c||!t) return;

    const newLat=lerp(c.lat,t.lat,0.08);
    const newLon=lerp(c.lon,t.lon,0.08);

    /* Richtung */
    let ang=lastAngle[id]||0;
    if(lastPos[id]){
      ang=bearing(lastPos[id].lat,lastPos[id].lon,newLat,newLon);
    }

    lastAngle[id]=ang;
    lastPos[id]=t;

    c.lat=newLat;
    c.lon=newLon;

    if(markers[id]){
      markers[id].setLatLng([newLat,newLon]);
      markers[id].setIcon(createArrowIcon(ang, id));
    }

    /* Follow */
    if(followId===id){
      map.setView([newLat,newLon],map.getZoom(),{animate:false});
    }

  });

  requestAnimationFrame(animate);
}

animate();

/* =========================
   LOAD
========================= */
async function load(){
  const res=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await res.json();

  data.forEach(update);
  renderList(data);
}

load();

/* =========================
   WS
========================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  const d=JSON.parse(m.data);
  update(d);
  load();
};

</script>

</body>
</html>
