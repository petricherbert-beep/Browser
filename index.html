<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
}

#map {
  height: 100vh;
}

/* 📋 Panel */
#panel {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 9999;
  background: white;
  padding: 12px;
  border-radius: 12px;
  width: 260px;
  max-height: 80vh;
  overflow: auto;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.device {
  padding: 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.device:hover {
  background: #f5f5f5;
}

.online { color: #2ecc71; }
.idle { color: #f1c40f; }
.offline { color: #e74c3c; }

/* ➤ Marker */
.arrow-icon div {
  transition: transform 0.3s linear;
  text-shadow: 0 0 6px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div id="panel">
  <b>📡 Devices</b>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const markers = {};
const lastPositions = {};
const lastAngles = {};
let followedDevice = null;

/* 🧭 Richtung */
function getBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* ➤ ICON (GRÖSSER + FARBE) */
function createArrowIcon(angle, name="") {
  let color = "#2ecc71"; // default grün

  if (name.toLowerCase().includes("nicole")) color = "#e74c3c"; // rot
  if (name.toLowerCase().includes("oliver")) color = "#3498db"; // blau

  return L.divIcon({
    className: "",
    html: `
      <div style="
        transform: rotate(${angle}deg);
        font-size: 40px;
        font-weight: bold;
        color:${color};
        text-shadow: 0 0 6px rgba(0,0,0,0.4);
      ">➤</div>
    `,
    iconSize: [50,50],
    iconAnchor: [25,25]
  });
}

/* 📋 Liste */
function renderList(devices) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  devices.forEach(d => {
    const div = document.createElement("div");
    div.className = "device";

    div.innerHTML = `
      <b>${d.name || d.deviceId}</b><br>
      <small class="${d.status}">● ${d.status}</small><br>
      🔋 ${d.battery}% | 🚗 ${d.speed} km/h
    `;

    div.onclick = () => {
      map.setView([d.lat, d.lon], 17);
      markers[d.deviceId]?.openPopup();
      followedDevice = d.deviceId;
    };

    list.appendChild(div);
  });
}

/* 📍 UPDATE */
function updateDevice(d) {
  const { deviceId, lat, lon, speed, battery, accuracy, name, status } = d;

  let angle = lastAngles[deviceId] || 0;

  if (lastPositions[deviceId]) {
    const prev = lastPositions[deviceId];
    const newAngle = getBearing(prev.lat, prev.lon, lat, lon);

    if (speed > 1) {
      angle = angle + (newAngle - angle) * 0.3;
      lastAngles[deviceId] = angle;
    }
  }

  lastPositions[deviceId] = { lat, lon };

  if (!markers[deviceId]) {
    const marker = L.marker([lat, lon], {
      icon: createArrowIcon(angle, name)
    }).addTo(map);

    marker.bindPopup(`
      <div style="min-width:180px">
        <b>📱 ${name || deviceId}</b><br><br>

        📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
        🚗 Speed: ${speed} km/h<br>
        🔋 Battery: ${battery}%<br>
        🎯 Accuracy: ${accuracy} m<br>
        📡 Status: ${status}
      </div>
    `);

    markers[deviceId] = marker;
  } else {
    markers[deviceId].setLatLng([lat, lon]);
    markers[deviceId].setIcon(createArrowIcon(angle, name));
  }

  if (followedDevice === deviceId) {
    map.setView([lat, lon], 17, { animate: true });
  }
}

/* 📡 INIT LOAD */
async function loadDevices() {
  const res = await fetch("https://gps-server-f9b6.onrender.com/devices");
  const devices = await res.json();

  devices.forEach(updateDevice);
  renderList(devices);
}

loadDevices();

/* 🌐 WEBSOCKET */
const ws = new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  updateDevice(data);
  loadDevices();
};

</script>

</body>
</html>
