<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS CLEAN REBUILD</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<style>
body { margin:0; font-family:system-ui; background:#0b0f14; }
#map { height:100vh; }

#panel {
  position:absolute;
  top:12px; left:12px;
  width:400px;
  max-height:85vh;
  overflow:auto;
  background:rgba(20,20,20,0.92);
  backdrop-filter:blur(14px);
  color:white;
  padding:12px;
  border-radius:14px;
  z-index:9999;
}

button {
  margin:3px;
  padding:6px 8px;
  border:none;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.follow { background:#0a84ff; color:white; }
.watch { background:#ffcc00; color:black; }
.alarm { background:#ff3b30; color:white; }
</style>
</head>

<body>

<div id="panel">
  <b>🧠 CLEAN GPS SYSTEM</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   1. STATE LAYER
========================= */

const state = {
  devices: {},
  markers: {},
  tracks: {},
  lastPos: {},
  heading: {},
  watch: {},
  follow: {},
  activeFollow: null,
  alarm: {}
};

/* =========================
   2. MAP INIT
========================= */

const map = L.map("map").setView([47.09,15.42],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* =========================
   3. HELPERS
========================= */

const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function color(name){
  const n=(name||"").toLowerCase();
  if(n.includes("oliver")) return "#3aa0ff";
  if(n.includes("nicole")) return "#ff4d4d";
  return "#4dffb5";
}

function bearing(a,b,c,d){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
    Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

/* =========================
   4. ICON
========================= */

function icon(name){

  const col = color(name);
  const letter = (name?.[0] || "?").toUpperCase();

  return L.divIcon({
    className:"",
    html:`
      <div style="
        width:70px;height:70px;
        display:flex;
        align-items:center;
        justify-content:center;
        position:relative;
      ">

        <div style="
          position:absolute;
          width:16px;height:16px;
          border-radius:50%;
          background:${col};
        "></div>

        <div style="
          font-size:34px;
          color:${col};
          transform: rotate(0deg);
        ">▲</div>

        <div style="
          position:absolute;
          font-size:11px;
          font-weight:800;
          color:white;
        ">${letter}</div>

      </div>
    `
  });
}

/* =========================
   5. UPDATE CORE (REALTIME)
========================= */

function update(d){

  const id = d.deviceId;
  const lat = n(d.lat);
  const lon = n(d.lon);
  if(lat===null||lon===null) return;

  const prev = state.lastPos[id];

  let heading = state.heading[id];

  if(prev){

    const moved =
      Math.abs(lat-prev.lat)>0.00001 ||
      Math.abs(lon-prev.lon)>0.00001;

    if(moved && (d.speed ?? 0) > 0.5){
      heading = bearing(prev.lat,prev.lon,lat,lon);
      state.heading[id]=heading;
    }
  }

  state.lastPos[id]={lat,lon};
  state.devices[id]=d;

  /* MARKER */
  if(!state.markers[id]){

    state.markers[id]=L.marker([lat,lon],{
      icon:icon(d.name),
      rotationAngle:0,
      rotationOrigin:"center"
    }).addTo(map);

    state.tracks[id]=L.polyline([],{
      color:color(d.name),
      weight:4,
      opacity:0.8
    }).addTo(map);
  }

  state.markers[id].setLatLng([lat,lon]);
  state.markers[id].setRotationAngle(heading||0);

  state.tracks[id].addLatLng([lat,lon]);

  /* FOLLOW */
  if(state.activeFollow === id){
    map.panTo([lat,lon],{animate:true,duration:0.2});
  }

  /* ALARM */
  state.alarm[id]=d.alarmActive;

  render();
}

/* =========================
   6. ACTIONS
========================= */

function watch(id){
  state.watch[id]=true;
  fetch(`/devices/${id}/watch`,{method:"POST"});
}

function unwatch(id){
  state.watch[id]=false;
  fetch(`/devices/${id}/unwatch`,{method:"POST"});
}

function follow(id){
  state.activeFollow=id;
}

function toggleAlarm(id){

  const newState = !state.alarm[id];
  state.alarm[id]=newState;

  fetch(`/devices/${id}/alarm`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ alarmActive:newState })
  });
}

/* =========================
   7. UI (LIGHTWEIGHT)
========================= */

function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  Object.values(state.devices).forEach(d=>{

    const speed=(d.speed??0)*3.6;

    el.innerHTML+=`
      <div style="padding:10px;border-bottom:1px solid #333;">
        <b>${d.name}</b><br>
        📍 ${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}<br>
        🚗 ${speed.toFixed(1)} km/h<br>
        🔋 ${d.battery??"-"}%<br>
        📡 ${d.status??"unknown"}<br>

        <div style="color:${state.alarm[d.deviceId] ? '#ff3b30' : '#888'};">
          ${state.alarm[d.deviceId] ? "🚨 ALARM" : "OK"}
        </div>

        <button class="watch" onclick="watch('${d.deviceId}')">Watch</button>
        <button onclick="unwatch('${d.deviceId}')">Unwatch</button>
        <button class="follow" onclick="follow('${d.deviceId}')">Follow</button>
        <button class="alarm" onclick="toggleAlarm('${d.deviceId}')">Alarm</button>
      </div>
    `;
  });
}

/* =========================
   8. DATA LAYER (WS)
========================= */

const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  try{
    update(JSON.parse(m.data));
  }catch(e){}
};

</script>

</body>
</html>
