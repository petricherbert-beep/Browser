<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS PRO TRACKING UI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
}

#map { height: 100vh; }

#panel {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9999;
  width: 330px;
  max-height: 85vh;
  overflow: auto;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(14px);
  color: white;
  padding: 14px;
  border-radius: 14px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.device:hover {
  background: rgba(255,255,255,0.06);
}

button {
  margin: 3px;
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
}

.alarm-on { background:#ff3b30; color:white; }
.alarm-off { background:#34c759; color:white; }

.glass-popup {
  backdrop-filter: blur(14px);
  background: rgba(28,28,30,0.65);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  width: 230px;
  color: white;
  font-family: system-ui;
  box-shadow: 0 12px 35px rgba(0,0,0,0.45);
}

.bar {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 4px;
}

.bar > div {
  height: 100%;
  transition: width 0.4s ease;
}

.speed-bar { background:#0a84ff; }

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.9; }
  70% { transform: scale(1.8); opacity: 0; }
  100% { transform: scale(1.8); opacity: 0; }
}

.pulse-ring {
  position:absolute;
  width:60px;
  height:60px;
  border:3px solid red;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation: pulse 1.2s infinite;
}
</style>
</head>

<body>

<div id="panel">
  <b>🚗 GPS PRO TRACKING UI</b>
  <hr>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map("map").setView([47.09, 15.42], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

/* ================= STATE ================= */
const markers = {};
const lastRaw = {};
const deviceList = [];
const trails = {};
const alarmState = {};

let followDeviceId = null;
let followMode = false;
let autoFollow = false;

/* ================= AUDIO ================= */
let alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarmAudio.loop = true;
let audioUnlocked = false;

document.addEventListener("click", () => {
  if(!audioUnlocked){
    alarmAudio.play().then(()=>{
      alarmAudio.pause();
      audioUnlocked = true;
    }).catch(()=>{});
  }
});

/* ================= HELPERS ================= */
const n = v => Number.isFinite(Number(v)) ? Number(v) : null;

function distance(lat1,lon1,lat2,lon2){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
    Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearing(lat1,lon1,lat2,lon2){
  const toRad=d=>d*Math.PI/180,toDeg=r=>r*180/Math.PI;
  const dLon=toRad(lon2-lon1);
  const y=Math.sin(dLon)*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function speak(text){
  const msg=new SpeechSynthesisUtterance(text);
  msg.lang="de-DE";
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

/* ================= ICON ================= */
function icon(name,angle,alarm){
  const color = alarm ? "#ff3b30" : "#2ecc71";
  const letter = name?.[0]?.toUpperCase() || "?";

  return L.divIcon({
    className:"",
    html:`
      <div style="position:relative;width:60px;height:60px;">
        ${alarm?'<div class="pulse-ring"></div>':''}
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(${angle}deg);font-size:42px;color:${color};">
          ➤
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-${angle}deg);color:white;font-size:13px;">
            ${letter}
          </div>
        </div>
      </div>
    `,
    iconSize:[60,60],
    iconAnchor:[30,30]
  });
}

/* ================= UPDATE ================= */
function update(d){

  const id=d.deviceId;
  const lat=n(d.lat);
  const lon=n(d.lon);
  if(!lat||!lon)return;

  const prev=lastRaw[id];

  if(prev){
    const dist=distance(prev.lat,prev.lon,lat,lon);
    if(dist<5)return;
  }

  let angle=0;
  if(prev) angle=bearing(prev.lat,prev.lon,lat,lon);

  lastRaw[id]={lat,lon};

  if(!trails[id]) trails[id]=[];
  trails[id].push([lat,lon]);
  if(trails[id].length>50) trails[id].shift();

  if(!markers[id]){
    markers[id]=L.marker([lat,lon],{
      icon:icon(d.name,angle,d.alarmActive)
    }).addTo(map);

    markers[id].trail=L.polyline([],{
      color:"#0a84ff",
      weight:3
    }).addTo(map);
  }

  markers[id].setLatLng([lat,lon]);
  markers[id].setIcon(icon(d.name,angle,d.alarmActive));
  markers[id].trail.setLatLngs(trails[id]);

  const ex=deviceList.find(x=>x.deviceId===id);
  if(!ex) deviceList.push(d);
  else Object.assign(ex,d);

  /* ALARM */
  if(d.alarmActive && !alarmState[id]){
    alarmState[id]=true;
    if(audioUnlocked){ alarmAudio.play(); }
    speak(`Alarm bei ${d.name}`);
    map.flyTo([lat,lon],18);
  }

  if(!d.alarmActive && alarmState[id]){
    alarmState[id]=false;
    alarmAudio.pause();
    speak(`Alarm beendet bei ${d.name}`);
  }

  /* FOLLOW */
  if(followMode && followDeviceId===id){
    map.panTo([lat,lon],{animate:true,duration:0.5});
  }

  /* AUTO FOLLOW */
  if(autoFollow && followDeviceId===id && d.speed>1){
    map.panTo([lat,lon],{animate:true,duration:0.5});
  }

  render();
}

/* ================= RENDER ================= */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  deviceList.forEach(d=>{

    const div=document.createElement("div");
    div.className="device";

    div.innerHTML=`
      <b>${d.name}</b><br>
      🚗 ${d.speed} km/h<br>
      📡 ${d.accuracy??"?"} m<br>
      🔋 ${d.battery}%<br><br>

      <button class="alarm-on" onclick="alarmOn('${d.deviceId}')">🚨 Alarm</button>
      <button class="alarm-off" onclick="alarmOff('${d.deviceId}')">🛑 Stop</button>
      <button onclick="toggleFollow('${d.deviceId}')">👁 Follow</button>
      <button onclick="toggleAutoFollow()">🎯 Auto</button>
    `;

    div.onclick=(e)=>{
      if(e.target.tagName!=="BUTTON"){
        map.setView([d.lat,d.lon],17);
      }
    };

    el.appendChild(div);
  });
}

/* ================= CONTROLS ================= */
function alarmOn(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=true`,{method:"POST"});
}

function alarmOff(id){
  fetch(`https://gps-server-f9b6.onrender.com/devices/${id}/alarm?active=false`,{method:"POST"});
}

function toggleFollow(id){
  followDeviceId=id;
  followMode=true;
}

function toggleAutoFollow(){
  autoFollow=!autoFollow;
}

/* ================= LOAD ================= */
async function load(){
  const res=await fetch("https://gps-server-f9b6.onrender.com/devices");
  const data=await res.json();
  data.forEach(update);
}
load();

/* ================= WS ================= */
const ws=new WebSocket("wss://gps-server-f9b6.onrender.com");

ws.onmessage=(m)=>{
  try{update(JSON.parse(m.data));}catch(e){}
};

</script>
</body>
</html>
